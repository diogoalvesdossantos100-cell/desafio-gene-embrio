function viewer(canvas,camZ){const o={on:false,running:false,ry:.3,rx:.25,auto:true};const R=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,100);cam.position.z=camZ;sc.add(new THREE.AmbientLight(0xffffff,.65));const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(3,5,6);sc.add(dl);const root=new THREE.Group();sc.add(root);

 else{$("#lb").textContent="Aberto ↔ Fechado";const W=48,H=24;const g=new THREE.PlaneGeometry(1,1,W,H);const mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x8e6bd8,side:THREE.DoubleSide,roughness:.5}));v.root.add(mesh);const pos=g.attributes.position;const up=()=>{const c=rg.value/100*2.0+.001;for(let j=0;j<=H;j++)for(let i=0;i<=W;i++){const k=j*(W+1)+i;const s=(i/W-.5)*3,z=(j/H-.5)*4;pos.setXYZ(k,Math.sin(c*s)/c,-(1-Math.cos(c*s))/c+.6,z)}pos.needsUpdate=true;g.computeVertexNormals();$("#d3").textContent=rg.value<30?"Placa neural aberta, como uma folha.":rg.value<80?"As bordas sobem e se aproximam.":"Tubo neural fechado: vira cérebro e medula."};rg.oninput=up;up()}
