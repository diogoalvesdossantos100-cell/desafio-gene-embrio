/* Layout: cabeçalho fixo com perfil, conteúdo em coluna única no celular, navegação inferior. Identidade: verde-clínico sobre fundo quase preto. */
:root{color-scheme:dark;
--bg:#09100d;--s1:#101a15;--s2:#16241d;--s3:#1c2e25;--line:#233a2f;--ink:#e8f3ed;--ink2:#a9c0b4;--mut:#7d9588;
--g:#3ddc97;--g2:#1f9d6d;--gd:#0c2a1f;--amb:#f2b84b;--red:#ff7a7a;--blue:#5cb8ff;--vio:#c48bff;
--disp:'Sora','Segoe UI',system-ui,sans-serif;--body:'Figtree','Segoe UI',system-ui,sans-serif}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);padding-inline:16px;padding-block:0 96px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--g);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance}
.wrap{max-width:920px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--bg) 82%,transparent);padding-block:12px 10px}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--g);color:#052015;display:grid;place-items:center;font:700 .8rem var(--disp);flex:none}
.brand b{font:600 1rem var(--disp);display:block;line-height:1.1}
.brand small{color:var(--mut);font-size:.72rem;display:block}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;color:var(--ink2);font-weight:600;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--g);color:#052015}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(9,16,13,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
nav.bar .in{max-width:920px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
nav.bar button{background:transparent;border:0;border-radius:12px;padding:8px 4px;color:var(--mut);font-weight:600;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bar button[aria-current="page"]{color:var(--g);background:var(--gd)}
.hero{padding-block:14px 6px}
.hero h1{font-size:1.5rem;line-height:1.15}
.hero p{margin:6px 0 0;color:var(--ink2);max-width:60ch}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:12px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.84rem;color:var(--ink2)}
.chip[aria-pressed="true"]{border-color:var(--c,var(--g));color:var(--c,var(--g));background:var(--s2)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font:600 .7rem var(--disp);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.res{display:grid;gap:10px;margin:12px 0 0;padding:0;list-style:none}
.res li{display:grid;gap:2px;padding-left:12px;border-left:2px solid var(--c,var(--g))}
.res b{font-family:var(--disp);font-size:.9rem}
.res span{color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;background:var(--g);color:#052015;font-weight:700;padding:11px 18px}

.btn[disabled]{opacity:.45;cursor:not-allowed}
/* 3D */
.viewer{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#12281f 0%,#0a120e 70%);height:340px}
.viewer canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.viewer .dots{position:absolute;inset:0;pointer-events:none}
.dot{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;border:2px solid #0a120e;background:var(--g);color:#052015;font:700 .72rem var(--disp);display:grid;place-items:center;pointer-events:auto;padding:0;box-shadow:0 0 0 2px rgba(61,220,151,.25)}
.dot[aria-pressed="true"]{background:#fff;box-shadow:0 0 0 4px rgba(61,220,151,.55)}

.viewer .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink2)}
.legend3d{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.legend3d .chip{padding:5px 11px;font-size:.8rem}
.legend3d .chip i{font-style:normal;color:var(--g);font-weight:700;margin-right:6px}
.info3d{margin-top:10px;background:var(--s2);border-radius:12px;padding:12px 14px;min-height:64px}

.slider{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.slider label{font-weight:600;font-size:.85rem;min-width:88px}
.slider input[type=range]{flex:1;min-width:150px;accent-color:var(--g)}
.slider output{font-size:.82rem;color:var(--ink2);flex-basis:100%}
/* Jogar */
.fases{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.fase{display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--c)}
.fase .n{font:700 .72rem var(--disp);color:var(--c);letter-spacing:.08em}
.fase h3{font-size:1.02rem}
.fase .m{color:var(--ink2);font-size:.85rem}
.fase .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nota{font:700 1.4rem var(--disp)}
.nota small{font:500 .75rem var(--body);color:var(--mut);margin-left:4px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--s3);color:var(--ink2)}
.tag.ok{background:var(--gd);color:var(--g)}
.tag.warn{background:#3a2d0c;color:var(--amb)}
.tag.bad{background:#3f1c1c;color:var(--red)}
.play{max-width:640px;margin:0 auto}
.prog{height:6px;background:var(--s2);border-radius:999px;overflow:hidden;margin-block:10px}
.prog i{display:block;height:100%;background:var(--c,var(--g));border-radius:999px;transition:width .3s}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--ink2);flex-wrap:wrap}
.hud b{color:var(--ink);font-family:var(--disp)}
.timer{height:5px;background:var(--s2);border-radius:999px;overflow:hidden;margin-top:6px}
.timer i{display:block;height:100%;background:var(--amb);width:100%}
.qtext{font:600 1.08rem/1.4 var(--disp);margin:14px 0}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--s1);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;gap:12px;align-items:flex-start;font-weight:500}
.opt .l{flex:none;width:24px;height:24px;border-radius:7px;background:var(--s3);display:grid;place-items:center;font:700 .78rem var(--disp);color:var(--ink2)}
.opt:not([disabled]):hover{border-color:var(--g)}
.opt.right{border-color:var(--g);background:var(--gd)}
.opt.right .l{background:var(--g);color:#052015}
.opt.wrong{border-color:var(--red);background:#2e1717}
.opt.wrong .l{background:var(--red);color:#2a0a0a}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;background:var(--s2);border-left:4px solid var(--g)}
.fb.err{border-left-color:var(--red)}
.fb b{font-family:var(--disp)}
.caso{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--amb);text-transform:uppercase}
.res-big{text-align:center;padding-block:10px}
.res-big .nota{font-size:3rem}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-block:12px}
.kv div{background:var(--s2);border-radius:12px;padding:10px 12px}
.kv small{display:block;color:var(--mut);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.kv b{font:700 1.2rem var(--disp)}
.rev{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.rev li{background:var(--s2);border-radius:10px;padding:10px 12px;font-size:.88rem}
.rev li b{display:block;margin-bottom:2px}
/* Painel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi small{color:var(--mut);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;display:block}
.kpi b{font:700 1.7rem var(--disp);font-variant-numeric:tabular-nums}
.kpi span{color:var(--ink2);font-size:.78rem;display:block}
.grid2{display:grid;gap:14px;grid-template-columns:3fr 2fr}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.bars{display:grid;gap:9px;margin-top:10px}
.brow{display:grid;grid-template-columns:minmax(96px,150px) 1fr 44px;gap:10px;align-items:center;font-size:.84rem}
.brow .t{color:var(--ink2)}
.brow .tr{height:12px;background:var(--s3);border-radius:6px;overflow:hidden;position:relative}
.brow .tr i{display:block;height:100%;background:var(--g);border-radius:6px}

.brow .flag{font-size:.68rem;font-weight:700;color:var(--amb);margin-left:6px}
.meta60{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.hist{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:10px}
.hist div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:.75rem;color:var(--ink2)}
.hist i{display:block;width:100%;background:var(--g2);border-radius:6px 6px 0 0;min-height:2px}
.hist b{color:var(--ink);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-size:.86rem}
th:first-child,td:first-child{text-align:left}
th{font:600 .68rem var(--disp);text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
th button{background:none;border:0;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
th button[aria-sort]::after{content:" ▼";color:var(--g)}
th button[aria-sort="ascending"]::after{content:" ▲"}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--s2)}
tr.me td:first-child{color:var(--g);font-weight:700}
.note{color:var(--mut);font-size:.8rem}
.banner{background:var(--s2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:.8rem;color:var(--ink2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:520px;width:100%;max-height:86vh;overflow:auto}
.modal textarea{width:100%;height:160px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* v2: login, campos, aviso */
.fld{display:grid;gap:6px}.fld span{font-weight:600;font-size:.85rem;color:var(--ink2)}
input:not([type=range]):not([type=checkbox]){background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:12px 13px;color:var(--ink);font:500 16px var(--body);width:100%;min-width:0}
input:not([type=range]):focus{border-color:var(--g)}
.login{display:grid;gap:14px;max-width:460px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--s3);border:1px solid var(--g);padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;text-align:center}
.mut{color:var(--mut)}
td small{font-size:.75rem}
td.wrap{white-space:normal;min-width:170px}
</style>

<script>
/* gerado por mkcontent.py a partir de bank/*.json */
const FASES = [{"id":"emb1","disc":"Embriologia","dk":"emb","n":1,"u":"I","titulo":"Introdução à Embriologia e Ciclo Menstrual","cor":"#3ddc97","resumo":[["Embriologia e os três períodos","A Embriologia estuda o desenvolvimento desde a fecundação até a formação do indivíduo e embasa a fisioterapia obstétrica, pélvica e pediátrica. O pré-embrionário (1ª-2ª semana) vai até o disco bilaminar; o embrionário (3ª-8ª) forma os folhetos e os órgãos e é o mais vulnerável a teratógenos; o fetal (9ª semana ao nascimento) é de crescimento e maturação."],["Sistemas reprodutores","No feminino, os ovários produzem gametas, estrogênio e progesterona; as tubas uterinas são o local habitual da fecundação; o útero tem perimétrio, miométrio e endométrio (de fora para dentro). No masculino, testículos, epidídimo, ducto deferente e glândulas anexas."],["Eixo e ciclo menstrual","O ciclo dura em média 28 dias e é regulado por GnRH, FSH e LH, estrogênio e progesterona. Fase folicular (dias 1-14): FSH e estrogênio crescente. Ovulação (dia 14): pico de LH. Fase lútea (dias 15-28): o corpo lúteo secreta progesterona e regride sem fecundação."],["Ciclo uterino","O endométrio acompanha o ciclo ovariano em três fases: menstrual, proliferativa (estrogênio) e secretora (progesterona), esta última preparando o endométrio para a nidação."],["Estrogênio, frouxidão e LCA","O pico de estrogênio pré-ovulatório associa-se a maior frouxidão do colágeno ligamentar e, segundo algumas evidências, a mais lesões de LCA sem contato em atletas mulheres. O fisioterapeuta pode considerar a fase do ciclo ao ajustar cargas e treino pliométrico."]],"q":[{"t":"Pico de LH","q":"O pico de LH no meio do ciclo menstrual é responsável por:","o":["Desencadear a ovulação","Manter o corpo lúteo ativo indefinidamente, mesmo sem fecundação","Iniciar a menstruação, por queda dos hormônios ovarianos","Estimular a espermatogênese nos túbulos seminíferos"],"c":0,"e":"O surto de LH desencadeia a ruptura folicular e a liberação do oócito (gabarito da apostila). Não mantém o corpo lúteo, que regride sem fecundação.","d":1},{"t":"Parede uterina","q":"As camadas da parede uterina, de fora para dentro, são:","o":["Endométrio, miométrio e, por último, o perimétrio","Miométrio, perimétrio e, por último, o endométrio","Endométrio, perimétrio e, por último, o miométrio","Perimétrio, miométrio, endométrio"],"c":3,"e":"Perimétrio é a camada externa, miométrio a muscular intermediária e endométrio a mucosa interna.","d":1},{"t":"Períodos do desenvolvimento","q":"Qual período do desenvolvimento humano corresponde à 3ª até a 8ª semana e é o de maior vulnerabilidade a teratógenos?","o":["Pré-embrionário","Embrionário","Fetal","Perinatal"],"c":1,"e":"No período embrionário ocorrem a formação dos folhetos germinativos e a organogênese, incluindo o início de músculos, ossos e sistema nervoso.","d":1},{"t":"Fecundação","q":"Qual é o local habitual da fecundação no sistema reprodutor feminino?","o":["Ovário","Útero","Tuba uterina","Vagina"],"c":2,"e":"A apostila indica as tubas uterinas como local habitual da fecundação.","d":1},{"t":"Eixo hormonal","q":"No eixo hipotálamo-hipófise-ovário, o hipotálamo inicia a cascata liberando:","o":["FSH","GnRH","LH","Estrogênio"],"c":1,"e":"A sequência é GnRH (hipotálamo), FSH e LH (hipófise) e estrogênio e progesterona (ovário).","d":1},{"t":"Estrogênio e ligamentos","q":"Qual hormônio, em pico na fase pré-ovulatória, está associado ao aumento da frouxidão do colágeno ligamentar?","o":["Progesterona","FSH","Estrogênio","GnRH"],"c":2,"e":"O estrogênio, em pico na fase pré-ovulatória, está associado a maior frouxidão do colágeno ligamentar, especialmente do LCA.","d":1},{"t":"Fase folicular e lútea","q":"Ao comparar as fases do ciclo, é correto afirmar que:","o":["Na folicular predomina o estrogênio, que faz o endométrio proliferar; na lútea, a progesterona o torna secretor","Na fase folicular predomina a progesterona, que torna o endométrio secretor, e na lútea predomina o estrogênio, que o faz proliferar novamente","Nas duas fases predomina o estrogênio, que apenas mantém o endométrio sem alterá-lo","Na fase folicular predomina o LH, que descama o endométrio, e na lútea predomina o FSH, que o reconstrói e mantém a menstruação"],"c":0,"e":"Segundo o gabarito, o estrogênio da fase folicular promove a proliferação endometrial e a progesterona do corpo lúteo torna o endométrio secretor, preparando-o para a nidação.","d":2},{"t":"Corpo lúteo","q":"Sobre o corpo lúteo, na fase lútea do ciclo, é correto afirmar que:","o":["Secreta FSH e permanece ativo mesmo sem fecundação","Origina-se da ruptura do endométrio na menstruação","Secreta LH para manter a maturação dos folículos","Secreta progesterona e regride se não há fecundação"],"c":3,"e":"Na fase lútea (dias 15-28) o corpo lúteo secreta progesterona e regride na ausência de fecundação.","d":2},{"t":"Fase folicular","q":"Na fase folicular (dias 1-14), a maturação dos folículos ocorre sob ação principal de:","o":["LH, com estrogênio decrescente","FSH, com estrogênio crescente","Progesterona, com estrogênio decrescente","GnRH, com progesterona crescente"],"c":1,"e":"A fase folicular é marcada pela maturação folicular sob FSH, com estrogênio crescente, até o pico de LH na ovulação.","d":2},{"t":"Relevância da Embriologia","q":"Para o fisioterapeuta, o estudo da Embriologia é importante principalmente porque:","o":["Permite prescrever fármacos para a gestante e definir o tratamento medicamentoso das malformações congênitas","Substitui a avaliação clínica do recém-nascido","Explica a origem de disfunções motoras congênitas e orienta a fisioterapia obstétrica e pélvica","Dispensa o conhecimento da anatomia do adulto"],"c":2,"e":"A apostila destaca a base para entender a origem de disfunções motoras congênitas, orientar a fisioterapia obstétrica e pélvica e planejar a pediatria neurofuncional.","d":2},{"t":"Pré-embrionário","q":"O período pré-embrionário (1ª e 2ª semanas) compreende:","o":["A fecundação até a formação do disco embrionário bilaminar","A formação dos três folhetos e a organogênese","A maturação dos órgãos e os primeiros movimentos fetais","O nascimento e a adaptação neonatal"],"c":0,"e":"Pré-embrionário vai da fecundação ao disco bilaminar. Folhetos e organogênese são do embrionário, e maturação e movimentos, do fetal.","d":2},{"t":"Função ovariana","q":"Além de produzirem os gametas femininos, os ovários são responsáveis por:","o":["Produzir testosterona e os espermatozoides","Secretar GnRH e FSH","Produzir o GnRH e o LH que comandam o ciclo menstrual","Produzir estrogênio e progesterona"],"c":3,"e":"Os ovários são gônadas pareadas responsáveis pela ovogênese e pela produção de estrogênio e progesterona. GnRH vem do hipotálamo e FSH e LH, da hipófise.","d":2},{"t":"Ciclo e carga de treino","q":"Uma jogadora de vôlei com ciclo de 28 dias fará treino pliométrico intenso no 13º dia. Qual raciocínio da apostila se aplica?","o":["Fase lútea, com progesterona alta e menor risco ligamentar: liberar a carga total do treino","Pré-ovulatória, com pico de estrogênio e maior frouxidão: ajustar a carga","Fase menstrual, com queda hormonal: contraindicar qualquer exercício físico nesses dias","Ciclo e ligamentos não se relacionam segundo a apostila: ignorar a fase do ciclo no treino"],"c":1,"e":"A fase pré-ovulatória tem pico de estrogênio, associado a maior frouxidão do colágeno e a maior risco de lesão do LCA sem contato. Ajustar a carga é a conduta sugerida pela apostila.","d":3},{"t":"Teratógenos","q":"Uma gestante descobre a gravidez na 6ª semana e teme que exposições recentes afetem o sistema musculoesquelético do bebê. Qual afirmação é coerente com a apostila?","o":["O risco é mínimo, pois somente o período fetal forma os ossos e os músculos do bebê","Não há risco, pois o embrião ainda está na fase pré-embrionária","Está no período embrionário, de maior vulnerabilidade, quando músculos e ossos começam a se formar","O risco só existe a partir da 9ª semana, quando ocorrem a maturação neuromuscular e os primeiros movimentos fetais"],"c":2,"e":"A 6ª semana está no período embrionário (3ª a 8ª), fase de organogênese e maior vulnerabilidade a teratógenos.","d":3},{"t":"Fase lútea","q":"Uma paciente com ciclo regular de 28 dias colheu exames no 21º dia. Qual quadro é esperado nesse dia?","o":["Corpo lúteo ativo, progesterona predominante e endométrio secretor","Pico de LH e ruptura folicular em curso","Folículos em maturação, com estrogênio crescente e endométrio proliferativo","Corpo lúteo regredido e início da menstruação"],"c":0,"e":"O dia 21 está na fase lútea (15-28), com corpo lúteo secretando progesterona, que torna o endométrio secretor para a nidação.","d":3},{"t":"Miométrio","q":"Ao orientar uma gestante sobre a contração uterina durante o trabalho de parto, a fisioterapeuta explica que a camada muscular do útero é:","o":["O endométrio, mucosa interna que descama","O perimétrio, camada externa de revestimento","A tuba uterina, que reveste o útero","O miométrio, camada muscular intermediária"],"c":3,"e":"A parede uterina, de fora para dentro, é perimétrio, miométrio (muscular) e endométrio (mucosa interna).","d":3},{"t":"Período fetal","q":"Uma gestante na 12ª semana pergunta o que acontece nessa fase. A resposta mais adequada, segundo a apostila, é que:","o":["Crescimento e maturação dos órgãos, com maturação neuromuscular e primeiros movimentos fetais","Ocorre a fecundação e a formação do disco embrionário bilaminar, com implantação","Formam-se os três folhetos germinativos e ocorre a organogênese inicial dos sistemas","Ocorre a nidação do blastocisto, completando o período embrionário e iniciando a organogênese"],"c":0,"e":"O período fetal (9ª semana ao nascimento) é de crescimento e maturação, com maturação neuromuscular e primeiros movimentos fetais.","d":3},{"t":"Linha do tempo do ciclo","q":"Em uma atividade em grupo, o aluno monta a linha do tempo de um ciclo de 28 dias. Qual associação está correta?","o":["Dia 14: início da menstruação, com queda de progesterona","Dias 1-14: fase lútea, com corpo lúteo ativo","Dia 14: pico de LH e ovulação, ao fim da fase folicular","Dias 15-28: fase folicular, sob FSH"],"c":2,"e":"A fase folicular vai do dia 1 ao 14, com ovulação no dia 14 por pico de LH. A fase lútea ocupa os dias 15-28.","d":3}],"models":[["ciclo","Ciclo menstrual"]]},{"id":"emb2","disc":"Embriologia","dk":"emb","n":2,"u":"II","titulo":"Fecundação e Anexos Embrionários","cor":"#34d1b8","resumo":[["Fecundação","Ocorre na ampola da tuba uterina, em até 24 horas após a ovulação. Passa por capacitação espermática, reação acrossômica (digestão da zona pelúcida) e fusão de membranas. O bloqueio rápido da poliespermia é a despolarização; o lento é a reação cortical."],["Zigoto, mórula e blastocisto","A meiose II do oócito termina e forma-se o zigoto, com 46 cromossomos e sexo genético definido (XX ou XY). A mórula (16-32 células, 3º-4º dia) dá lugar ao blastocisto (5º-6º dia), com embrioblasto (embrião) e trofoblasto (placenta e anexos)."],["Nidação","Entre o 6º e o 10º dia o blastocisto se implanta no endométrio. O trofoblasto se diferencia em citotrofoblasto e sinciciotrofoblasto, que produz hCG, base dos testes de gravidez."],["Anexos e líquido amniótico","O líquido amniótico protege e permite o movimento fetal ativo, estímulo mecânico essencial para articulações, cartilagem e músculo. O oligoidrâmnio restringe o movimento e associa-se a artrogripose e pé torto congênito. Saco vitelino: primeiras células sanguíneas e germinativas. Alantoide: vasos umbilicais e úraco. Córion: vilosidades. Cordão: 2 artérias e 1 veia."],["Placenta e fisioterapia obstétrica","Realiza trocas gasosas e metabólicas e função endócrina (hCG, hPL, estrogênio, progesterona). É barreira parcial: álcool, certos fármacos e agentes infecciosos passam. No 3º trimestre evita-se o decúbito dorsal prolongado, pois o útero comprime a veia cava inferior e reduz a perfusão uteroplacentária."]],"q":[{"t":"Local da fecundação","q":"Em que local do sistema genital feminino ocorre a fecundação?","o":["Cavidade uterina, junto ao endométrio","Ovário, dentro do folículo maduro","Ampola da tuba uterina","Colo do útero, no canal cervical"],"c":2,"e":"Segundo a apostila, a fecundação ocorre na ampola da tuba uterina, em até 24 horas após a ovulação.","d":1},{"t":"Poliespermia","q":"O bloqueio rápido da poliespermia ocorre por:","o":["Endurecimento da zona pelúcida após a liberação dos grânulos corticais","Despolarização da membrana plasmática do oócito","Liberação de hCG pelo sinciciotrofoblasto após a implantação","Formação do corpo lúteo sob ação do LH"],"c":1,"e":"Gabarito da apostila: a fusão do espermatozoide com o oócito causa despolarização elétrica imediata (bloqueio rápido), seguida da reação cortical (bloqueio lento).","d":1},{"t":"Âmnio","q":"O líquido amniótico está contido dentro:","o":["Do córion","Do saco vitelino","Do alantoide","Do âmnio"],"c":3,"e":"O âmnio delimita a cavidade amniótica, onde se acumula o líquido amniótico (gabarito da questão 5).","d":1},{"t":"Blastocisto","q":"Qual componente do blastocisto origina a placenta e os anexos embrionários?","o":["Trofoblasto","Embrioblasto","Zona pelúcida","Mórula"],"c":0,"e":"O blastocisto se diferencia em embrioblasto, que origina o embrião, e trofoblasto, que origina a placenta e os anexos.","d":1},{"t":"Cordão umbilical","q":"O cordão umbilical é formado por:","o":["Duas veias e uma artéria umbilicais, envoltas por geleia de Wharton","Uma artéria e uma veia umbilicais, sem tecido de envoltório","Duas artérias e uma veia, envoltas por geleia de Wharton","Três artérias e nenhuma veia, envoltas por geleia de Wharton"],"c":2,"e":"Segundo a apostila, o cordão contém duas artérias e uma veia umbilicais envoltas pela geleia de Wharton.","d":1},{"t":"Saco vitelino","q":"Em humanos, qual é a principal importância do saco vitelino, cuja função nutritiva é vestigial?","o":["Formar o úraco, a partir de seu resquício após o nascimento, ligando bexiga e umbigo","Ser origem das primeiras células sanguíneas e das germinativas primordiais","Fornecer a maior parte dos nutrientes ao embrião até o parto","Originar as vilosidades coriônicas da porção fetal da placenta"],"c":1,"e":"A apostila descreve o saco vitelino como vestigial quanto à nutrição, mas origem das primeiras células sanguíneas e das células germinativas primordiais. O úraco vem do alantoide.","d":1},{"t":"Oligoidrâmnio","q":"A redução importante do volume de líquido amniótico (oligoidrâmnio) está associada a:","o":["Macrossomia fetal por excesso de espaço","Aumento da frouxidão ligamentar fetal","Parto prematuro isolado, sem repercussão musculoesquelética","Artrogripose e restrição do movimento fetal"],"c":3,"e":"Gabarito: o oligoidrâmnio restringe o espaço para movimentação fetal, associando-se a artrogripose e outras deformidades posturais.","d":2},{"t":"Nidação","q":"Em que período ocorre a nidação, isto é, a implantação do blastocisto no endométrio?","o":["Do 1º ao 3º dia após a fecundação, ainda na tuba","Entre o 6º e o 10º dia","Entre o 14º e o 18º dia","No 3º e 4º dia, na fase de mórula"],"c":1,"e":"A apostila situa a nidação entre o 6º e o 10º dia; a mórula (3º-4º dia) e o blastocisto (5º-6º dia) a antecedem.","d":2},{"t":"Mórula e blastocisto","q":"Qual afirmação diferencia corretamente mórula de blastocisto?","o":["O blastocisto é uma massa de 16 a 32 células que surge por volta do 3º dia","A mórula já tem trofoblasto e embrioblasto definidos e cavidade blastocística","Blastocisto tem embrioblasto e trofoblasto; mórula tem 16-32 células","A mórula surge após a nidação, por volta do 10º dia"],"c":2,"e":"Pela apostila, a mórula (16-32 células, 3º-4º dia) precede o blastocisto (5º-6º dia), no qual há diferenciação em embrioblasto e trofoblasto.","d":2},{"t":"Barreira placentária","q":"Por que a placenta é descrita como uma barreira parcial?","o":["Porque álcool, certos fármacos e agentes infecciosos a atravessam","Porque permite apenas trocas gasosas, sem passagem de nutrientes ou de hormônios","Porque bloqueia todos os fármacos e microrganismos, mas deixa passar os hormônios","Porque só passa a funcionar como barreira a partir do terceiro trimestre"],"c":0,"e":"A placenta faz trocas gasosas e metabólicas, mas não impede a passagem de álcool, certos fármacos e agentes infecciosos; por isso é barreira parcial.","d":2},{"t":"Reação acrossômica","q":"Qual é o papel da reação acrossômica na fecundação?","o":["Impedir a entrada de outros espermatozoides","Digerir a zona pelúcida para a penetração do espermatozoide","Completar a meiose II do oócito","Restaurar o número de 46 cromossomos"],"c":1,"e":"A reação acrossômica promove a digestão da zona pelúcida. O bloqueio da poliespermia é feito depois, pela despolarização e pela reação cortical.","d":2},{"t":"Alantoide","q":"Qual anexo embrionário contribui para os vasos umbilicais e tem como resquício o úraco?","o":["Córion, que forma as vilosidades da placenta","Saco vitelino, origem das células germinativas","Âmnio, que delimita a cavidade amniótica","Alantoide, também ligado aos vasos do cordão"],"c":3,"e":"A apostila descreve o alantoide como contribuinte para os vasos umbilicais e seu resquício forma o úraco.","d":2},{"t":"Oligoidrâmnio e artrogripose","q":"Um recém-nascido apresenta múltiplas contraturas articulares (artrogripose) e a mãe teve oligoidrâmnio importante. Qual o mecanismo mais provável?","o":["Pouco líquido restringiu o movimento fetal e o estímulo mecânico às articulações","Excesso de líquido aumentou a mobilidade fetal e causou frouxidão excessiva das articulações","Falha na formação do cordão levou a déficit de nutrição da musculatura","Persistência do saco vitelino competiu por espaço e imobilizou o feto"],"c":0,"e":"Raciocínio do gabarito: os movimentos fetais ativos estimulam cartilagens, ossos e articulações; a restrição por oligoidrâmnio compromete esse estímulo e pode gerar rigidez articular congênita.","d":3},{"t":"Decúbito dorsal na gestação","q":"Uma fisioterapeuta evita prescrever exercícios em decúbito dorsal prolongado para uma gestante no terceiro trimestre. Qual a justificativa fisiológica?","o":["O útero comprime a aorta abdominal e eleva a pressão arterial materna de forma sustentada","O decúbito eleva a produção de hCG e altera o eixo hormonal da gestação","O útero comprime a veia cava inferior e reduz o retorno venoso e a perfusão placentária","A posição aumenta a frouxidão da sínfise púbica pela ação da relaxina"],"c":2,"e":"Gabarito: a compressão da veia cava inferior pelo útero gravídico reduz retorno venoso e perfusão uteroplacentária, com risco de hipotensão materna; prefere-se decúbito lateral ou posições modificadas.","d":3},{"t":"Hipotensão supina","q":"Gestante de 34 semanas, deitada em supino durante a sessão, refere tontura, palidez e sensação de desmaio. Qual o mecanismo mais provável?","o":["Aumento do retorno venoso, com sobrecarga cardíaca e hipertensão materna","Deslocamento da placenta pelo peso do útero sobre o abdome materno","Excesso de relaxina, que reduz a pressão arterial materna por vasodilatação","Compressão da veia cava inferior, com queda do retorno venoso"],"c":3,"e":"Conforme o gabarito, o útero gravídico comprime a veia cava inferior em decúbito dorsal, reduzindo o retorno venoso e causando hipotensão materna. A conduta é o decúbito lateral ou posição modificada.","d":3},{"t":"Barreira parcial (caso)","q":"Uma gestante pergunta à fisioterapeuta se a placenta protege totalmente o bebê do álcool. Qual a resposta correta?","o":["Sim, a placenta é barreira completa contra qualquer substância","Não, a placenta é barreira parcial e o álcool a atravessa","Sim, o sinciciotrofoblasto retém o álcool antes de chegar ao feto","Não, mas apenas os hormônios maternos conseguem atravessá-la"],"c":1,"e":"A apostila afirma que a placenta é barreira parcial: não impede a passagem de álcool, certos fármacos e agentes infecciosos.","d":3},{"t":"hCG e teste de gravidez","q":"Uma paciente com atraso menstrual tem teste de farmácia positivo. O teste detecta um hormônio produzido por qual estrutura?","o":["Embrioblasto","Corpo lúteo","Sinciciotrofoblasto","Saco vitelino"],"c":2,"e":"Na nidação o trofoblasto se diferencia em citotrofoblasto e sinciciotrofoblasto; este produz hCG, base dos testes de gravidez.","d":3},{"t":"Sexo genético","q":"Um casal pergunta à fisioterapeuta quando o sexo genético do bebê é definido. Em que momento isso ocorre?","o":["Na fecundação, com a formação do zigoto (XX ou XY)","Na nidação, quando o trofoblasto se diferencia","Na formação do blastocisto, no 5º-6º dia","Na fase de mórula, entre o 3º e o 4º dia"],"c":0,"e":"O zigoto restaura os 46 cromossomos e define o sexo genético (XX ou XY) já na fecundação, na ampola da tuba.","d":3}],"models":[["blasto","Do zigoto ao blastocisto"],["anexos","Anexos e placenta"]]},{"id":"emb3","disc":"Embriologia","dk":"emb","n":3,"u":"III","titulo":"Organogênese e Teratogênese","cor":"#4fc3f7","resumo":[["Três folhetos germinativos","Na 3ª semana forma-se o disco trilaminar. O ectoderma origina o SNC, o SNP e a epiderme; o mesoderma origina músculos, ossos, tendões, sistema cardiovascular e urogenital; o endoderma forma o revestimento gastrointestinal e respiratório, fígado, pâncreas e tireoide."],["Neurulação e tubo neural","O ectoderma sobre a notocorda forma a placa neural, que se fecha em tubo neural (futuro SNC). Falha caudal gera espinha bífida e mielomeningocele, com hidrocefalia (Arnold-Chiari II); falha cranial gera anencefalia. O ácido fólico pré-concepcional reduz o risco."],["Somitos e segmentação","Os somitos, blocos de mesoderma paraxial, originam esclerótomo (vértebras e costelas), miótomo (musculatura axial) e dermátomo (derme dorsal). Essa segmentação explica os dermátomos e miótomos usados na avaliação neurológica."],["Organogênese e período crítico","A organogênese (3ª a 8ª semana) forma todos os sistemas de órgãos e é a fase de maior vulnerabilidade a teratógenos. Os membros se formam entre a 4ª e a 8ª semana, período de máxima vulnerabilidade para malformações de membros."],["Teratógenos e o fisioterapeuta","Talidomida causa focomelia; álcool, síndrome alcoólica fetal (SNC, hipotonia, atraso motor); Zika, microcefalia e espasticidade; ácido valproico, defeitos do tubo neural; diabetes mal controlado, defeitos do tubo neural e cardíacos. O fisioterapeuta avalia o DNPM, faz estimulação precoce, previne deformidades, indica órteses e orienta a família."]],"q":[{"t":"Folhetos germinativos","q":"O folheto embrionário que origina o sistema musculoesquelético é:","o":["Endoderma","Mesoderma","Ectoderma","Trofoblasto"],"c":1,"e":"O mesoderma, especialmente o paraxial (somitos), origina ossos, músculos e tecido conjuntivo do aparelho locomotor.","d":1},{"t":"Neurulação","q":"A mielomeningocele decorre de:","o":["Fechamento incompleto do tubo neural caudal","Mutação no gene da beta-globina, com hemoglobina alterada","Deficiência grave de vitamina A durante a gestação","Trissomia do cromossomo 21 no embrião, com cardiopatia"],"c":0,"e":"Conforme o gabarito, resulta do fechamento incompleto do tubo neural na extremidade caudal, com exposição de meninges e tecido neural.","d":1},{"t":"Talidomida","q":"A talidomida é classicamente associada a que tipo de malformação?","o":["Microcefalia com calcificações intracranianas","Catarata congênita e surdez neurossensorial","Focomelia (malformação de membros)","Defeitos do tubo neural, como a espinha bífida"],"c":2,"e":"A talidomida é o exemplo histórico clássico de teratógeno causador de focomelia, com membros rudimentares ou ausentes.","d":1},{"t":"Prevenção de defeitos","q":"Qual medida pré-concepcional reduz significativamente o risco de defeitos do tubo neural?","o":["Suplementação de vitamina C","Suplementação de ferro","Suplementação de cálcio","Suplementação de ácido fólico"],"c":3,"e":"A apostila indica a suplementação de ácido fólico pré-concepcional.","d":1},{"t":"Folhetos germinativos","q":"Qual folheto germinativo origina o sistema nervoso central e o periférico?","o":["Ectoderma","Mesoderma","Endoderma","Trofoblasto"],"c":0,"e":"O ectoderma origina o SNC e o SNP, além da epiderme e anexos; por isso é a base da neurofisioterapia.","d":1},{"t":"Somitos","q":"Em qual derivado dos somitos se originam as vértebras e as costelas?","o":["Miótomo","Esclerótomo","Dermátomo","Notocorda"],"c":1,"e":"Os somitos se diferenciam em esclerótomo (vértebras e costelas), miótomo (musculatura axial) e dermátomo (derme dorsal).","d":1},{"t":"Somitos","q":"Os somitos, que organizam a musculatura e a inervação segmentares, são blocos segmentados de qual tecido?","o":["Ectoderma sobre a notocorda","Endoderma do intestino primitivo","Mesoderma paraxial","Mesoderma lateral dos membros"],"c":2,"e":"Os somitos são blocos segmentados de mesoderma paraxial ao longo do embrião.","d":2},{"t":"Período crítico","q":"Por que a organogênese (3ª a 8ª semana) é o período de maior vulnerabilidade a teratógenos?","o":["O sistema imunológico fetal já está totalmente maduro","A placenta ainda não se formou por completo","O fluxo sanguíneo materno é reduzido nesse período","Todos os sistemas de órgãos estão em formação"],"c":3,"e":"É nessa fase que se formam todos os sistemas de órgãos, de modo que a interferência de um agente causa malformações estruturais.","d":2},{"t":"Neurulação","q":"Qual afirmação sobre a anencefalia está correta?","o":["Decorre de falha no fechamento cranial e é incompatível com a vida","Resulta de fechamento caudal incompleto do tubo neural e é compatível com a vida","Cursa sempre com hidrocefalia e malformação de Arnold-Chiari tipo II, com exposição das meninges","É uma forma oculta e assintomática de espinha bífida"],"c":0,"e":"Segundo a apostila, a anencefalia é o fechamento cranial incompleto do tubo neural, incompatível com a vida.","d":2},{"t":"Desenvolvimento de membros","q":"Os membros se desenvolvem a partir de brotos de mesoderma lateral recobertos por ectoderma. Em qual período há máxima vulnerabilidade a malformações de membros?","o":["Da 1ª à 2ª semana","Da 4ª à 8ª semana","Somente no 3º trimestre","Da 20ª à 24ª semana"],"c":1,"e":"A apostila situa entre a 4ª e a 8ª semana o período de máxima vulnerabilidade para malformações de membros.","d":2},{"t":"Neurulação","q":"Qual associação é típica da mielomeningocele, segundo a apostila?","o":["Microcefalia e espasticidade por infecção viral","Focomelia e ausência de membros","Hidrocefalia (Arnold-Chiari tipo II)","Hipotonia e atraso motor por álcool"],"c":2,"e":"A mielomeningocele frequentemente se associa a hidrocefalia, na malformação de Arnold-Chiari tipo II.","d":2},{"t":"Estimulação precoce","q":"Na síndrome congênita do Zika, por que a estimulação precoce deve começar logo após o nascimento?","o":["Porque o vírus permanece ativo e é eliminado com o exercício terapêutico","Porque as órteses só funcionam se colocadas nos primeiros dias de vida","Porque a lesão neurológica é reversível até o fim do 1º mês","Porque a plasticidade neural é elevada nos primeiros meses"],"c":3,"e":"Conforme o gabarito, aproveita-se a plasticidade neural ainda elevada nos primeiros meses, pois o SNC é gravemente comprometido durante a organogênese e segue em maturação.","d":2},{"t":"Mielomeningocele","q":"Recém-nascido com mielomeningocele lombar chega à avaliação fisioterapêutica. Qual quadro é esperado?","o":["Déficits motores e sensitivos abaixo da lesão, com bexiga e intestino neurogênicos","Déficits motores apenas acima do nível da lesão, com função vesical preservada","Focomelia bilateral com sensibilidade normal e controle esfincteriano intacto","Hipotonia global sem alteração sensitiva ou esfincteriana, com membros normais"],"c":0,"e":"A apostila descreve déficits motores e sensitivos abaixo do nível da lesão e alterações neurogênicas de bexiga e intestino.","d":3},{"t":"Zika congênito","q":"Lactente com síndrome congênita do Zika apresenta microcefalia e espasticidade. Qual conduta fisioterapêutica corresponde ao papel descrito na apostila?","o":["Aguardar o fim do 1º ano para iniciar a intervenção","Avaliar o DNPM, iniciar estimulação precoce e orientar a família","Restringir a intervenção ao uso de órteses","Tratar apenas as deformidades já instaladas"],"c":1,"e":"O fisioterapeuta avalia o desenvolvimento neuropsicomotor, faz estimulação precoce, previne deformidades secundárias, indica órteses e orienta a família.","d":3},{"t":"Talidomida","q":"Adulto jovem com membros superiores rudimentares relata que a mãe usou talidomida na gestação. Em qual período a exposição provavelmente ocorreu?","o":["No 3º trimestre, com o feto já formado","Na 1ª semana, antes da implantação","Entre a 4ª e a 8ª semana, na formação dos membros","Apenas durante o trabalho de parto"],"c":2,"e":"A focomelia pela talidomida tem período crítico entre a 4ª e a 8ª semana, quando os brotos dos membros se formam.","d":3},{"t":"Dermátomos e miótomos","q":"Paciente com lesão medular tem perda sensitiva e motora em faixas segmentares bem definidas. Qual a base embriológica que permite localizar o nível da lesão?","o":["Divisão do endoderma em segmentos ao longo do tubo digestivo","Fechamento do neuróporo cranial na 4ª semana","Formação de camadas do trofoblasto no blastocisto","Segmentação dos somitos, que organiza dermátomos e miótomos"],"c":3,"e":"A organização segmentar dos somitos é a base da distribuição segmentar da inervação sensitiva (dermátomos) e motora (miótomos) usada para localizar o nível da lesão.","d":3},{"t":"Síndrome alcoólica fetal","q":"Criança de 2 anos com hipotonia e atraso motor tem histórico de exposição materna ao álcool durante toda a gestação. Qual diagnóstico é o mais coerente?","o":["Síndrome alcoólica fetal, com comprometimento do SNC","Focomelia por exposição à talidomida, com membros rudimentares","Espinha bífida oculta por deficiência de folato","Síndrome congênita do Zika, com microcefalia e espasticidade"],"c":0,"e":"A apostila associa o álcool à síndrome alcoólica fetal, com comprometimento do SNC, hipotonia e atraso motor, e o período crítico abrange toda a gestação.","d":3},{"t":"Fatores maternos","q":"Gestante com diabetes mal controlado pergunta ao fisioterapeuta sobre riscos ao bebê. Quais malformações a apostila associa a esse fator?","o":["Focomelia e catarata congênita","Microcefalia e calcificações intracranianas","Do tubo neural e cardíacas","Apenas de membros e de palato"],"c":2,"e":"Diabetes mal controlado é fator materno associado a malformações do tubo neural e cardíacas.","d":3}],"models":[["gastru","Gastrulação: 3 folhetos"],["neural","Tubo neural"],["dobra","Dobramento do embrião"]]},{"id":"emb4","disc":"Embriologia","dk":"emb","n":4,"u":"IV","titulo":"Infecções e IST","cor":"#7ab8ff","resumo":[["Vias de transmissão vertical","As IST e outras infecções podem passar da mãe ao filho por via transplacentária, durante o parto ou pela amamentação, causando infecções congênitas e perinatais com potencial repercussão neuromotora."],["Zika e toxoplasmose","Zika: microcefalia, desproporção craniofacial, espasticidade, artrogripose secundária ao comprometimento neurológico central, disfagia e epilepsia. Toxoplasmose congênita: tríade de coriorretinite, hidrocefalia e calcificações intracranianas."],["CMV, rubéola e sífilis","CMV é a infecção congênita mais comum no mundo; pode causar surdez neurossensorial progressiva e, em casos graves, microcefalia e déficits motores. Rubéola: catarata, surdez e cardiopatia. Sífilis tardia: tíbia em sabre, articulações de Clutton, alterações neurológicas e tríade de Hutchinson."],["Prevenção primária","Rastreio pré-natal, vacinação e controle vetorial são predominantemente de enfermagem e medicina. O fisioterapeuta entra no acompanhamento da criança já afetada."],["Papel do fisioterapeuta","Acompanha a criança muitas vezes por anos: avaliação do desenvolvimento neuropsicomotor, estimulação precoce, prevenção e manejo de deformidades secundárias, prescrição de órteses e orientação familiar."]],"q":[{"t":"Zika","q":"A síndrome congênita do Zika está classicamente associada a:","o":["Focomelia com encurtamento simétrico dos ossos longos dos membros","Microcefalia com espasticidade e artrogripose secundária","Hipoacusia isolada, sem comprometimento motor associado","Escoliose idiopática do adolescente, de início puberal"],"c":1,"e":"Segundo o gabarito, o Zika cursa com microcefalia, espasticidade e frequente artrogripose secundária ao comprometimento neurológico central. Focomelia é da talidomida.","d":1},{"t":"Toxoplasmose","q":"A tríade clássica da toxoplasmose congênita inclui:","o":["Coriorretinite, hidrocefalia e calcificações intracranianas","Surdez neurossensorial, catarata e cardiopatia congênita grave","Focomelia, microcefalia e fenda palatina com anomalias renais","Icterícia, anemia hemolítica e hepatoesplenomegalia volumosa"],"c":0,"e":"Coriorretinite, hidrocefalia e calcificações intracranianas formam a tríade clássica da toxoplasmose congênita. Surdez, catarata e cardiopatia são da rubéola.","d":1},{"t":"Epidemia de Zika","q":"A síndrome congênita do Zika é apontada na apostila como uma das condições de maior demanda em fisioterapia neurofuncional pediátrica no Brasil desde:","o":["a epidemia de dengue hemorrágica de 1986–1987 no Sudeste","a pandemia de COVID-19, a partir de 2020 no país","a campanha nacional de vacinação do início dos anos 2000","a epidemia de 2015–2016"],"c":3,"e":"A apostila destaca a demanda crescente a partir da epidemia de 2015–2016.","d":1},{"t":"Rubéola congênita","q":"A síndrome clássica da rubéola congênita compreende:","o":["Coriorretinite, hidrocefalia e calcificações intracranianas","Microcefalia, espasticidade e artrogripose secundária","Catarata, surdez e cardiopatia","Tíbia em sabre, articulações de Clutton e tríade de Hutchinson"],"c":2,"e":"A rubéola congênita tem como síndrome clássica catarata, surdez e cardiopatia.","d":1},{"t":"Prevenção primária","q":"Qual das medidas abaixo é considerada prevenção primária das infecções congênitas, predominantemente a cargo de enfermagem e medicina?","o":["Avaliação do desenvolvimento neuropsicomotor ao longo dos anos","Rastreio pré-natal, vacinação e controle vetorial","Prescrição de órteses e orientação da família cuidadora","Estimulação precoce e manejo de deformidades secundárias"],"c":1,"e":"A apostila situa rastreio pré-natal, vacinação e controle vetorial como prevenção primária; as demais opções são condutas de acompanhamento do fisioterapeuta.","d":1},{"t":"Sífilis tardia","q":"Duas alterações musculoesqueléticas da sífilis congênita tardia são:","o":["Tíbia em sabre e articulações de Clutton","Focomelia e artrogripose congênita dos membros superiores","Escoliose e luxação congênita do quadril bilateral","Pé torto congênito e hipoplasia de fêmur proximal"],"c":0,"e":"O gabarito cita alterações ósseas como tíbia em sabre e articulações de Clutton (artrite/derrame articular, especialmente em joelhos).","d":1},{"t":"Plasticidade neural","q":"Por que crianças com síndrome congênita do Zika precisam de fisioterapia neurofuncional desde os primeiros meses de vida?","o":["Porque o quadro regride sozinho se houver estímulo apenas após os 2 anos","Porque a fisioterapia elimina o vírus e interrompe a lesão neurológica","Porque a estimulação precoce só é indicada antes do início da espasticidade","Porque a plasticidade neural inicial permite prevenir contraturas"],"c":3,"e":"O gabarito justifica: comprometimento central grave exige estimulação precoce pela maior plasticidade dos primeiros meses, prevenindo contraturas e favorecendo o máximo desenvolvimento motor.","d":2},{"t":"CMV","q":"Infecção congênita mais comum no mundo, frequentemente assintomática ao nascimento mas causadora de surdez progressiva, é:","o":["Rubéola congênita","Sífilis congênita (Treponema)","Citomegalovírus","Vírus Zika, transmitido por Aedes"],"c":2,"e":"O CMV é a infecção congênita mais prevalente mundialmente e pode causar surdez neurossensorial progressiva.","d":2},{"t":"Papel do fisioterapeuta","q":"Mesmo sem atuar na prevenção primária, o fisioterapeuta é figura central nas infecções congênitas porque:","o":["Coordena o rastreio pré-natal e a campanha de vacinação","Acompanha, muitas vezes por anos, a criança afetada","Substitui o acompanhamento médico e de enfermagem na rede","Atua apenas durante a internação neonatal, até a alta hospitalar"],"c":1,"e":"A apostila afirma que, embora a prevenção seja de enfermagem e medicina, o fisioterapeuta acompanha a criança afetada muitas vezes por anos.","d":2},{"t":"Sífilis tardia","q":"Sobre a sífilis congênita tardia, é correto afirmar que:","o":["Pode cursar com alterações ósseas e neurológicas","Limita-se a lesões cutâneas transitórias, sem sequelas","Compromete exclusivamente o sistema cardiovascular e o fígado","Restringe-se à audição, sem envolvimento ósseo ou neurológico"],"c":0,"e":"Segundo a apostila, a forma tardia pode causar alterações ósseas (tíbia em sabre, Clutton) e neurológicas, além da tríade de Hutchinson.","d":2},{"t":"Agente etiológico","q":"Qual grupo contém apenas infecções congênitas de origem viral?","o":["Zika, toxoplasmose e sífilis congênita","Citomegalovírus, sífilis e rubéola congênita","Toxoplasmose, rubéola e Zika vírus","Zika, citomegalovírus e rubéola"],"c":3,"e":"Zika, CMV e rubéola são virais; a toxoplasmose é protozoária e a sífilis é bacteriana.","d":2},{"t":"Achados por infecção","q":"Assinale a associação correta entre infecção congênita e achado:","o":["Rubéola: tíbia em sabre e articulações de Clutton","Sífilis: coriorretinite como achado isolado e único","Toxoplasmose: calcificações intracranianas","Citomegalovírus: catarata, surdez e cardiopatia clássicas"],"c":2,"e":"Calcificações intracranianas compõem a tríade da toxoplasmose; tíbia em sabre é da sífilis tardia e catarata com cardiopatia, da rubéola.","d":2},{"t":"Zika","q":"Lactente de 3 meses apresenta microcefalia, desproporção craniofacial, espasticidade, disfagia e crises epilépticas. A síndrome congênita mais provável é a do:","o":["Toxoplasma, com hidrocefalia e calcificações","Zika vírus","Vírus da rubéola, com catarata e cardiopatia","Treponema da sífilis tardia, com tíbia em sabre"],"c":1,"e":"Microcefalia, desproporção craniofacial, espasticidade, disfagia e epilepsia compõem o quadro descrito para o Zika na apostila.","d":3},{"t":"Toxoplasmose","q":"Lactente com perímetro cefálico aumentado por hidrocefalia, calcificações intracranianas na imagem e coriorretinite ao exame oftalmológico chega à fisioterapia. A hipótese etiológica é:","o":["Toxoplasmose congênita","Citomegalovírus, com surdez progressiva","Rubéola congênita, com catarata e cardiopatia","Síndrome congênita do Zika, com microcefalia"],"c":0,"e":"Coriorretinite, hidrocefalia e calcificações intracranianas são a tríade clássica da toxoplasmose congênita.","d":3},{"t":"Sífilis tardia","q":"Criança de 8 anos, com sífilis congênita não tratada, tem derrame articular nos joelhos e tíbias encurvadas em sabre. Esses achados representam:","o":["Sequela da síndrome congênita do Zika, por artrogripose secundária","Efeito tardio da rubéola congênita, com cardiopatia associada","Consequência da infecção congênita por citomegalovírus, com surdez","Manifestação óssea e articular da sífilis congênita tardia"],"c":3,"e":"Tíbia em sabre e articulações de Clutton (derrame, especialmente em joelhos) são manifestações musculoesqueléticas da sífilis congênita tardia.","d":3},{"t":"Deformidades secundárias","q":"Lactente de 10 meses com síndrome congênita do Zika e espasticidade começa a apresentar flexão fixa de joelhos e cotovelos. Qual conduta fisioterapêutica é coerente?","o":["Suspender a estimulação até a espasticidade cessar por completo","Orientar apenas rastreio pré-natal e controle vetorial da doença","Prevenir deformidades, avaliar órteses e orientar a família","Restringir a orientação à equipe médica, sem envolver a família"],"c":2,"e":"O papel do fisioterapeuta inclui prevenção e manejo de deformidades secundárias, prescrição de órteses e orientação familiar.","d":3},{"t":"Rubéola","q":"Recém-nascido apresenta catarata, surdez e sopro cardíaco por cardiopatia. Qual infecção congênita explica esse conjunto?","o":["Citomegalovírus congênito","Rubéola congênita","Toxoplasmose congênita","Síndrome congênita do Zika"],"c":1,"e":"Catarata, surdez e cardiopatia formam a síndrome clássica da rubéola congênita.","d":3},{"t":"Transmissão vertical","q":"Em uma UBS, gestante pergunta o que é transmissão vertical. A resposta correta é:","o":["Passagem do agente da mãe ao filho na gestação, parto ou amamentação","Passagem do agente por contato entre irmãos após o nascimento em domicílio","Infecção adquirida apenas no ambiente hospitalar pelo recém-nascido, após a alta","Transmissão exclusivamente por via transplacentária, ao longo da gestação"],"c":0,"e":"A transmissão vertical ocorre por via transplacentária, durante o parto ou pela amamentação.","d":3}],"models":[["zika","Microcefalia (Zika)"]]},{"id":"emb5","disc":"Embriologia","dk":"emb","n":5,"u":"V","titulo":"Métodos Anticoncepcionais","cor":"#9aa8ff","resumo":[["Cinco categorias","Os métodos se dividem em comportamentais, de barreira, hormonais, DIU e definitivos (cirúrgicos). Cada categoria tem um mecanismo próprio, ligado à fisiologia do ciclo menstrual vista na Unidade I."],["Comportamentais e barreira","Tabelinha, temperatura basal, muco cervical (Billings) e coito interrompido dependem da previsibilidade da ovulação e têm eficácia relativamente baixa. Os de barreira (preservativos, diafragma, capuz) bloqueiam o encontro dos gametas; o preservativo é o único que também protege contra IST."],["Hormonais","Atuam por inibição da ovulação (feedback negativo no eixo hipotálamo-hipófise) e espessamento do muco cervical. A pílula combinada inibe a ovulação; a minipílula (só progestagênio) espessa o muco e é a preferida em lactantes, pois o estrogênio pode reduzir o leite. A contracepção de emergência (levonorgestrel) retarda ou inibe a ovulação e não é abortiva."],["DIU","O DIU de cobre não tem hormônio e gera reação inflamatória local espermicida. O DIU hormonal (levonorgestrel) soma ao efeito local o espessamento do muco cervical e, em parte, a inibição da ovulação."],["Definitivos e escolha do método","Laqueadura secciona as tubas uterinas; vasectomia secciona os ductos deferentes, e o ejaculado segue sendo produzido pelas glândulas anexas, porém sem espermatozoides. A escolha considera eficácia (índice de Pearl), reversibilidade, contraindicações (estrogênio em tabagistas acima de 35 anos, hipertensas graves, história de trombose), praticidade, custo e proteção contra IST."]],"q":[{"t":"Proteção contra IST","q":"O único método anticoncepcional que também previne infecções sexualmente transmissíveis é:","o":["DIU de cobre, pela reação inflamatória local","Pílula combinada, pela alta eficácia","Preservativo (masculino ou feminino)","Anel vaginal, pela liberação hormonal"],"c":2,"e":"Segundo o gabarito, o preservativo é o único método com dupla função: contraceptiva e de prevenção de IST.","d":1},{"t":"DIU de cobre","q":"O mecanismo de ação do DIU de cobre é:","o":["Reação inflamatória local espermicida","Inibição hormonal da ovulação por feedback negativo","Bloqueio mecânico das tubas uterinas por ligadura","Espessamento do muco cervical por progestagênio"],"c":0,"e":"O DIU de cobre não contém hormônio; gera reação inflamatória local tóxica aos espermatozoides.","d":1},{"t":"Vasectomia","q":"A vasectomia impede a gravidez porque:","o":["Reduz a produção de testosterona pelos testículos","Bloqueia a secreção da próstata e das vesículas seminais","Inibe a ereção por ação sobre o sistema nervoso","Impede que haja espermatozoides no ejaculado"],"c":3,"e":"A secção do ducto deferente impede que os espermatozoides produzidos nos testículos alcancem o ejaculado, que segue sendo produzido pelas glândulas anexas.","d":1},{"t":"Temperatura basal","q":"No método da temperatura basal, a elevação discreta da temperatura após a ovulação ocorre sob ação de qual hormônio?","o":["Progesterona","Estrogênio produzido pelos folículos em crescimento","Hormônio luteinizante (LH), em pico pré-ovulatório","Hormônio folículo-estimulante (FSH) hipofisário"],"c":0,"e":"A apostila explica que a temperatura basal se eleva discretamente após a ovulação, sob ação da progesterona.","d":1},{"t":"Muco cervical","q":"No método de Billings, próximo à ovulação o muco cervical se apresenta:","o":["Espesso, opaco e escasso","Ressecado e aderente ao colo","Filante e transparente","Abundante e turvo, com odor"],"c":2,"e":"Próximo à ovulação o muco torna-se filante e transparente, sinal usado pelo método de Billings para estimar o período fértil.","d":1},{"t":"Implante subdérmico","q":"O implante subdérmico caracteriza-se por:","o":["Liberação de cobre, com ação inflamatória local espermicida contínua","Liberação contínua de progestagênio, com duração de até 3 anos","Liberação de estrogênio isolado, com troca mensal pela usuária","Bloqueio físico do colo do útero, colocado antes de cada relação sexual"],"c":1,"e":"O implante libera progestagênio de forma contínua, com alta eficácia e longa duração (até 3 anos).","d":1},{"t":"Métodos comportamentais","q":"Por que os métodos comportamentais têm eficácia inferior à dos hormonais?","o":["Dependem da previsibilidade do ciclo, mas a ovulação varia de ciclo a ciclo","Atuam apenas depois da fecundação, quando a implantação já ocorreu","Bloqueiam a ovulação de modo incompleto, por baixa dose hormonal","Não se baseiam na fisiologia do ciclo, apenas no calendário do ano civil"],"c":0,"e":"Estresse, doenças e irregularidades hormonais alteram a ovulação; os hormonais suprimem o eixo hipotálamo-hipófise-ovário e eliminam essa variabilidade.","d":2},{"t":"Lactação e minipílula","q":"Por que a minipílula é preferida à pílula combinada durante a amamentação?","o":["Porque inibe a ovulação com mais intensidade que a combinada","Porque tem ação espermicida local, sem efeito hormonal sistêmico","Porque protege contra IST no puerpério, além da contracepção","Porque não contém estrogênio, que pode reduzir o leite"],"c":3,"e":"O estrogênio da pílula combinada pode reduzir o leite materno; o progestagênio isolado não tem esse efeito significativo sobre a lactação.","d":2},{"t":"Pílula combinada","q":"A pílula combinada (estrogênio + progestagênio) atua principalmente por:","o":["Espessamento do muco cervical, sem efeito sobre a ovulação","Reação inflamatória local espermicida no endométrio, sem hormônios","Inibição da ovulação por feedback negativo hipotálamo-hipofisário","Bloqueio físico da entrada dos espermatozoides no colo, como o diafragma"],"c":2,"e":"A pílula combinada inibe a ovulação por feedback negativo; o espessamento do muco é o mecanismo principal da minipílula.","d":2},{"t":"DIU hormonal","q":"O que diferencia o DIU hormonal (levonorgestrel) do DIU de cobre?","o":["Age apenas por reação inflamatória local espermicida, como o de cobre","Soma ao efeito local o espessamento do muco e, em parte, inibe a ovulação","Libera estrogênio e progestagênio combinados de forma sistêmica contínua","Bloqueia mecanicamente as tubas uterinas e impede a passagem do oócito"],"c":1,"e":"O DIU hormonal associa o efeito local do dispositivo ao espessamento do muco cervical e, em parte, à inibição da ovulação; o de cobre não tem hormônio.","d":2},{"t":"Métodos definitivos","q":"Laqueadura tubária e vasectomia interrompem, respectivamente:","o":["Os ductos deferentes e as tubas uterinas, respectivamente","As tubas uterinas e a uretra prostática, respectivamente","Os ovários e os testículos, respectivamente","As tubas uterinas e os ductos deferentes"],"c":3,"e":"Laqueadura é a ligadura ou secção das tubas uterinas; vasectomia é a ligadura ou secção dos ductos deferentes.","d":2},{"t":"Critérios de escolha","q":"Segundo a apostila, qual perfil tem contraindicação ao uso de estrogênios?","o":["Nulípara de 22 anos sem comorbidades","Mulher com ciclos menstruais regulares","Tabagista com mais de 35 anos","Mulher que deseja engravidar em um ano"],"c":2,"e":"Estrogênios são contraindicados em tabagistas acima de 35 anos, hipertensas graves e mulheres com história de trombose.","d":2},{"t":"Caso: lactante","q":"Puérpera de 3 meses, em amamentação exclusiva, atendida na fisioterapia uroginecológica, pergunta qual hormonal seria mais indicado. Qual orientação está de acordo com a apostila?","o":["Pílula combinada, pois inibe a ovulação com mais segurança e regularidade","Minipílula, pois o progestagênio isolado preserva a lactação","Anel vaginal combinado, por evitar o uso diário da pílula","Adesivo transdérmico combinado, por liberação contínua e sem uso diário"],"c":1,"e":"Em lactantes, a opção hormonal preferencial é a minipílula, pois o estrogênio dos métodos combinados pode reduzir a produção de leite.","d":3},{"t":"Caso: contraindicação","q":"Paciente de 38 anos, tabagista e hipertensa grave, faz reabilitação cardiorrespiratória e usa pílula combinada. Por que esse método merece reavaliação médica?","o":["Porque não inibe a ovulação nessa faixa etária, o que eleva o risco de gravidez indesejada","Porque atua apenas espessando o muco cervical, com eficácia reduzida em fumantes","Porque tem ação espermicida local que agrava a hipertensão e a doença cardiorrespiratória","Porque o estrogênio é contraindicado em tabagistas >35 anos e hipertensas graves"],"c":3,"e":"O estrogênio é contraindicado em tabagistas acima de 35 anos, hipertensas graves e com história de trombose; a pílula combinada o contém.","d":3},{"t":"Caso: prevenção de IST","q":"Universitária de 19 anos, sem parceiro fixo, pergunta à fisioterapeuta qual método evita gravidez e também reduz o risco de IST. A orientação correta é:","o":["Pílula combinada, pela alta eficácia e praticidade de uso","Preservativo, único método com dupla função","DIU de cobre, pela reação inflamatória local espermicida","Tabelinha, por não usar hormônios nem dispositivos"],"c":1,"e":"O preservativo (masculino ou feminino) é a única categoria que combina contracepção e proteção contra IST.","d":3},{"t":"Caso: vasectomia","q":"Homem de 40 anos, em atendimento por lombalgia, fez vasectomia e teme que o volume do ejaculado tenha desaparecido. A explicação correta é:","o":["O ejaculado persiste, produzido pelas glândulas anexas, sem espermatozoides","O ejaculado cessa porque a testosterona cai e a próstata para de funcionar","O ejaculado persiste apenas se a ereção estiver inibida pelo procedimento","A próstata deixa de produzir secreção e o volume cai à metade"],"c":0,"e":"A secção do ducto deferente impede a passagem dos espermatozoides; o sêmen segue sendo produzido pelas glândulas anexas.","d":3},{"t":"Caso: tabelinha","q":"Paciente usava a tabelinha com ciclos regulares, mas após um período de estresse intenso e doença engravidou. Qual explicação fisiológica se aplica?","o":["A progesterona elevada pelo estresse impede a ovulação em todos os ciclos seguintes","O muco cervical torna-se espesso e favorece a fecundação após o estresse","A ovulação varia de ciclo para ciclo, e o período fértil calculado falha","A tabelinha atua inibindo o eixo hipotálamo-hipófise-ovário de modo intermitente"],"c":2,"e":"Métodos comportamentais dependem da previsibilidade do ciclo, mas estresse e doenças alteram o momento da ovulação.","d":3},{"t":"Contracepção de emergência","q":"Paciente teve relação desprotegida e pergunta se a pílula do dia seguinte (levonorgestrel) é abortiva. A resposta correta é:","o":["Sim, pois elimina o embrião já implantado no endométrio","Não; atua principalmente retardando ou inibindo a ovulação","Não; atua sobretudo por espessamento permanente do muco e atrofia endometrial","Sim, pois provoca reação inflamatória espermicida no útero e lesa o embrião"],"c":1,"e":"A contracepção de emergência usa altas doses de progestagênio, atua principalmente retardando ou inibindo a ovulação e não é abortiva.","d":3}],"models":[["diu","Anticoncepção"]]},{"id":"emb6","disc":"Embriologia","dk":"emb","n":6,"u":"VI","titulo":"Gestação, Parto e Puerpério","cor":"#b79bff","resumo":[["Adaptações cardiovasculares e respiratórias","O volume plasmático aumenta em até 50% e o débito cardíaco em 30–50%. O útero em crescimento eleva o diafragma, com hiperventilação compensatória. Isso fundamenta os limites de segurança para o exercício supervisionado."],["Sistema musculoesquelético","O útero desloca o centro de gravidade para frente, gerando hiperlordose lombar, retificação torácica e anteriorização da cabeça, o que predispõe à lombalgia. A relaxina causa frouxidão ligamentar, sobretudo na sínfise púbica e sacroilíacas, com risco de dor pélvica gestacional."],["Diástase e assoalho pélvico","O estiramento da linha alba afasta os retos abdominais, e a diástase pode persistir no pós-parto. O peso do útero e o parto vaginal sobrecarregam o assoalho pélvico, com risco de incontinência urinária de esforço, tratada com Kegel e biofeedback."],["Digestório, urinário e pele","A progesterona reduz a motilidade gastrointestinal, favorecendo refluxo e constipação. A filtração glomerular aumenta e a compressão vesical causa polaciúria. Há hiperpigmentação (cloasma, linha nigra) e estrias por distensão dérmica."],["Parto e puerpério","O parto tem quatro fases: dilatação (colo até 10 cm), expulsão, dequitação e quarto período, quando se vigia a atonia uterina. O puerpério dura cerca de 6 semanas e é o foco da reabilitação pós-parto: assoalho pélvico, diástase, postura e retorno seguro ao exercício."]],"q":[{"t":"Hiperlordose","q":"A hiperlordose lombar gestacional está relacionada principalmente a:","o":["Aumento da frequência cardíaca e do débito cardíaco em repouso","Deslocamento anterior do centro de gravidade e ação da relaxina","Redução do volume plasmático e da pressão arterial materna","Aumento da filtração glomerular e da diurese noturna materna"],"c":1,"e":"Segundo o gabarito, o crescimento uterino desloca o centro de gravidade anteriormente e, somado à frouxidão ligamentar da relaxina, leva à hiperlordose compensatória.","d":1},{"t":"Diástase abdominal","q":"A diástase dos músculos retos abdominais decorre de:","o":["Ação da ocitocina sobre a musculatura lisa do útero e da mama","Compressão da bexiga pelo útero gravídico em crescimento","Redução do volume plasmático materno no terceiro trimestre","Estiramento progressivo da linha alba na gestação"],"c":3,"e":"O gabarito indica que a diástase resulta do estiramento progressivo da linha alba, tecido conjuntivo entre os músculos retos abdominais.","d":1},{"t":"Atonia uterina","q":"O período do parto de maior risco de hemorragia por atonia uterina é:","o":["O quarto período, na primeira hora pós-parto","A fase de dilatação, com o colo chegando a 10 cm","A fase de expulsão, até a saída completa do bebê","A dequitação, logo após a expulsão da placenta"],"c":0,"e":"Pelo gabarito, o quarto período (primeira hora pós-parto) é o de maior vigilância para hemorragia por atonia uterina.","d":1},{"t":"Relaxina","q":"Qual hormônio é responsável pela frouxidão da sínfise púbica durante a gestação?","o":["Progesterona","Estrogênio","Relaxina","Ocitocina"],"c":2,"e":"A relaxina promove frouxidão ligamentar generalizada, especialmente na sínfise púbica e nas sacroilíacas, preparando a pelve para o parto.","d":1},{"t":"Fases do parto","q":"Qual alternativa apresenta a sequência correta das quatro fases do trabalho de parto?","o":["Dilatação, dequitação, expulsão e quarto período","Dilatação, expulsão, dequitação e quarto período","Expulsão, dilatação, dequitação e quarto período","Dilatação, expulsão, quarto período e dequitação"],"c":1,"e":"A apostila descreve as fases na ordem: dilatação, expulsão (até o nascimento), dequitação (expulsão da placenta) e quarto período (primeira hora pós-parto).","d":1},{"t":"Puerpério","q":"Segundo a apostila, o puerpério tem duração aproximada de:","o":["2 semanas","4 semanas","6 semanas","12 semanas"],"c":2,"e":"O puerpério dura cerca de 6 semanas, com involução uterina e readaptação musculoesquelética progressiva, fase central de intervenção da fisioterapia.","d":1},{"t":"Cardiovascular","q":"Quais são as adaptações cardiovasculares descritas para a gestação?","o":["Volume plasmático aumenta até 50% e débito cardíaco aumenta 30–50%","Volume plasmático diminui e débito cardíaco aumenta 30–50%","Volume plasmático aumenta até 50% e débito cardíaco cai 30–50%","Volume plasmático e débito cardíaco permanecem estáveis, com aumento da FC"],"c":0,"e":"A apostila descreve aumento do volume plasmático em até 50% e do débito cardíaco em 30–50%, o que fundamenta os limites de segurança para o exercício supervisionado.","d":2},{"t":"Digestório","q":"Qual alteração do sistema digestório na gestação explica o refluxo e a constipação?","o":["Progesterona aumenta a motilidade e favorece diarreia e má absorção","Relaxina reduz a motilidade e favorece refluxo e constipação","Estrogênio acelera o trânsito e reduz a absorção de ferro","Progesterona reduz a motilidade e favorece refluxo e constipação"],"c":3,"e":"A progesterona reduz a motilidade gastrointestinal, favorecendo refluxo e constipação. A relaxina atua nos ligamentos, não na motilidade.","d":2},{"t":"Assoalho pélvico","q":"Por que a gestação predispõe à incontinência urinária de esforço?","o":["Aumento da filtração glomerular, que eleva o volume urinário e a urgência","Sobrecarga do assoalho pélvico pelo peso do útero e pelo parto vaginal","Diástase dos retos, que reduz a pressão sobre a bexiga e o esfíncter","Hiperlordose lombar, que comprime o esfíncter uretral externo"],"c":1,"e":"Conforme o gabarito, o peso progressivo do útero e o parto vaginal sobrecarregam o assoalho pélvico, aumentando o risco de incontinência urinária de esforço.","d":2},{"t":"Urinário","q":"A polaciúria da gestação é atribuída principalmente a:","o":["Frouxidão da sínfise púbica pela relaxina","Estiramento da linha alba sobre a bexiga","Compressão vesical pelo útero gravídico","Redução da filtração glomerular materna"],"c":2,"e":"A apostila associa a polaciúria à compressão vesical pelo útero gravídico, além do aumento da filtração glomerular.","d":2},{"t":"Relaxina","q":"Em quais regiões a frouxidão ligamentar induzida pela relaxina é especialmente evidente?","o":["Sínfise púbica e articulações sacroilíacas","Articulações interfalângicas e punhos","Articulações temporomandibulares e cervicais","Articulações do joelho e do tornozelo"],"c":0,"e":"A relaxina causa frouxidão generalizada, mas de modo especial na sínfise púbica e nas sacroilíacas, o que pode gerar instabilidade e dor pélvica.","d":2},{"t":"Dilatação","q":"Em qual fase do parto o colo dilata até 10 cm e a fisioterapia pode atuar com posicionamento, respiração e TENS obstétrico?","o":["Expulsão","Dequitação","Quarto período","Dilatação"],"c":3,"e":"Na dilatação, as contrações rítmicas dilatam o colo até 10 cm, e a fisioterapia obstétrica pode aplicar técnicas de alívio da dor.","d":2},{"t":"Postura gestacional","q":"Gestante de 30 semanas com lombalgia apresenta hiperlordose lombar, retificação torácica e anteriorização da cabeça. Qual a explicação do padrão?","o":["Aumento da frequência cardíaca sobrecarregando a musculatura paravertebral","Redução da capacidade vital projetando o tronco para frente","Aumento da filtração glomerular alterando o alinhamento pélvico","Deslocamento anterior do centro de gravidade pelo útero em crescimento"],"c":3,"e":"O crescimento uterino desloca o centro de gravidade anteriormente, gerando hiperlordose compensatória que sobrecarrega a lombar e predispõe à lombalgia gestacional.","d":3},{"t":"Dor pélvica","q":"Gestante refere dor na região púbica e nas sacroilíacas ao caminhar e virar na cama, com instabilidade pélvica. Qual conduta fisioterapêutica é coerente?","o":["Estabilização pélvica, transferências simétricas de peso e, se indicado, cinta","Repouso absoluto no leito até o parto, para poupar a sínfise púbica e as sacroilíacas","Alongamento passivo máximo dos adutores e dos flexores do quadril para aliviar a tensão","Fortalecimento abdominal intenso com sobrecarga, para compensar a frouxidão ligamentar"],"c":0,"e":"O quadro sugere disfunção da sínfise púbica por frouxidão da relaxina; o gabarito cita estabilização pélvica, transferências de peso simétricas e cinta pélvica.","d":3},{"t":"Incontinência","q":"Puérpera de 3 semanas após parto vaginal perde urina ao tossir e espirrar. Qual foco de tratamento é mais adequado?","o":["Alívio da dor com TENS obstétrico durante as contrações","Uso exclusivo de cinta pélvica para estabilizar a sínfise","Treino do assoalho pélvico com Kegel e biofeedback","Restrição da ingestão de líquidos para reduzir a diurese"],"c":2,"e":"O quadro é de incontinência urinária de esforço pós-parto; o gabarito indica treino da musculatura do assoalho pélvico (Kegel, biofeedback).","d":3},{"t":"Diástase abdominal","q":"Na avaliação de uma puérpera, palpa-se afastamento dos músculos retos abdominais na linha média. Qual a interpretação correta?","o":["Hérnia inguinal secundária ao esforço expulsivo, com indicação cirúrgica","Retração fisiológica da linha alba, resolvida sem necessidade de avaliação","Atonia uterina residual, com dor referida na linha média abdominal","Diástase dos retos, que pode persistir e é tratada na fisioterapia"],"c":3,"e":"O achado indica diástase por estiramento da linha alba, que pode persistir no pós-parto e é uma das principais condições avaliadas e tratadas pela fisioterapia.","d":3},{"t":"Tegumentar","q":"Gestante de 24 semanas percebe uma linha escura no abdome, manchas na face e estrias. Como esses achados são explicados?","o":["Manifestação cutânea de atonia uterina, sem relação com hormônios","Hiperpigmentação (linha nigra, cloasma) e estrias por distensão dérmica","Sequela da frouxidão ligamentar induzida pela relaxina na pele","Reação de hipersensibilidade ao aumento do volume plasmático"],"c":1,"e":"A apostila descreve hiperpigmentação (cloasma, linha nigra) e estrias por distensão dérmica como adaptações tegumentares da gestação.","d":3},{"t":"Puerpério","q":"Puérpera de 5 semanas deseja voltar a correr. Qual plano de reabilitação é coerente com a apostila?","o":["Reabilitar assoalho pélvico, tratar diástase e reeducar a postura antes do retorno","Liberar o retorno imediato à corrida, pois a involução uterina já se completou","Contraindicar qualquer atividade física até o fim da amamentação, por segurança","Focar apenas em ganho de força de membros inferiores e capacidade aeróbica"],"c":0,"e":"A intervenção no puerpério envolve reabilitação do assoalho pélvico, tratamento da diástase, reeducação postural e retorno seguro à atividade física.","d":3}],"models":[["gestante","Postura na gestação"]]},{"id":"gen1","disc":"Genética","dk":"gen","n":7,"u":"I","titulo":"Dogma Central e Erros Inatos do Metabolismo","cor":"#f2c14e","resumo":[["DNA: estrutura e pareamento","O DNA é um polímero de nucleotídeos (desoxirribose, fosfato e base nitrogenada) em dupla-hélice. Púricas: A e G; pirimídicas: T e C. O pareamento é A-T (2 pontes de hidrogênio) e C-G (3 pontes). No RNA, a uracila substitui a timina."],["Da cromatina ao cromossomo","No núcleo, o DNA associado a histonas forma a cromatina (nucleossomos). Na divisão celular ela se condensa em cromossomos, visíveis em metáfase. O ser humano tem 46 cromossomos: 22 pares de autossomos e 1 par sexual."],["Replicação do DNA","É semiconservativa, mediada pela DNA polimerase (síntese 5’→3’). A helicase abre a hélice e a DNA ligase fecha os fragmentos de Okazaki."],["Transcrição e Dogma Central","Fluxo: DNA → RNA (transcrição) → proteína (tradução). A RNA polimerase atua em iniciação, elongação e terminação. Em eucariotos, o pré-mRNA perde íntrons e ganha quepe 5’ e cauda poli-A."],["Erros inatos do metabolismo","EIM: doença genética, geralmente autossômica recessiva, por deficiência de enzima em via metabólica. PKU: deficiência de fenilalanina hidroxilase, com risco de hipertonia e tremores. Mucopolissacaridoses: depósito lisossômico com rigidez articular, contraturas e comprometimento respiratório. O teste do pezinho permite intervenção fisioterapêutica precoce."]],"q":[{"t":"Pareamento de bases","q":"O pareamento correto de bases nitrogenadas no DNA é:","o":["A-C e G-T","A-T e C-G","A-G e C-T","A-U e C-G"],"c":1,"e":"Adenina pareia com timina (2 pontes de hidrogênio) e citosina com guanina (3 pontes). A uracila só existe no RNA.","d":1},{"t":"Lisossomos e MPS","q":"As mucopolissacaridoses são exemplos de:","o":["Aneuploidias dos cromossomos sexuais","Distrofias musculares ligadas ao X","Doenças multifatoriais poligênicas","Doenças de depósito lisossômico"],"c":3,"e":"Segundo o gabarito, causam acúmulo de glicosaminoglicanos, com rigidez articular e deformidades esqueléticas.","d":1},{"t":"Transcrição e RNA","q":"Na transcrição, a base nitrogenada que substitui a timina no RNA é:","o":["Uracila","Adenina","Citosina","Guanina"],"c":0,"e":"No RNA, a uracila substitui a timina e pareia com a adenina.","d":1},{"t":"Cromossomos humanos","q":"A composição cromossômica normal de uma célula humana é:","o":["23 pares de autossomos e mais 1 cromossomo sexual isolado, em cada célula somática","22 autossomos e 2 pares de cromossomos sexuais, totalizando 48 cromossomos","22 pares de autossomos e 1 par sexual (XX ou XY)","21 pares de autossomos e 2 pares sexuais, totalizando 46 cromossomos"],"c":2,"e":"O ser humano tem 46 cromossomos (23 pares): 22 pares de autossomos e 1 par sexual.","d":1},{"t":"Replicação do DNA","q":"Qual enzima abre a dupla-hélice durante a replicação do DNA?","o":["DNA polimerase","Helicase","DNA ligase","RNA polimerase"],"c":1,"e":"A helicase abre a hélice; a DNA polimerase sintetiza a nova fita e a DNA ligase une os fragmentos de Okazaki.","d":1},{"t":"Dogma Central","q":"O Dogma Central da Biologia Molecular descreve o fluxo da informação genética como:","o":["DNA para RNA (transcrição) e RNA para proteína (tradução)","RNA para DNA (replicação) e DNA para proteína (tradução)","Proteína para RNA (tradução) e RNA para DNA (transcrição reversa)","DNA para proteína (transcrição) e proteína para RNA (replicação)"],"c":0,"e":"O fluxo é DNA → RNA (transcrição) → proteína (tradução); a replicação duplica o DNA.","d":1},{"t":"Definição de EIM","q":"Um erro inato do metabolismo (EIM) é definido como:","o":["Doença por excesso de enzima em uma via metabólica, em geral de herança autossômica dominante","Alteração numérica de cromossomos que reduz a síntese de enzimas em várias vias","Doença por deficiência de enzima em via metabólica, em geral autossômica recessiva","Infecção neonatal que lesa as vias metabólicas do fígado e altera a produção enzimática"],"c":2,"e":"O EIM é doença genética, geralmente autossômica recessiva, causada pela deficiência de uma enzima em uma via metabólica.","d":2},{"t":"Replicação do DNA","q":"Por que a replicação do DNA é chamada de semiconservativa?","o":["As duas moléculas-filhas são formadas só por fitas novas","Uma molécula-filha fica só com fitas originais e a outra só com novas","As fitas são fragmentadas e recombinadas ao acaso nas filhas","Cada molécula-filha tem uma fita original e uma fita nova"],"c":3,"e":"No processo semiconservativo, cada dupla-hélice filha conserva uma fita do molde e recebe uma fita recém-sintetizada.","d":2},{"t":"Cromatina e cromossomo","q":"Quando o DNA se apresenta como cromossomos visíveis?","o":["Na divisão celular, em metáfase, quando a cromatina se condensa","Na interfase, quando o DNA associado a histonas forma os nucleossomos e a cromatina","Na transcrição, quando a RNA polimerase se liga ao DNA e abre a dupla-hélice","Na replicação, quando a helicase abre a dupla-hélice e a DNA polimerase copia as fitas"],"c":0,"e":"No núcleo, o DNA associado a histonas forma a cromatina (nu
