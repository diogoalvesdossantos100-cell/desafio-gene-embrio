      const fmtS = v => {
        const k = Math.round(v * KM / 100);
        if (k === 0) return "Iniciação: o ribossomo se monta sobre o códon de início AUG; o tRNA com metionina (Met) ocupa o sítio P";
        if (k < KM) return "Elongação: o códon " + CD[k + 1][0] + " (" + CD[k + 1][1] + ") pareia com o anticódon do tRNA no sítio A; forma-se a ligação peptídica. Cadeia com " + (k + 1) + " aminoácidos";
        return "Terminação: o códon de parada UAA chega ao sítio A e não há tRNA para ele; a cadeia polipeptídica de 6 aminoácidos é liberada";
      };
      const codPos = () => { const c = K < 3 ? 5 : 1; return Q(xc(c), 0, .16); };
      return {
        group: g, dist: 6.4, rot: [.3, -.2],
        hint: "O ribossomo lê o mRNA de 5' para 3'. A cor do aminoácido é a mesma no tRNA e na cadeia.",
        slider: { label: "Posição do ribossomo", val: 40, fmt: fmtS, on: v => setState(Math.round(v * KM / 100)) },
        update(t) {
          const dt = clamp(t - last, 0, .05); last = t;
          cur += (tgt - cur) * (1 - Math.exp(-dt * 7)); rb.position.x = cur;
        },
        labels: [
          { n: "mRNA", d: "RNA mensageiro: fita que leva a informação do gene até o ribossomo. É lido de 5' para 3', de três em três bases.", p: () => Q(-2.85, 0, .12) },
          { n: "Códon", d: "Trinca de bases do mRNA que especifica um aminoácido, segundo o código genético (64 códons, 20 aminoácidos). AUG é o códon de início; UAA, UAG e UGA são códons de parada.", p: codPos },
          { n: "Ribossomo", d: "Onde ocorre a tradução. Tem duas subunidades: a maior (verde, por cima), onde se formam as ligações peptídicas, e a menor (azul-petróleo, por baixo), que se liga ao mRNA.", p: () => Q(rb.position.x + .5, .75, .3) },
          { n: "Subunidade menor", d: "Subunidade menor do ribossomo. Segura o mRNA e permite o pareamento entre códon e anticódon.", p: () => Q(rb.position.x + .5, -.2, .3) },
          { n: "tRNA", d: "RNA transportador: leva um aminoácido específico e tem, na outra ponta, o anticódon. Fica no sítio P (segura a cadeia) ou no sítio A (recebe o novo aminoácido).", p: () => Q(rb.position.x - W / 2, .5, .1) },
          { n: "Anticódon", d: "Trinca de bases do tRNA complementar ao códon do mRNA (por exemplo, o códon AUG pareia com o anticódon UAC). Garante que o aminoácido certo seja colocado.", p: () => Q(rb.position.x + W / 2, .115, .12) },
          { n: "Aminoácido", d: "Unidade da proteína. Cada tRNA entrega o seu; a cor mostra o tipo (a primeira, a metionina, vem do códon AUG).", p: () => Q(rb.position.x - W / 2, .8, .1) },
          { n: "Cadeia polipeptídica", d: "Sequência de aminoácidos unidos por ligações peptídicas, que cresce a cada passo do ribossomo. Ao fim, dobra-se e forma a proteína.", p: () => Q(rb.position.x - W / 2 - .13 * Math.min(K, 4) - .15, .8 + .22 * Math.min(K, 4) + .2, .1) }
        ]
      };
    },

    /* ================= Hemoglobina S e hemácia falciforme ================= */
    falciforme() {
      const g = new T.Group(), w = new T.Group(), OY = -1.05; w.position.y = OY; g.add(w);
      const Q = (x, y, z) => P(x, y + OY, z);

      /* geometria-base da hemácia biconcava (perfil de Evans-Fung) */
      const zf = u => Math.sqrt(Math.max(0, 1 - u * u)) * (.207161 + 2.002558 * u * u / 4 - 1.122762 * Math.pow(u, 4) / 16);
      const pts = [], nn = 16, us = []; for (let i = 0; i <= nn; i++) us.push(Math.sin(i / nn * Math.PI / 2));
      for (let i = 0; i <= nn; i++) pts.push(new T.Vector2(us[i], zf(us[i])));
      for (let i = nn - 1; i >= 0; i--) pts.push(new T.Vector2(us[i], -zf(us[i])));
      const base = new T.LatheGeometry(pts, 32), bp = base.attributes.position.array.slice();
      function morphInto(geo, m) {
        const a = geo.attributes.position.array, ex = 1 + 1.4 * m, kap = m > 1e-3 ? 1.1 * m / ex : 0;
        const sag = kap > 1e-4 ? (1 - Math.cos(kap * ex)) / kap : 0;
        for (let i = 0; i < a.length; i += 3) {
          let x = bp[i], y = bp[i + 1], z = bp[i + 2];
          const tp = Math.abs(x * ex) / ex;
          x *= ex; z *= (1 - .45 * m) * (1 - .8 * m * tp * tp); y *= (1 + .5 * m);
          if (kap > 1e-4) { const th = x * kap, s = Math.sin(th), c = Math.cos(th); const X = s / kap - z * s, Z = (1 - c) / kap + z * c - sag / 2; x = X; z = Z; }
          a[i] = x; a[i + 1] = y; a[i + 2] = z;
        }
        geo.attributes.position.needsUpdate = true; geo.computeVertexNormals(); geo.computeBoundingSphere();
        return kap > 1e-4 ? P(Math.sin(kap * ex) / kap, 0, (1 - Math.cos(kap * ex)) / kap - sag / 2) : P(ex, 0, 0);
      }
      const geos = [], mats = [];
      const gLvl = l => { if (!geos[l]) { geos[l] = base.clone(); morphInto(geos[l], l / 10); } return geos[l]; };
      const colN = new T.Color(0xf0505a), colS = new T.Color(0xa62f3c);
      const mLvl = l => { if (!mats[l]) mats[l] = M3(colN.clone().lerp(colS, l / 10).getHex(), 1, { emissive: 0x3a0808, emissiveIntensity: .2 }); return mats[l]; };

      /* vaso */
      const VL = 6.6, VR = .85;
      w.add(new T.Mesh(new T.CylinderGeometry(VR, VR, VL, 36, 1, true).rotateZ(Math.PI / 2), M3(0xe8695b, .14, { depthWrite: false })));
      [-1, 1].forEach(sd => { const r = new T.Mesh(new T.TorusGeometry(VR, .025, 8, 40).rotateY(Math.PI / 2), M3(0xf29a8e)); r.position.x = sd * VL / 2; w.add(r); });
      [.8, 2.4, 4, 5.5].forEach(a => { const r = new T.Mesh(new T.CylinderGeometry(.013, .013, VL, 5).rotateZ(Math.PI / 2), M3(0xf29a8e, .6)); r.position.set(0, VR * Math.sin(a), VR * Math.cos(a)); w.add(r); });

      /* hemácias de referência no alto */
      const HY = 2.15, HR = .5, TILT = 1.2;
      const ref = new T.Mesh(gLvl(0), mLvl(0)); ref.scale.setScalar(HR); ref.position.set(-1.35, HY, 0); ref.rotation.x = TILT; w.add(ref);
      const hero = new T.Mesh(base.clone(), M3(0xff5c5c, 1, { emissive: 0x3a0808, emissiveIntensity: .2 })); hero.scale.setScalar(HR); hero.position.set(1.35, HY, 0); hero.rotation.x = TILT; w.add(hero);
      let tipL = P(1, 0, 0), sVal = 60;

      /* hemácias em fluxo */
      const NF = 13, cells = [], fr = i => (Math.sin(i * 12.9898) * 43758.5453) % 1;
      for (let i = 0; i < NF; i++) {
        const a = i * 2.4, r = .1 + .3 * Math.abs(fr(i + 1)), m = new T.Mesh(gLvl(0), mLvl(0)); m.scale.setScalar(.27); w.add(m);
        cells.push({ m, x: -3 + i * .5, y: r * Math.sin(a), z: r * Math.cos(a), roll: i * 1.7, spin: (i % 2 ? .7 : -.6), thr: .05 + .55 * Math.abs(fr(i + 7)), lv: 0 });
      }
      /* tampão (vaso-oclusão) */
      const PX = 1.1, PLm = .55, plugSpec = [[.75, .1, .15, .6, 0], [.95, -.25, -.1, 1.6, .3], [1.1, .2, -.2, .2, -.2], [1.25, -.05, .25, 2.2, .4], [1.4, .25, .1, 1.2, -.3], [1.05, -.3, .3, .9, .2]];
      const plug = plugSpec.map(q => { const m = new T.Mesh(gLvl(10), mLvl(10)); m.position.set(q[0], q[1], q[2]); m.rotation.set(q[3], q[4], .0); m.scale.setScalar(.27); m.visible = false; w.add(m); return m; });
      let occ = 0;

      function setS(v) {
        sVal = v; const m = v / 100;
        tipL = morphInto(hero.geometry, m); hero.material.color.copy(colN).lerp(colS, m);
        hero.updateMatrix();
        occ = smooth(40, 75, v);
        plug.forEach(p => { p.visible = occ > .02; p.scale.setScalar(.27 * occ); });
        cells.forEach(c => {
          const lv = Math.round(10 * clamp((m - c.thr) / .25, 0, 1));
          if (lv !== c.lv) { c.lv = lv; c.m.geometry = gLvl(lv); c.m.material = mLvl(lv); }
        });
      }
      setS(60);

      let last = 0;
      function update(t) {
        const dt = clamp(t - last, 0, .05); last = t;
        const v = 1.1 * (1 - .25 * sVal / 100), on = occ > .6;
        const ord = cells.slice().sort((a, b) => b.x - a.x);
        let lim = 1e9;
        ord.forEach(c => {
          let nx = c.x + v * dt;
          if (on && c.x < PLm) nx = Math.min(nx, lim);
          if (on && c.x < PLm) lim = nx - .48;
          if (nx > VL / 2 - .1) nx = -VL / 2 + .1;
          c.x = nx;
          c.m.position.set(c.x, c.y, c.z + .03 * Math.sin(t * 2 + c.roll));
          const stuck = on && c.x < PLm && c.x >= lim + .45 - 1e-3 && false;
          c.m.rotation.x = c.roll + (on && c.x > PLm - 1 && c.x < PLm ? 0 : t * c.spin) * (stuck ? 0 : 1);
        });
        hero.rotation.y = .12 * Math.sin(t * .6); ref.rotation.y = -.12 * Math.sin(t * .6);
        plug.forEach((p, i) => { p.rotation.z = .1 * Math.sin(t * 3 + i); });
      }

      const heroP = (lx) => { hero.updateMatrix(); return P(lx.x, lx.y, lx.z).applyMatrix4(hero.matrix); };
      return {
        group: g, dist: 10.2, rot: [.28, -.25],
        hint: "Arraste o controle: a hemácia da direita muda de forma e o vaso vai sendo bloqueado. A da esquerda é a referência normal.",
        slider: {
          label: "Desoxigenação / hemoglobina S", val: 60,
          fmt: v => v < 20 ? "Oxigenada: hemácia normal, biconcava e flexível, passa livre pelo vaso" : v < 45 ? "Baixa oxigenação: a HbS (mutação missense, Glu→Val na posição 6 da beta-globina) começa a polimerizar" : v < 75 ? "HbS polimerizada: hemácias em foice, rígidas e frágeis (hemólise); começam a se prender no vaso" : "Vaso-oclusão: fluxo bloqueado e infarto ósseo. Dor da crise vaso-oclusiva; infartos repetidos levam à necrose avascular da cabeça do fêmur",
          on: setS
        },
        update,
        labels: [
          { n: "Hemácia normal", d: "Disco biconcavo, flexível, cheio de hemoglobina A. Deforma-se para passar por capilares finos e circula sem obstruir.", p: () => Q(-1.35, HY + .05, .2) },
          { n: "Hemácia falciforme", d: "Com a HbS polimerizada, a hemácia fica alongada e curva, em foice. É rígida, frágil (sofre hemólise) e se prende nos vasos.", p: () => { const q = heroP(P(tipL.x * .8, tipL.y, tipL.z * .8)); return Q(q.x, q.y, q.z + .15); } },
          { n: "Hemoglobina S (HbS)", d: "Resulta de uma mutação missense pontual no gene da beta-globina (cromossomo 11): ácido glutâmico é trocado por valina na posição 6 da cadeia beta. Em baixa oxigenação a HbS polimeriza e distorce a hemácia.", p: () => Q(hero.position.x - .5, HY + .15, .3) },
          { n: "Vaso sanguíneo", d: "Capilar ou vênula por onde as hemácias circulam. O calibre é pequeno, por isso hemácias rígidas encontram dificuldade.", p: () => Q(-2.3, VR * .95, 0) },
          { n: "Hemácias normais em fluxo", d: "Enquanto há oxigênio e pouca HbS polimerizada, as hemácias passam livres e mantêm o tecido oxigenado.", p: () => { const c = cells[3]; return Q(c.m.position.x, c.m.position.y, c.m.position.z + .25); } },
          { n: "Obstrução (vaso-oclusão)", d: "Hemácias falciformes se acumulam e bloqueiam o vaso. O fluxo para, causando isquemia. É o mecanismo das crises vaso-oclusivas.", p: () => Q(PX, .05, .5) },
          { n: "Tecido a jusante (osso)", d: "Sem oxigênio, ocorre infarto da medula óssea, com dor óssea intensa em ossos longos, coluna e articulações. Infartos recorrentes levam à necrose avascular, sobretudo da cabeça do fêmur.", p: () => Q(2.75, 0, .5) }
        ]
      };
    }
  });
})();

<script>
window.MODELS = window.MODELS || {};
(function () {
  const T = THREE;
  const P = (x, y, z) => new T.Vector3(x, y, z);

  const clamp01 = x => Math.max(0, Math.min(1, x));
  const rng = seed => () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };

  /* =====================================================================
     1) CARIOTIPO
     ===================================================================== */
  function cariotipo() {
    const g = new T.Group();
    const cell = new T.Mesh(new T.SphereGeometry(1, 48, 32), M3(0x39d98a, .1, { depthWrite: false }));
    cell.scale.set(3.0, 2.6, 2.3); g.add(cell);
    

    function chrom(lp, lq, col, ghost) {
      lp *= 1.4; lq *= 1.4;
      const cg = new T.Group(), curves = [];
      const mat = ghost ? M3(0xeafff5, .2, { depthWrite: false }) : M3(col, 1, { emissive: col, emissiveIntensity: .14 });
      [-1, 1].forEach(sx => {
        const pts = [P(sx * (.1 + .16 * lp), lp, 0), P(sx * (.05 + .05 * lp), lp * .5, 0), P(sx * .02, 0, 0), P(sx * (.05 + .06 * lq), -lq * .5, 0), P(sx * (.1 + .17 * lq), -lq, 0)];
        const cv = new T.CatmullRomCurve3(pts); curves.push(cv);
        cg.add(new T.Mesh(new T.TubeGeometry(cv, 20, .1, 8, false), mat));
        [pts[0], pts[4]].forEach(p => { const s = new T.Mesh(new T.SphereGeometry(.1, 10, 8), mat); s.position.copy(p); cg.add(s); });
      });

      cg.add(cen);
      return { g: cg, curves };
    }
    const recs = [];
    function add(lp, lq, col, cx, cy, z, opts) {
      const c = chrom(lp, lq, col, opts && opts.ghost);
      c.g.position.set(cx, cy, z); g.add(c.g);
      const r = Object.assign(c, { x: cx, tx: cx, y: cy, z, pres: opts && opts.hidden ? 0 : 1, tpres: opts && opts.hidden ? 0 : 1, ghost: !!(opts && opts.ghost) });
      recs.push(r); return r;
    }
    const cxs = [-1.75, 0, 1.75], y1 = .95, y2 = -1.3;
    const p1 = [add(.5, .68, 0x5cb8ff, cxs[0] - .3, y1, .1), add(.5, .68, 0x5cb8ff, cxs[0] + .3, y1, -.1)];
    const p7 = [add(.36, .5, 0xc48bff, cxs[1] - .3, y1, .1), add(.36, .5, 0xc48bff, cxs[1] + .3, y1, -.1)];
    const p13 = [add(.1, .44, 0x39d98a, cxs[2] - .3, y1, .1), add(.1, .44, 0x39d98a, cxs[2] + .3, y1, -.1)];
    const p17 = [add(.2, .3, 0x4fd6c8, cxs[0] - .3, y2, .1), add(.2, .3, 0x4fd6c8, cxs[0] + .3, y2, -.1)];
    const p21 = [add(.1, .26, 0xf2c14e, cxs[1] - .3, y2, .1), add(.1, .26, 0xf2c14e, cxs[1] + .3, y2, -.1), add(.1, .26, 0xf2c14e, cxs[1], y2, 0, { hidden: true })];
    const sx = [add(.36, .48, 0xe8695b, cxs[2] - .3, y2, .1), add(.36, .48, 0xe8695b, cxs[2] + .3, y2, -.1)];
    const ghost = add(.36, .48, 0xe8695b, cxs[2] + .3, y2, -.1, { ghost: true, hidden: true });
    ghost.g.visible = false;

    let state = 0, last = null;
    function setState(s) {
      state = s;
      p21[0].tx = s === 1 ? cxs[1] - .66 : cxs[1] - .3;
      p21[1].tx = s === 1 ? cxs[1] + .66 : cxs[1] + .3;
      p21[2].tpres = s === 1 ? 1 : 0;
      sx[1].tpres = s === 2 ? 0 : 1;
      ghost.g.visible = s === 2;
    }
    function apply() {
      recs.forEach(r => {
        if (r.ghost) return;
        const k = Math.max(.001, r.pres);
        r.g.scale.setScalar(k); r.g.visible = r.pres > .01;
        r.g.position.set(r.x, r.y + (1 - r.pres) * (r === p21[2] ? 1.4 : 0), r.z);
      });
    }
    setState(0); recs.forEach(r => { r.pres = r.tpres; r.x = r.tx; }); apply();

    const at = (r, ci, t) => r.curves[ci].getPoint(t).add(r.g.position).add(P(0, 0, .12));
    return {
      group: g, dist: 8.5, rot: [.12, -.18],
      hint: "Esquema com 6 dos 23 pares (1, 7, 13, 17, 21 e o par sexual). Mova o controle para comparar os três cariótipos.",
      slider: {
        label: "Cariótipo", val: 0,
        fmt: v => v < 34 ? "Cariótipo normal: 46,XX ou 46,XY. Cada um dos 23 pares tem duas cópias, uma de origem materna e outra de origem paterna."
          : v < 67 ? "Trissomia do 21 (47,XX,+21 ou 47,XY,+21): síndrome de Down. Três cópias do 21 por não disjunção meiótica. Hipotonia, frouxidão ligamentar e risco de instabilidade atlantoaxial."
          : "Monossomia do X (45,X): síndrome de Turner. Falta um cromossomo sexual (o contorno mostra o X ausente). Baixa estatura e linfedema de mãos e pés ao nascimento.",
        on: v => setState(v < 34 ? 0 : v < 67 ? 1 : 2)
      },
      update(t) {
        const dt = last == null ? 0 : Math.min(.1, Math.max(0, t - last)); last = t;
        const k = 1 - Math.exp(-dt * 5);

      },
      labels: [
        { n: "Cromátide", d: "Cada cromossomo duplicado tem duas cromátides irmãs, cópias idênticas do DNA. Elas ficam unidas no centrômero e se separam na anáfase.", p: () => at(p1[0], 0, .8) },
        { n: "Centrômero", d: "Ponto de união das cromátides irmãs. Sua posição divide o cromossomo em braço curto (p) e braço longo (q) e é onde o fuso se prende.", p: () => at(p1[1], 1, .5) },
        { n: "Braço p", d: "Braço curto do cromossomo (do francês petit). Um exemplo é a deleção do braço curto do cromossomo 5 na síndrome do cri-du-chat.", p: () => at(p7[1], 1, .12) },
        { n: "Braço q", d: "Braço longo do cromossomo. A posição do centrômero e o tamanho dos braços, junto ao bandeamento G, ajudam a identificar cada par no cariótipo.", p: () => at(p7[0], 0, .88) },
        { n: "Par 21", d: "Menor autossomo. Na não disjunção meiótica, um gameta recebe as duas cópias do 21 e, após a fecundação, surge a trissomia (47,+21): síndrome de Down, com hipotonia, frouxidão ligamentar e risco de instabilidade atlantoaxial.", p: () => at(p21[0], 0, .35) },
        { n: "Par sexual", d: "XX na mulher e XY no homem. Na síndrome de Turner (45,X) falta um cromossomo sexual: baixa estatura e linfedema de mãos e pés ao nascimento. Na Klinefelter (47,XXY) há um X a mais.", p: () => at(sx[0], 1, .85) },
        { n: "Célula", d: "O cariótipo é feito com linfócitos cultivados e bloqueados em metáfase, quando os cromossomos estão mais condensados. Os cromossomos são fotografados, pareados e ordenados por tamanho e bandas (bandeamento G).", p: () => P(.8, 2.0, 1.2) }
      ]
    };
  }

  /* =====================================================================
     2) TERATOGENOS  (periodos criticos)
     ===================================================================== */
  const ORG = {
    snc:   { nome: "encéfalo e SNC", col: 0xc48bff, a: 3, hi: 8, lo: 38 },
    cor:   { nome: "coração", col: 0xff5c5c, a: 3, hi: 8, lo: 8 },
    olho:  { nome: "olhos", col: 0x5cb8ff, a: 4, hi: 8, lo: 16 },
    orel:  { nome: "orelhas", col: 0xf2c14e, a: 4, hi: 8, lo: 16 },
    msup:  { nome: "membros superiores", col: 0xe8695b, a: 4, hi: 8, lo: 8 },
    minf:  { nome: "membros inferiores", col: 0xff8a5c, a: 4, hi: 8, lo: 8 },

  };
  const levelOf = (o, w) => (w >= o.a && w <= o.hi) ? 1 : (w > o.hi && w <= o.lo) ? .4 : 0;
  const weekOf = v => 1 + Math.round(clamp01(v / 100) * 37);

  function teratogenos() {
    const g = new T.Group(), R = 1.75, OFF = .9, A = 1.75;
    const C = u => { const a = (u - .5) * 2 * A; return P(OFF - R * Math.cos(a), R * Math.sin(a), 0); };
    const N = u => { const a = (u - .5) * 2 * A; return P(Math.cos(a), -Math.sin(a), 0); };
    const rad = u => { let r = .04 + .6 * ss(0, .35, u) + .34 * ss(.7, .86, u); if (u > .88) r *= Math.sqrt(Math.max(0, 1 - Math.pow((u - .88) / .12, 2))); return r; };
    // corpo (tubo de raio variavel)
    const NS = 60, NM = 24, pos = new Float32Array((NS + 1) * (NM + 1) * 3), idx = [];
    for (let i = 0; i <= NS; i++) {
      const u = i / NS, c = C(u), n = N(u), r = rad(u);
      for (let j = 0; j <= NM; j++) {
        const ph = j / NM * Math.PI * 2, o = (i * (NM + 1) + j) * 3;
        pos[o] = c.x + r * Math.cos(ph) * n.x; pos[o + 1] = c.y + r * Math.cos(ph) * n.y; pos[o + 2] = r * Math.sin(ph);

    const heartC = at(.68, rad(.68) * .85, 0); ell(sph, "cor", heartC, [.38, .38, .38]);
    // olhos
    const eyeL = at(.88, rad(.88) * .5, .5), eyeR = at(.88, rad(.88) * .5, -.5);
    ell(sph, "olho", eyeL, [.17, .17, .17]); ell(sph, "olho", eyeR, [.17, .17, .17]);
    // orelhas

    ell(sph, "orel", earL, [.17, .21, .06]); ell(sph, "orel", earR, [.17, .21, .06]);
    // palato
    const palC = at(.8, rad(.8) * .72, 0); ell(sph, "pal", palC, [.2, .07, .26]);
    // botoes de membros

    [["msup", .6], ["minf", .22]].forEach(([k, u]) => [1, -1].forEach(s => {

    const budLen = w => w < 4 ? .12 : .35 + .55 * ss(4, 12, w) + .3 * ss(12, 38, w);

    function setWeek(w) {

  /* =====================================================================
     3) DISTROFINA (DMD)
     ===================================================================== */
  function distrofina() {
    const g = new T.Group(), LEN = 5, R = 1.25, RING = .62, RR = .24;
    // textura de sarcomeros
    const cv = document.createElement("canvas"); cv.width = 8; cv.height = 128; const cx = cv.getContext("2d");
    const band = (y0, y1, c) => { cx.fillStyle = c; cx.fillRect(0, y0, 8, y1 - y0); };

    const tex = new T.CanvasTexture(cv); tex.wrapS = tex.wrapT = T.RepeatWrapping; tex.repeat.set(1, 14);

    const memGeo = new T.CylinderGeometry(R, R, LEN, 48, 1, true).rotateZ(Math.PI / 2);

    const flatMat = M3(0xd97b6c, 1), stripMat = M3(0xffffff, 1, { map: tex });

    const myos = [];

      const ang = i < 0 ? 0 : i * Math.PI / 3, rr = i < 0 ? 0 : RING;

      const st = new T.Mesh(myoGeo, stripMat);

    }

    const zig = new T.CatmullRomCurve3([P(0, 0, 0), P(.07, .2, 0), P(-.07, .4, 0), P(.07, .6, 0), P(-.07, .8, 0), P(0, 1, 0)]);

    const rodMat = M3(0x39d98a, 1, { emissive: 0x39d98a, emissiveIntensity: .55 }), ancMat = M3(0xf2c14e, 1, { emissive: 0xf2c14e, emissiveIntensity: .35 });

      const m = new T.Mesh(rodGeo, rodMat), an = new T.Mesh(ancGeo, ancMat);
      g.add(m); g.add(an); rods.push({ m, an, x, th, a, k });
    }
    const rnd = rng(7);

    const order = rods.map((_, i) => i).filter(i => i !== first).map(i => [rnd(), i]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
    order.unshift(first); order.forEach((ri, rank) => { rods[ri].rank = rank; });
    // rupturas
    const spotGeo = new T.SphereGeometry(1, 14, 10), spotMat = M3(0xff3b3b, 1, { emissive: 0xff2a2a, emissiveIntensity: .9 });
    const spots = [];
    const spotPos = [[-.5, 105], [1.2, 30], [-1.6, 110], [0.5, 150], [1.9, 75], [-2.0, 40], [0.0, 95], [-0.9, 15], [1.6, 130], [-1.2, 165], [2.1, 105], [0.9, 55]];
    spotPos.forEach(([x, dg], i) => {
      const th = dg * Math.PI / 180, m = new T.Mesh(spotGeo, spotMat), dir = P(0, Math.cos(th), Math.sin(th));
      m.position.set(x, R * Math.cos(th), R * Math.sin(th)); m.quaternion.setFromUnitVectors(P(0, 1, 0), dir); g.add(m); spots.push({ m, i, x, th });
    });
    // tecido fibrogorduroso
    const fatMat = M3(0xf2c14e, .92, { emissive: 0x6a4a00, emissiveIntensity: .35 }), fatGeo = new T.SphereGeometry(1, 14, 10);

      const x = -2.2 + fr() * 4.4; m.position.set(x, r * Math.cos(th), r * Math.sin(th)); m.userData.s = s; g.add(m); fats.push({ m, s, x, th, r });
    }

    fats[0].th = 1.9; fats[0].r = .95; fats[0].x = 1.2; fats[0].s = .2; fats[0].m.position.set(1.2, .95 * Math.cos(1.9), .95 * Math.sin(1.9));
    const strands = [];
    for (let i = 0; i < 8; i++) {
      const th = fr() * Math.PI * 2, r = .85 + fr() * .2, len = 1.2 + fr() * 1.6, x = -2 + fr() * 3.4;
      const m = new T.Mesh(new T.CylinderGeometry(.035, .035, len, 6).rotateZ(Math.PI / 2), M3(0xe8d9a0, .95));

    }

    const nucGeo = new T.SphereGeometry(1, 16, 12), nucMat = M3(0x5cb8ff, 1, { emissive: 0x2a7ec0, emissiveIntensity: .45 });
    const nucs = [[-1.7, 70], [1.5, 40], [.2, 120], [-0.3, 20], [1.0, 155]].map(([x, dg]) => {
      const th = dg * Math.PI / 180, m = new T.Mesh(nucGeo, nucMat), dir = P(0, Math.cos(th), Math.sin(th));
      m.scale.set(.34, .085, .15); m.position.set(x, (R - .07) * Math.cos(th), (R - .07) * Math.sin(th));

      const s = ss(.05, .7, l);

      flatMat.color.setHex(0xd97b6c).lerp(new T.Color(0x9c7a5e), 1 - l);

      group: g, dist: 8.0, rot: [.32, -.55],
      hint: "Deslize para a esquerda para retirar a distrofina e ver o que acontece com a membrana e com as miofibrilas.",

/* ---------- cálculos ---------- */
function alunoLocal() { // resumo do aluno logado (dados locais + servidor)
  const fases = {}, sub = {}, un = {}; let ok = 0, tot = 0;
  FASES.forEach(f => {
    const t = myTent(f.id).filter(a => !a.inv), b = best(f.id);
    if (t.length || b >= 0) fases[f.id] = { best: Math.max(b, 0), tent: tentCount(f.id) };
    t.forEach(a => parseDet(a.det).forEach(([qi, o]) => { const q = f.q[qi]; if (!q) return; sub[q.t] = sub[q.t] || [0, 0]; sub[q.t][1]++; tot++; if (o) { sub[q.t][0]++; ok++; } }));
  });
  return { fases, sub, ok, tot };
}
function parseDet(s) { return String(s || "").split(",").filter(Boolean).map(x => { const [i, o] = x.split(":"); return [+i, o === "1"]; }); }
function notaDisc(fases, dk) { const fs = FASES.filter(f => f.dk === dk); return fs.reduce((s, f) => s + (fases[f.id] ? notaDe(fases[f.id].best) : 0), 0) / fs.length; }
function notaGeral(fases) { return FASES.reduce((s, f) => s + (fases[f.id] ? notaDe(fases[f.id].best) : 0), 0) / FASES.length; }
function nFeitas(fases, dk) { return FASES.filter(f => (!dk || f.dk === dk) && fases[f.id]).length; }

/* linhas -> alunos (mesmo código para dados reais e de demonstração) */
function agrega(rows) {
  const m = new Map();
  rows.forEach(r => {
    const k = norm(r.mat); if (!k || !FASE_BY[r.fase]) return;
    let a = m.get(k); if (!a) { a = { mat: r.mat, nome: r.nome, turma: r.turma, fases: {}, sub: {}, un: {}, ok: 0, tot: 0, uso: 0, seg: 0, tent: 0, ult: 0 }; m.set(k, a); }
    a.nome = r.nome || a.nome; a.turma = r.turma || a.turma; a.tent++;
    const nota = Number(r.ac) || 0, tt = Number(r.total) || NQ;
    const cur = a.fases[r.fase] || { best: -1, tent: 0, seg: 0 };
    cur.tent++; cur.best = Math.max(cur.best, tt === NQ ? nota : Math.round(nota / tt * NQ)); cur.seg += Number(r.seg) || 0; a.fases[r.fase] = cur;
    a.seg += Number(r.seg) || 0; a.uso = Math.max(a.uso, Number(r.uso) || 0); a.ult = Math.max(a.ult, new Date(r.ts).getTime() || 0);
    const f = FASE_BY[r.fase]; a.un[r.fase] = a.un[r.fase] || [0, 0];
    parseDet(r.det).forEach(([qi, o]) => { const q = f.q[qi]; if (!q) return; a.sub[q.t] = a.sub[q.t] || [0, 0]; a.sub[q.t][1]++; a.un[r.fase][1]++; a.tot++; if (o) { a.sub[q.t][0]++; a.un[r.fase][0]++; a.ok++; } });
  });
  return Array.from(m.values());
}

/* turma de demonstração: 26 alunos fictícios (semente fixa), no mesmo formato das linhas da planilha */
function demoRows() {
  let seed = 20260929;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const rows = []; const dif = { 1: 0.10, 2: 0, 3: -0.14 };
  const pdiff = FASES.map(() => (rnd() - .5) * .22);
  for (let i = 1; i <= 26; i++) {
    const ab = 0.5 + rnd() * 0.4, nome = "Aluno " + String(i).padStart(2, "0"), mt = String(2026000 + i);
    let uso = 600 + Math.round(rnd() * 3000);
    const alcance = Math.round(2 + rnd() * 10.5);
    FASES.forEach((f, k) => {
      if (k >= alcance) return;
      const nt = rnd() < .45 ? 2 : 1; const vistas = new Set();
      for (let t = 1; t <= nt; t++) {
        const pool = shuffle(f.q.map((_, x) => x)), ord = pool.filter(x => !vistas.has(x)).concat(pool.filter(x => vistas.has(x))).slice(0, NQ);
        let ac = 0; const det = ord.map(qi => { vistas.add(qi); const p = Math.max(.08, Math.min(.97, ab + pdiff[k] + dif[f.q[qi].d || 2] + (t > 1 ? .06 : 0))); const o = rnd() < p ? 1 : 0; ac += o; return qi + ":" + o; }).join(",");
        rows.push({ ts: new Date(2026, 8, 1 + Math.floor(rnd() * 27), 8 + Math.floor(rnd() * 12)).toISOString(), mat: mt, nome, turma: "Demonstração", fase: f.id, tent: t, ac, total: NQ, seg: 120 + Math.round(rnd() * 200), pts: ac * 120, det, uso });
      }
    });
  }
  return rows;
}

  v.innerHTML = `<div class="play" style="--c:${f.cor}"><div class="card res-big"><span class="eyebrow">${f.disc} · unidade ${esc(f.u)} concluída</span>
    <div class="nota">${f1(nota)}<small>/10</small></div>
    <p style="margin:2px 0 0;color:var(--ink2)">${rest ? "Você ainda tem " + rest + " tentativa nesta unidade. Vale a maior nota." : "Tentativas encerradas nesta unidade. Sua nota é " + f1(notaDe(Math.max(b, 0))) + "."}</p>
    <div class="kv"><div><small>Acertos</small><b>${G.ok}/${NQ}</b></div><div><small>Pontos</small><b>${G.pts}</b></div><div><small>Tempo</small><b>${Math.round(G.seg)} s</b></div><div><small>Maior nota</small><b>${f1(notaDe(Math.max(b, 0)))}</b></div></div>
    ${syncLine()}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px">${rest ? `<button class="btn" data-act="jogarfase" data-v="${f.id}">Segunda tentativa</button>` : ""}<button class="btn ghost" data-act="estudarfase" data-v="${f.id}">Estudar esta unidade</button><button class="btn ghost" data-act="sair">Voltar às unidades</button></div></div>
    ${errou.length ? `<div class="card" style="margin-top:14px"><span class="eyebrow">Revise o que errou</span><ul class="rev">${errou.map(r => { const q = G.q[r.i]; return `<li><b>${esc(q.q)}</b>Resposta certa: ${esc(q.o[q.c])}. ${esc(q.e)}</li>`; }).join("")}</ul><p class="note" style="margin:10px 0 0">Assuntos para rever: ${[...new Set(errou.map(r => r.t))].map(esc).join(", ")}.</p></div>` : '<div class="card" style="margin-top:14px">Sem erros nesta tentativa.</div>'}</div>`;
}

/* ---------- PAINEL DO PROFESSOR ---------- */
const ui = { sort: "geral", dir: -1 };
async function loadPainel(force) {
  if (!force && painel.rows && Date.now() - painel.at < 20000) return;
  painel.loading = true; painel.err = "";
  if (!REAL) { painel.rows = demoRows(); painel.demo = true; painel.at = Date.now(); painel.loading = false; return; }
  try {
    const r = await api({ acao: "painel", pin: PIN }, 20000);
    if (r && r.ok) { painel.rows = r.rows || []; painel.at = Date.now(); painel.demo = false; }
    else { painel.err = r && r.err === "pin" ? "PIN incorreto." : "O servidor não respondeu como esperado."; if (r && r.err === "pin") { PIN = ""; try { sessionStorage.removeItem("sj_ge_pin"); } catch (e) { } } }
  } catch (e) { painel.err = "Sem conexão com a planilha. Tente novamente."; }
  painel.loading = false;
}
function viewPainel(v) {
  if (REAL && !PIN) { role = "aluno"; return askPin(); }
  if (!painel.rows && !painel.loading) { v.innerHTML = '<section class="hero"><h1>Painel do professor</h1><p>Carregando os dados da turma…</p></section>'; loadPainel().then(() => { if (role === "prof" && S.tab === "painel") shell(); }); return; }
  if (painel.err) { v.innerHTML = `<section class="hero"><h1>Painel do professor</h1></section><div class="card"><p style="color:var(--red);margin:0 0 10px">${esc(painel.err)}</p><button class="btn" data-act="reload">Tentar de novo</button></div>`; return; }
  const all = agrega(painel.rows || []), turmas = [...new Set(all.map(a => a.turma).filter(Boolean))].sort();
  const list = painel.turma ? all.filter(a => a.turma === painel.turma) : all;
  const n = list.length;
  const rows = list.map(a => ({ a, nome: a.nome, emb: notaDisc(a.fases, "emb"), gen: notaDisc(a.fases, "gen"), geral: notaGeral(a.fases), nf: nFeitas(a.fases), acerto: a.tot ? a.ok / a.tot * 100 : 0, uso: Math.round(a.uso / 60) }))
    .sort((x, y) => { const k = ui.sort; const r = k === "nome" ? x.nome.localeCompare(y.nome) : x[k] - y[k]; return r * ui.dir; });
  const avg = (fn) => n ? list.reduce((s, a) => s + fn(a), 0) / n : 0;
  const tot = list.reduce((s, a) => s + a.tot, 0), ok = list.reduce((s, a) => s + a.ok, 0);
  const tentativas = list.reduce((s, a) => s + a.tent, 0);
  const sub = {}; list.forEach(a => Object.entries(a.sub).forEach(([t, [o, x]]) => { sub[t] = sub[t] || [0, 0]; sub[t][0] += o; sub[t][1] += x; }));
  const fracos = Object.entries(sub).filter(([, [, x]]) => x >= 8).map(([t, [o, x]]) => ({ t, p: o / x * 100, x })).sort((a, b) => a.p - b.p).slice(0, 8);
  const porFase = FASES.map(f => { const js = list.filter(a => a.fases[f.id]); const mb = js.length ? js.reduce((s, a) => s + notaDe(a.fases[f.id].best), 0) / js.length : null; const u = list.reduce((s, a) => { const z = a.un[f.id]; if (z) { s[0] += z[0]; s[1] += z[1]; } return s; }, [0, 0]); return { f, jog: js.length, media: mb, acerto: u[1] ? u[0] / u[1] * 100 : null }; });
  const bins = [0, 0, 0, 0, 0]; rows.forEach(r => bins[Math.min(4, Math.floor(r.geral / 2))]++); const maxBin = Math.max(1, ...bins);
  const th = (k, l) => `<th><button data-act="sort" data-v="${k}" ${ui.sort === k ? `aria-sort="${ui.dir < 0 ? "descending" : "ascending"}"` : ""}>${l}</button></th>`;
  const hora = painel.at ? new Date(painel.at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "";
  v.innerHTML = `
  <section class="hero"><div class="row2"><h1>Painel do professor</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" data-act="reload">Atualizar</button><button class="btn" data-act="csv">CSV de notas</button><button class="btn ghost sm" data-act="csvraw">CSV de tentativas</button></div></div>
  <p>Desempenho da turma ligado à nota. Atualizado às ${hora}.${turmas.length > 1 ? "" : ""}</p></section>
  ${painel.demo ? '<div class="banner" style="margin-block:10px 14px"><b>Dados de demonstração.</b> São 26 alunos fictícios gerados no aparelho. No link oficial da turma este painel lê a planilha real.</div>' : ""}
  ${turmas.length > 1 ? `<div class="tabs" role="group" aria-label="Turma"><button class="chip" data-act="turma" data-v="" aria-pressed="${!painel.turma}">Todas as turmas</button>${turmas.map(t => `<button class="chip" data-act="turma" data-v="${esc(t)}" aria-pressed="${painel.turma === t}">${esc(t)}</button>`).join("")}</div>` : ""}
  ${!n ? '<div class="card"><p style="margin:0">Ainda não há tentativas registradas. Assim que um aluno terminar uma unidade, ela aparece aqui.</p></div>' : `
  <div class="stack">
  <div class="kpis"><div class="kpi"><small>Alunos que jogaram</small><b>${n}</b><span>${tentativas} tentativas no total</span></div><div class="kpi"><small>Nota média Embriologia</small><b>${f1(avg(a => notaDisc(a.fases, "emb")))}</b><span>média das 6 unidades</span></div><div class="kpi"><small>Nota média Genética</small><b>${f1(avg(a => notaDisc(a.fases, "gen")))}</b><span>média das 6 unidades</span></div><div class="kpi"><small>Acerto geral</small><b>${tot ? f0(ok / tot * 100) : 0}%</b><span>todas as tentativas</span></div><div class="kpi"><small>Tempo médio de uso</small><b>${f0(avg(a => a.uso) / 60)} min</b><span>por aluno</span></div></div>
  <div class="grid2">
    <div class="card"><h2 style="font-size:1.05rem">Assuntos em que a turma mais erra</h2><p class="note" style="margin:2px 0 0">Taxa de acerto por assunto (mínimo de 8 respostas). A linha branca marca 60%.</p>
      <div class="bars">${fracos.length ? fracos.map(r => barRow(r.t, r.p)).join("") : '<p class="note">Ainda há poucas respostas por assunto.</p>'}</div></div>
    <div class="card"><h2 style="font-size:1.05rem">Distribuição da nota geral</h2><p class="note" style="margin:2px 0 0">Média das 12 unidades (unidade não feita conta zero). Alunos por faixa.</p>
      <div class="hist">${bins.map((c, i) => `<div><b>${c}</b><i style="height:${c / maxBin * 88}%"></i><span>${i * 2}–${i * 2 + 2}</span></div>`).join("")}</div></div>
  </div>
  <div class="card"><h2 style="font-size:1.05rem">Por unidade</h2><p class="note" style="margin:2px 0 0">Quantos alunos jogaram, nota média (maior tentativa) e acerto geral de cada unidade.</p>
    <div class="tw"><table><thead><tr><th>Unidade</th><th>Jogaram</th><th>Nota média</th><th>Acerto</th></tr></thead><tbody>${porFase.map(p => `<tr><td class="wrap">${p.f.dk === "emb" ? "Emb." : "Gen."} ${esc(p.f.u)} · ${esc(p.f.titulo)}</td><td>${p.jog}/${n}</td><td>${p.media == null ? "–" : "<b>" + f1(p.media) + "</b>"}</td><td>${p.acerto == null ? "–" : f0(p.acerto) + "%"}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="card"><h2 style="font-size:1.05rem">Alunos</h2><p class="note" style="margin:2px 0 0">Toque em uma linha para ver o detalhe. Toque no título de uma coluna para ordenar.</p>
    <div class="tw"><table><thead><tr>${th("nome", "Aluno")}${th("nf", "Unid.")}${th("emb", "Embr.")}${th("gen", "Gen.")}${th("geral", "Geral")}${th("acerto", "Acerto")}${th("uso", "Min")}</tr></thead>
    <tbody>${rows.map(r => `<tr data-act="aluno" data-v="${esc(norm(r.a.mat))}"><td>${esc(r.nome)}<br><small class="mut">${esc(r.a.mat)}</small></td><td>${r.nf}/12</td><td>${f1(r.emb)}</td><td>${f1(r.gen)}</td><td><b>${f1(r.geral)}</b></td><td>${r.a.tot ? f0(r.acerto) + "%" : "–"}</td><td>${r.uso}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="card"><span class="eyebrow">Como ler</span><p class="note" style="margin:6px 0 0">Nota da unidade = acertos ÷ ${NQ} × 10, pela maior das ${CFG.MAXT} tentativas. Nota da disciplina = média das 6 unidades, com unidade não feita valendo zero. O CSV de notas serve para lançar no sistema da faculdade; o CSV de tentativas traz cada tentativa com data e hora. A identificação do aluno é pelo nome e matrícula digitados por ele.</p></div>
  </div>`}`;
}
function askPin() {
  const m = document.createElement("div"); m.className = "modal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-label", "PIN do professor");
  m.innerHTML = `<form class="box" id="pf"><h2 style="font-size:1.1rem">Acesso do professor</h2><p class="note">Digite o PIN do painel.</p><label class="fld"><span>PIN</span><input id="pin" type="password" inputmode="numeric" autocomplete="off" required></label><p class="note" id="perr" role="alert" style="color:var(--red);min-height:1.2em"></p><div class="row2"><button class="btn" type="submit">Entrar</button><button class="btn ghost" type="button" data-act="fechar">Cancelar</button></div></form>`;
  document.body.appendChild(m); $("#pin").focus();
  $("#pf").addEventListener("submit", async e => {
    e.preventDefault(); PIN = $("#pin").value.trim(); painel.rows = null; painel.err = ""; $("#perr").textContent = "Verificando…";
    await loadPainel(true);
    if (painel.err) { $("#perr").textContent = painel.err; return; }
    try { sessionStorage.setItem("sj_ge_pin", PIN); } catch (er) { }
    m.remove(); role = "prof"; S.tab = "painel"; shell();
  });
}
function detalheAluno(k) {
  const a = agrega(painel.rows || []).find(x => norm(x.mat) === k); if (!a) return;
  const fracos = Object.entries(a.sub).filter(([, [, x]]) => x >= 2).map(([t, [o, x]]) => ({ t, p: o / x * 100 })).sort((x, y) => x.p - y.p).slice(0, 6);
  const m = document.createElement("div"); m.className = "modal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-label", "Detalhe do aluno");
  m.innerHTML = `<div class="box"><div class="row2"><h2 style="font-size:1.1rem">${esc(a.nome)}</h2><button class="btn ghost sm" data-act="fechar">Fechar</button></div><p class="note" style="margin:0">Matrícula ${esc(a.mat)} · ${esc(a.turma || "")}</p>
  <div class="kv"><div><small>Embriologia</small><b>${f1(notaDisc(a.fases, "emb"))}</b></div><div><small>Genética</small><b>${f1(notaDisc(a.fases, "gen"))}</b></div><div><small>Acerto</small><b>${a.tot ? f0(a.ok / a.tot * 100) + "%" : "–"}</b></div><div><small>Uso</small><b>${Math.round(a.uso / 60)} min</b></div></div>
  ${DISCS.map(([dk, dn]) => `<span class="eyebrow">${dn}: nota por unidade</span><div class="kv">${FASES.filter(f => f.dk === dk).map(f => `<div><small>Unid. ${esc(f.u)}</small><b>${a.fases[f.id] ? f1(notaDe(a.fases[f.id].best)) : "–"}</b></div>`).join("")}</div>`).join("")}
  <span class="eyebrow">Assuntos com menor acerto</span>${fracos.length ? `<div class="bars">${fracos.map(r => barRow(r.t, r.p)).join("")}</div>` : '<p class="note">Sem dados suficientes.</p>'}</div>`;
  document.body.appendChild(m);
}
const cn = n => String(n).replace(".", ",");
function csvNotas() {
  const list = agrega(painel.rows || []).filter(a => !painel.turma || a.turma === painel.turma);
  const head = ["matricula", "aluno", "turma", "unidades_embriologia", "unidades_genetica", "nota_embriologia", "nota_genetica", "nota_geral_12", "acerto_pct", "uso_min"].concat(FASES.map(f => "nota_" + f.id)).concat(FASES.map(f => "tent_" + f.id));
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const lines = [head.join(";")].concat(list.sort((a, b) => a.nome.localeCompare(b.nome)).map(a => [q(a.mat), q(a.nome), q(a.turma || ""), nFeitas(a.fases, "emb"), nFeitas(a.fases, "gen"), cn(notaDisc(a.fases, "emb").toFixed(1)), cn(notaDisc(a.fases, "gen").toFixed(1)), cn(notaGeral(a.fases).toFixed(1)), a.tot ? cn((a.ok / a.tot * 100).toFixed(0)) : "0", Math.round(a.uso / 60)].concat(FASES.map(f => a.fases[f.id] ? cn(notaDe(a.fases[f.id].best).toFixed(1)) : "0,0"), FASES.map(f => a.fases[f.id] ? a.fases[f.id].tent : 0)).join(";")));
  return "﻿" + lines.join("\r\n");
}
function csvBruto() {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = (painel.rows || []).filter(r => !painel.turma || r.turma === painel.turma).slice().sort((a, b) => String(a.ts).localeCompare(String(b.ts)));
  return "﻿" + ["data_hora;matricula;aluno;turma;unidade;tentativa;acertos;total;nota;segundos;pontos;detalhe"].concat(rows.map(r => [q(r.ts), q(r.mat), q(r.nome), q(r.turma || ""), r.fase, r.tent, r.ac, r.total, cn((r.ac / (r.total || NQ) * 10).toFixed(1)), r.seg, r.pts, q(r.det || "")].join(";"))).join("\r\n");
}
async function exportCsv(csv, name) {
  try { const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; if (dl) { await dl.save({ filename: name, data: csv }); return; } } catch (e) { if (e && e.code === "declined") return; }
  try {
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 500);
    if (REAL) return;
  } catch (e) { }
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box"><h2 style="font-size:1.1rem">CSV</h2><p class="note">Se o download não iniciou, copie o texto abaixo e cole em um arquivo .csv ou no Excel.</p><textarea id="csvta" readonly></textarea><div class="row2" style="margin-top:10px"><button class="btn" data-act="copiar">Copiar</button><button class="btn ghost" data-act="fechar">Fechar</button></div><p class="note" id="csvmsg" role="status"></p></div>`;
  document.body.appendChild(m); $("#csvta").value = csv;
}
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 4200); }

/* ---------- eventos ---------- */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return; const a = b.dataset.act, v = b.dataset.v;
  if (a === "perfil") {
    G = null; clearInterval(timerId);
    if (v === "prof") { if (REAL && !PIN) { askPin(); return; } role = "prof"; S.tab = "painel"; } else { role = "aluno"; S.tab = "estudar"; }
    shell();
  }
  else if (a === "tab") { if (v !== "jogar" || (G && G.done)) { G = null; clearInterval(timerId); } S.tab = v; save(); shell(); if (v === "jogar" && !G) syncStatus().then(ok => { if (ok && !G && S.tab === "jogar" && role === "aluno") shell(); }); }
  else if (a === "fase") { S.fase = v; save(); shell(); }
  else if (a === "model") { S.model[S.fase] = v; save(); shell(); }
  else if (a === "lab") act3d(+v);
  else if (a === "jogarfase") startGame(v);
  else if (a === "estudarfase") { G = null; S.fase = v; S.tab = "estudar"; save(); shell(); window.scrollTo(0, 0); }
  else if (a === "resp") answer(+v);
  else if (a === "prox") proximo();
  else if (a === "sair") { G = null; clearInterval(timerId); S.tab = "jogar"; shell(); window.scrollTo(0, 0); }
  else if (a === "sair-conta") { if (S.pend.length && !confirm("Há notas ainda não enviadas neste aparelho. Trocar de aluno agora não as apaga, mas elas só serão enviadas com internet. Continuar?")) return; S.aluno = null; S.tab = "estudar"; save(); shell(); }
  else if (a === "sort") { if (ui.sort === v) ui.dir *= -1; else { ui.sort = v; ui.dir = v === "nome" ? 1 : -1; } shell(); }
  else if (a === "turma") { painel.turma = v; shell(); }
  else if (a === "reload") { painel.rows = null; painel.loading = false; await loadPainel(true); shell(); }
  else if (a === "aluno") detalheAluno(v);
  else if (a === "fechar") { const m = b.closest(".modal"); if (m) m.remove(); }
  else if (a === "csv") exportCsv(csvNotas(), "notas_turma" + (painel.demo ? "_demo" : "") + ".csv");
  else if (a === "csvraw") exportCsv(csvBruto(), "tentativas_turma" + (painel.demo ? "_demo" : "") + ".csv");
  else if (a === "copiar") { const ta = $("#csvta"); ta.select(); let ok = false; try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (er) { try { ok = document.execCommand("copy"); } catch (e2) { } } $("#csvmsg").textContent = ok ? "Copiado." : "Não foi possível copiar. Selecione o texto e copie manualmente."; }
});
document.addEventListener("click", e => { if (e.target.classList && e.target.classList.contains("modal")) e.target.remove(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(); });
window.__GE = { get G() { return G; }, S: () => S, FASES, agrega, demoRows, get role() { return role; }, set role(x) { role = x; } };
shell();
if (S.aluno) { syncStatus().then(() => { if (!G && role === "aluno" && S.tab === "jogar") shell(); }); flush(); }
})();
</script>
