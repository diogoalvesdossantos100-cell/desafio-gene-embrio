cleossomos); na divisão celular ela se condensa em cromossomos, visíveis em metáfase.","d":2},{"t":"Processamento do mRNA","q":"Qual conjunto descreve o processamento do pré-mRNA em eucariotos?","o":["Inclusão de íntrons e remoção da cauda poli-A","Remoção de íntrons, quepe 5’ e cauda poli-A","Síntese de fragmentos de Okazaki e ação da ligase","Remoção de éxons e adição de quepe 3’"],"c":1,"e":"Na transcrição eucariótica, o pré-mRNA perde os íntrons e recebe o quepe 5’ e a cauda poli-A.","d":2},{"t":"Replicação do DNA","q":"Qual é a função da DNA ligase na replicação?","o":["Abrir a dupla-hélice do DNA","Sintetizar a nova fita no sentido 5’→3’","Unir os fragmentos de Okazaki","Remover os íntrons do transcrito"],"c":2,"e":"A DNA ligase fecha (une) os fragmentos de Okazaki; a abertura é da helicase e a síntese é da DNA polimerase.","d":2},{"t":"Teste do pezinho","q":"Qual a relação entre o rastreio neonatal (teste do pezinho) e a Fisioterapia?","o":["Dispensa o acompanhamento motor, pois a dieta corrige o defeito enzimático desde o nascimento","Só detecta a doença depois que surgem sintomas motores, momento em que a fisioterapia é indicada","Identifica adultos que necessitam de reabilitação respiratória e articular","Permite diagnóstico precoce e intervenção multiprofissional desde os primeiros meses"],"c":3,"e":"O diagnóstico precoce viabiliza a intervenção multiprofissional, incluindo a Fisioterapia, desde os primeiros meses de vida, quando indicada.","d":2},{"t":"Fenilcetonúria","q":"Menina de 4 anos com fenilcetonúria mantém dieta restrita adequada, mas é encaminhada à Fisioterapia para avaliar o desenvolvimento neuropsicomotor. Qual a justificativa?","o":["Exposição prévia à fenilalanina elevada (diagnóstico tardio, má adesão) pode deixar alterações de tônus e motoras","A dieta não corrige o defeito enzimático, portanto a fisioterapia serve apenas para monitorar a fenilalanina no sangue","A fenilcetonúria é doença de depósito lisossômico e causa contraturas articulares progressivas desde o nascimento","A dieta adequada elimina qualquer risco neurológico, e o encaminhamento é apenas burocrático"],"c":0,"e":"Conforme o gabarito, mesmo com controle dietético, exposições à fenilalanina elevada em algum momento podem causar alterações residuais de tônus e do desenvolvimento motor, justificando o acompanhamento preventivo e de estimulação.","d":3},{"t":"Depósito lisossômico","q":"Menino de 8 anos com mucopolissacaridose apresenta rigidez articular, contraturas e dificuldade respiratória. Qual a atuação fisioterapêutica esperada?","o":["Fisioterapia intensiva que elimina o acúmulo de substrato dos tecidos e reverte as deformidades","Fisioterapia apenas respiratória, pois a rigidez articular é passageira e regride sozinha com o tempo","Fisioterapia motora (amplitude e função) e respiratória (comprometimento pulmonar)","Apenas orientação familiar, já que o pulmão e as articulações não são afetados nessas doenças"],"c":2,"e":"A fisioterapia motora mantém a amplitude articular e a função; a respiratória maneja o comprometimento pulmonar frequentemente associado. O acúmulo de substrato não é removido pela fisioterapia.","d":3},{"t":"Do gene ao fenótipo","q":"Na discussão dirigida da Unidade I, pergunta-se como uma alteração genética chega a um problema motor. Qual sequência é coerente com um EIM?","o":["Excesso de enzima, falta de substrato na via metabólica e consequente hipertonia por sobrecarga","Alteração no DNA, enzima deficiente, via bloqueada, acúmulo de substrato e alteração motora","Alteração da cromatina, cromossomos extras em metáfase e distrofia da fibra muscular","Proteína normal, RNA alterado após a tradução e contratura por acúmulo de glicosaminoglicanos"],"c":1,"e":"No EIM, a alteração gênica resulta em enzima deficiente, o que bloqueia a via metabólica e acumula substrato, com repercussão neuromuscular ou osteoarticular.","d":3},{"t":"EIM neonatal","q":"Lactente de 2 meses apresenta hipotonia e letargia, e a equipe suspeita de galactosemia ou doença do xarope de bordo. Qual afirmação é adequada?","o":["O quadro afasta EIM, pois estes só causam deformidades articulares","Hipotonia e letargia são achados exclusivos de doenças de depósito lisossômico","O quadro é benigno, e o dano neurológico só ocorre em adultos","O quadro é compatível com EIM e, sem tratamento, há risco de dano neurológico"],"c":3,"e":"Galactosemia e doença do xarope de bordo podem cursar com hipotonia, letargia e, se não tratadas, dano neurológico; por isso o diagnóstico precoce importa.","d":3},{"t":"Herança dos EIM","q":"Um casal sem manifestações tem um filho com fenilcetonúria. Qual padrão de herança é o mais provável?","o":["Autossômica recessiva, com pais provavelmente portadores de uma cópia alterada do gene","Ligada ao X dominante, com a mãe necessariamente afetada e os filhos homens sempre afetados","Autossômica dominante, com pelo menos um dos pais afetado e transmissão vertical a todos os filhos","Ligada ao Y, transmitida do pai a todos os filhos homens em todas as gerações"],"c":0,"e":"Os EIM são geralmente autossômicos recessivos; pais sem sintomas podem carregar uma cópia alterada do gene.","d":3},{"t":"Fenilcetonúria","q":"Os pais de uma criança com fenilcetonúria não tratada perguntam por que ela apresenta tremores e hipertonia. Qual explicação bioquímica a apostila sustenta?","o":["Deficiência de distrofina, proteína estrutural do sarcolema","Excesso de fenilalanina hidroxilase, que esgota a fenilalanina","Deficiência de fenilalanina hidroxilase, com acúmulo de fenilalanina","Falha da DNA ligase, que impede o fechamento dos fragmentos de Okazaki"],"c":2,"e":"Na PKU há deficiência da fenilalanina hidroxilase; o acúmulo de fenilalanina causa deficiência intelectual e, frequentemente, hipertonia, tremores e alterações do tônus.","d":3}],"models":[["dna","DNA e replicação"]]},{"id":"gen2","disc":"Genética","dk":"gen","n":8,"u":"II","titulo":"Tradução, Herança Autossômica e Ligada ao Sexo","cor":"#f5a45d","resumo":[["Tradução de proteínas","Ocorre nos ribossomos, seguindo o código genético (64 códons, 20 aminoácidos). Etapas: iniciação (AUG), elongação (pareamento códon-anticódon e ligações peptídicas) e terminação (UAA, UAG, UGA). O código é degenerado e universal."],["Genótipo, fenótipo e AD","Genótipo é a constituição genética (Aa); fenótipo é a manifestação observável. Na herança autossômica dominante, um alelo mutante basta, com padrão vertical e 50% de risco aos filhos. Exemplos: neurofibromatose tipo 1 e distrofia miotônica tipo 1."],["Herança autossômica recessiva","O fenótipo só aparece em homozigose (aa); heterozigotos são portadores assintomáticos. Pode pular gerações e é mais recorrente em uniões consanguíneas. Exemplo: AME, por deficiência do gene SMN1."],["Herança ligada ao X","O homem é hemizigoto: um alelo recessivo no X já se manifesta, então as condições são mais comuns em homens. Pai afetado não transmite aos filhos homens, mas todas as filhas são portadoras obrigatórias; padrão em zigue-zague."],["Distrofia de Duchenne","Mutação no gene da distrofina (X), proteína do sarcolema, leva à degeneração muscular com substituição fibroadiposa. Cursa com fraqueza proximal, sinal de Gowers, pseudo-hipertrofia de panturrilhas, perda da marcha (7 a 13 anos) e comprometimento respiratório e cardíaco."]],"q":[{"t":"Gene da DMD","q":"A distrofia muscular de Duchenne é causada por mutação no gene que codifica:","o":["Beta-globina, componente da hemoglobina","Distrofina, proteína do sarcolema","Fenilalanina hidroxilase, enzima metabólica","Fator VIII, proteína da coagulação"],"c":1,"e":"A DMD decorre de mutações no gene da distrofina, proteína estrutural essencial à integridade da membrana da fibra muscular (sarcolema).","d":1},{"t":"Herança da AME","q":"A atrofia muscular espinhal (AME), causada por deficiência do gene SMN1, é uma doença de herança:","o":["Autossômica dominante","Ligada ao X recessiva","Autossômica recessiva","Multifatorial"],"c":2,"e":"Segundo o gabarito, a AME é autossômica recessiva, causada por deficiência do gene SMN1.","d":1},{"t":"Terminação da tradução","q":"O ribossomo interrompe a tradução ao encontrar:","o":["O códon AUG, que marca o início da tradução e codifica metionina","Um íntron ainda presente no mRNA, sem processamento prévio","A cauda poli-A na extremidade 3' do mRNA processado","Um códon de parada no mRNA (UAA, UAG ou UGA)"],"c":3,"e":"A tradução termina quando o ribossomo encontra um códon de parada: UAA, UAG ou UGA.","d":1},{"t":"Iniciação da tradução","q":"Qual é o códon de início da tradução, que codifica metionina?","o":["AUG","UAA","UGA","UAG"],"c":0,"e":"A iniciação ocorre no códon AUG, que codifica metionina; UAA, UGA e UAG são códons de parada.","d":1},{"t":"Sinal de Gowers","q":"O sinal de Gowers, característico da DMD, consiste em:","o":["Aumento aparente das panturrilhas por tecido fibroadiposo","Apoiar as mãos nos joelhos e coxas para se erguer do chão","Perda da marcha entre 7 e 13 anos","Fraqueza que começa pelos músculos distais"],"c":1,"e":"O sinal de Gowers é a manobra de \"escalar\" o próprio corpo para levantar do chão. O aumento das panturrilhas é a pseudo-hipertrofia, sinal distinto.","d":1},{"t":"Genótipo e fenótipo","q":"O termo \"Aa\" representa um exemplo de:","o":["Genótipo heterozigoto","Fenótipo dominante, observável no indivíduo","Alelo recessivo, expresso apenas em dupla dose","Genótipo homozigoto dominante"],"c":0,"e":"Genótipo é a constituição genética (ex.: Aa); com dois alelos diferentes, o indivíduo é heterozigoto. Fenótipo é a manifestação observável.","d":1},{"t":"DMD e cromossomo X","q":"Por que a DMD acomete quase exclusivamente meninos?","o":["O gene está no cromossomo Y, exclusivo dos homens, e passa de pai para filho","É autossômica dominante, com penetrância bem menor nas mulheres por inativação do X","O gene está no X e o homem, hemizigoto, manifesta com um só alelo mutado","As mulheres não possuem o gene da distrofina, que existe apenas no genoma masculino"],"c":2,"e":"O gene da distrofina está no X; o homem tem um único X, então um alelo mutado basta. Mulheres, com dois X, precisariam ser homozigotas (raro) e costumam ser portadoras assintomáticas ou com manifestações leves.","d":2},{"t":"Base do Gowers","q":"Qual é a base fisiopatológica do sinal de Gowers?","o":["Fraqueza distal dos pés, compensada pelo recrutamento da musculatura do tronco","Espasticidade dos flexores do joelho, compensada pela inclinação do tronco e apoio das mãos","Perda de neurônios motores com hipotonia sem fraqueza, compensada por reflexos aumentados","Fraqueza proximal de MMII e tronco, compensada com apoio das mãos"],"c":3,"e":"A fraqueza da musculatura proximal de membros inferiores e do tronco impede levantar-se diretamente; o paciente usa braços e musculatura distal para \"escalar\" o próprio corpo.","d":2},{"t":"Heredograma AD","q":"Qual achado em heredograma sugere herança autossômica dominante?","o":["Afetados em gerações sucessivas, com pais afetados (padrão vertical)","Pais sem a doença com filhos afetados, pulando gerações e com recorrência em famílias","Predomínio de homens afetados, com transmissão em zigue-zague por mulheres portadoras","Maior recorrência em uniões consanguíneas e filhos afetados de pais normais"],"c":0,"e":"Na herança AD, um único alelo mutante (Aa) manifesta o fenótipo, gerando padrão vertical. Pular gerações e consanguinidade sugerem herança recessiva; zigue-zague sugere ligação ao X.","d":2},{"t":"Herança ligada ao X","q":"Um homem com condição recessiva ligada ao X tem filhos com uma mulher sem o alelo mutado. Na prole:","o":["Todos os filhos homens são afetados e todas as filhas são normais, sem portadoras","Filhas portadoras obrigatórias e filhos homens não afetados","Metade dos filhos é afetada, independentemente do sexo, e a outra metade é normal","Todas as filhas são afetadas e todos os filhos homens são portadores do alelo"],"c":1,"e":"O pai afetado transmite o Y aos filhos homens (não afetados) e o X mutado a todas as filhas, que são portadoras obrigatórias.","d":2},{"t":"Código degenerado","q":"O código genético ser \"degenerado\" significa que:","o":["Cada códon codifica mais de um aminoácido, gerando ambiguidade na síntese","O código muda de uma espécie para outra, sendo específico de cada organismo","Mais de um códon pode codificar o mesmo aminoácido","Cada aminoácido é codificado por um único códon, sem redundância"],"c":2,"e":"São 64 códons para 20 aminoácidos; portanto, vários códons codificam o mesmo aminoácido. O código também é universal.","d":2},{"t":"Etapas da tradução","q":"Na etapa de elongação da tradução ocorre:","o":["Reconhecimento do AUG pelo ribossomo","Liberação da proteína ao encontrar UAA, UAG ou UGA","Síntese do mRNA a partir do DNA","Pareamento códon-anticódon e ligações peptídicas"],"c":3,"e":"A elongação envolve o pareamento códon-anticódon e a formação das ligações peptídicas; a iniciação ocorre no AUG e a terminação no códon de parada.","d":2},{"t":"Caso: diagnóstico DMD","q":"Menino de 5 anos com dificuldade progressiva para subir escadas, quedas frequentes e que \"escala\" as próprias pernas para se levantar do chão. O diagnóstico e o padrão de herança mais prováveis são:","o":["AME, autossômica recessiva por deficiência de SMN1, com hipotonia progressiva desde o lactente","Distrofia miotônica tipo 1, autossômica dominante, com miotonia e fraqueza","DMD, recessiva ligada ao X, por ausência de distrofina","Neurofibromatose tipo 1, autossômica dominante, com escoliose e tumores nervosos"],"c":2,"e":"Sinal de Gowers e fraqueza proximal em menino apontam para DMD, causada por mutação no gene da distrofina no cromossomo X (recessiva ligada ao X).","d":3},{"t":"Caso: risco AR","q":"Um casal saudável tem um filho com AME e hipotonia progressiva. Sabendo que a AME é autossômica recessiva, qual a probabilidade teórica de uma próxima criança do casal ser afetada?","o":["25%","50%","75%","0%"],"c":0,"e":"Ambos os pais são portadores heterozigotos (Aa x Aa): 1/4 AA, 2/4 Aa, 1/4 aa. Apenas aa (25%) manifesta a AME.","d":3},{"t":"Caso: distrofia miotônica","q":"Paciente de 30 anos com distrofia miotônica tipo 1 (heterozigoto), em reabilitação motora e respiratória, pergunta sobre o risco para seus filhos com uma parceira sem a mutação. O risco teórico é:","o":["25%, pois os pais seriam portadores assintomáticos","50%, apenas para filhos do sexo masculino","100%, pois o alelo é dominante","50% para cada filho, independentemente do sexo"],"c":3,"e":"Na herança autossômica dominante, o heterozigoto afetado tem 50% de risco de transmitir o alelo a cada filho (Aa x aa: 1/2 Aa), sem relação com o sexo.","d":3},{"t":"Caso: irmã portadora","q":"A mãe de um menino com DMD pergunta ao fisioterapeuta se a irmã de 10 anos, sem sintomas, pode ter relação com a doença. A orientação mais adequada é:","o":["Não, pois as mulheres não herdam o cromossomo X materno, apenas o paterno","Sim, ela pode ser portadora, em geral assintomática ou com manifestações leves","Sim, ela terá necessariamente DMD grave, com perda da marcha na mesma idade do irmão","Não, pois a DMD é autossômica recessiva e exige dois pais afetados"],"c":1,"e":"A DMD é recessiva ligada ao X: as mulheres, com dois X, costumam ser portadoras assintomáticas ou com manifestações leves. O aconselhamento formal cabe ao geneticista clínico.","d":3},{"t":"Caso: risco ligado ao X","q":"Gestante portadora de mutação no gene da distrofina, com parceiro sem a mutação, espera um menino. Qual a probabilidade teórica de ele ter DMD?","o":["50%","100%","25%","0%"],"c":0,"e":"Mãe XdX x pai XY: o filho homem recebe o Y do pai e, com chance de 1/2, o X mutado da mãe (XdY); logo, 50%.","d":3},{"t":"Caso: evolução da DMD","q":"Menino de 12 anos com DMD ainda deambula com dificuldade. Qual a evolução esperada que orienta o plano fisioterapêutico?","o":["Manutenção da marcha até a idade adulta, sem repercussão respiratória ou cardíaca","Recuperação da força proximal pela reposição espontânea de distrofina na puberdade","Perda progressiva da marcha, com comprometimento respiratório e cardíaco depois","Regressão da pseudo-hipertrofia de panturrilhas com ganho progressivo de força"],"c":2,"e":"Na DMD há degeneração muscular progressiva, perda da marcha geralmente entre 7 e 13 anos e, na evolução, comprometimento respiratório e cardíaco, exigindo acompanhamento contínuo.","d":3}],"models":[["traducao","Tradução da proteína"]]},{"id":"gen3","disc":"Genética","dk":"gen","n":9,"u":"III","titulo":"Grupos Sanguíneos e Mutações Gênicas","cor":"#f0846b","resumo":[["Sistema ABO","Três alelos determinam o grupo: IA e IB são codominantes e i é recessivo. Os genes codificam enzimas que adicionam açúcares A ou B à membrana das hemácias. IAIB dá fenótipo AB e apenas ii dá fenótipo O."],["Sistema Rh e perinatal","O alelo D (Rh positivo) é dominante sobre d (Rh negativo). A incompatibilidade materno-fetal pode causar doença hemolítica perinatal, prevenida com imunoglobulina anti-D. Casos graves não tratados podem cursar com kernicterus, com sequelas motoras semelhantes à paralisia cerebral atetoide."],["Tipos de mutação","Mutação gênica é uma alteração permanente na sequência de nucleotídeos. Silenciosa não muda o aminoácido, missense o altera, nonsense cria códon de parada prematuro e frameshift (inserção ou deleção não múltipla de 3) desloca o quadro de leitura. Os agentes podem ser físicos, químicos ou biológicos."],["Anemia falciforme","Mutação missense no gene da beta-globina troca ácido glutâmico por valina na posição 6, gerando HbS. Em baixa oxigenação a HbS polimeriza e deforma a hemácia em foice, causando hemólise e crises vaso-oclusivas. É autossômica recessiva e o traço AS é geralmente assintomático."],["Foco fisioterapêutico","Manifestações osteoarticulares: crise óssea com dor por infarto da medula, necrose avascular da cabeça do fêmur, síndrome mão-pé em lactentes e osteomielite. Na crise aguda, prioriza-se dor e posicionamento sem mobilização agressiva; depois, recuperação gradual de amplitude e função."]],"q":[{"t":"Tipos de mutação","q":"A mutação responsável pela anemia falciforme é classificada como:","o":["Nonsense","Silenciosa","Missense","Frameshift"],"c":2,"e":"A anemia falciforme decorre de mutação missense, que substitui ácido glutâmico por valina na cadeia beta da hemoglobina (posição 6).","d":1},{"t":"Alelos ABO","q":"Quais são os alelos do sistema ABO e a relação entre eles?","o":["IA e IB são recessivos e i é dominante","IA e IB são codominantes e i é recessivo","IA é dominante, IB é recessivo e i é codominante","IA, IB e i são codominantes entre si"],"c":1,"e":"O sistema ABO tem três alelos: IA e IB são codominantes entre si e i é recessivo. Por isso IAIB expressa A e B ao mesmo tempo e apenas ii dá o fenótipo O.","d":1},{"t":"Necrose avascular","q":"A necrose avascular da cabeça do fêmur em pacientes com anemia falciforme decorre de:","o":["Infecção bacteriana primária da cabeça do fêmur, sem relação com a obstrução vascular","Deficiência de vitamina D, com desmineralização progressiva do osso","Mutação no gene da distrofina, com degeneração da fibra muscular","Infartos ósseos recorrentes causados por obstrução vascular"],"c":3,"e":"Segundo o gabarito, a necrose avascular resulta de infartos ósseos recorrentes causados pela obstrução vascular pelas hemácias falcizadas.","d":1},{"t":"Sistema Rh","q":"Uma pessoa Rh negativo apresenta qual genótipo para o gene Rh?","o":["dd","DD","Dd","D e d em codominância"],"c":0,"e":"O alelo D (Rh positivo) é dominante sobre d. Só o homozigoto recessivo dd é Rh negativo; DD e Dd são Rh positivos.","d":1},{"t":"Tipos de mutação","q":"Qual tipo de mutação cria um códon de parada prematuro e gera uma proteína truncada?","o":["Silenciosa","Missense","Frameshift","Nonsense"],"c":3,"e":"A mutação nonsense cria um códon de parada prematuro. A silenciosa não altera o aminoácido e a missense troca um aminoácido por outro.","d":1},{"t":"Agentes mutagênicos","q":"Qual dos agentes abaixo é classificado como mutagênico físico?","o":["Radiação ultravioleta","Agentes alquilantes","Componentes do tabaco","Certos vírus"],"c":0,"e":"Agentes físicos incluem radiação UV e ionizante. Alquilantes e componentes do tabaco são químicos e certos vírus são biológicos.","d":1},{"t":"Frameshift","q":"Uma deleção de um único nucleotídeo em região codificante causa mutação frameshift porque:","o":["troca um aminoácido por outro sem alterar os demais códons da sequência","substitui o códon afetado por um de parada, gerando proteína truncada e mais curta","desloca o quadro de leitura de todos os códons seguintes à mutação","mantém o mesmo aminoácido, pois o código é degenerado e tolera a perda de uma base"],"c":2,"e":"Inserções ou deleções que não são múltiplas de 3 deslocam todo o quadro de leitura a partir da mutação. As demais alternativas descrevem mutações missense, nonsense e silenciosa.","d":2},{"t":"Mecanismo da falcização","q":"Como a mutação na beta-globina leva à obstrução vascular nas crises da anemia falciforme?","o":["A HbS se degrada em baixa oxigenação e o sangue perde volume, causando hipóxia difusa","Em baixa oxigenação a HbS polimeriza, a hemácia vira foice e obstrui vasos","A hemácia perde os açúcares de membrana, adere à parede do vaso e forma trombos","A HbS retém oxigênio em excesso e forma coágulos nos capilares da medula óssea"],"c":1,"e":"Em baixa oxigenação a hemoglobina S polimeriza e distorce a hemácia em foice. Essas células rígidas obstruem pequenos vasos, incluindo os da medula óssea, causando infarto local e dor intensa.","d":2},{"t":"Herança falciforme","q":"Sobre a herança da anemia falciforme, é correto afirmar que:","o":["é autossômica dominante e todo portador do alelo S tem crises graves e frequentes","é recessiva ligada ao X e afeta quase exclusivamente o sexo masculino","é mitocondrial, com transmissão exclusivamente materna a todos os filhos","é autossômica recessiva; heterozigotos (AS) são geralmente assintomáticos"],"c":3,"e":"A anemia falciforme é autossômica recessiva. Os heterozigotos (traço falciforme, AS) são geralmente assintomáticos.","d":2},{"t":"Cruzamento ABO","q":"Um casal com tipos sanguíneos A (heterozigoto IAi) e B (heterozigoto IBi) pode ter filhos com fenótipo:","o":["A, B, AB ou O","Apenas A ou B","Apenas AB","Apenas O"],"c":0,"e":"Os gametas IA ou i do pai se combinam com IB ou i da mãe, gerando IAIB (AB), IAi (A), IBi (B) ou ii (O), cada um com 1/4 de chance.","d":2},{"t":"Osteomielite","q":"O risco aumentado de osteomielite na anemia falciforme está relacionado a:","o":["disfunção esplênica, que favorece infecção óssea secundária","deficiência de cálcio na dieta, que fragiliza o osso e favorece fraturas infectadas","hemólise, que libera bactérias contidas nas hemácias para o tecido ósseo","trombose periférica, que impede a cicatrização de fraturas e favorece infecções"],"c":0,"e":"A apostila associa o risco aumentado de infecção óssea (osteomielite) à disfunção esplênica presente na anemia falciforme.","d":2},{"t":"Imunoglobulina anti-D","q":"Qual é o objetivo da imunoglobulina anti-D administrada à mãe Rh negativo?","o":["Corrigir a mutação no gene Rh do feto durante a gestação","Aumentar a produção de hemoglobina fetal para compensar a hemólise","Impedir a sensibilização materna ao Rh, prevenindo a doença hemolítica","Converter o sangue materno de Rh negativo para Rh positivo de forma definitiva"],"c":2,"e":"A imunoglobulina anti-D previne a sensibilização materna ao Rh, evitando a doença hemolítica perinatal. Não é hormônio nem altera o genótipo.","d":2},{"t":"Cruzamento ABO","q":"Na anamnese de uma criança atendida na fisioterapia, a mãe é do grupo O e o pai do grupo AB. Quais fenótipos ABO são possíveis para a criança?","o":["Apenas AB ou O","A, B, AB ou O","Apenas A ou B","Apenas O"],"c":2,"e":"Mãe ii produz apenas gametas i e pai IAIB produz IA ou IB. Os filhos são IAi (A) ou IBi (B), ou seja, 1/2 A e 1/2 B, sem chance de AB ou O.","d":3},{"t":"Rh e kernicterus","q":"Criança de 4 anos com movimentos involuntários atetoides é encaminhada à fisioterapia neurofuncional. A mãe é Rh negativo, o pai é Rh positivo e houve icterícia neonatal grave sem tratamento. Qual a origem mais coerente das sequelas?","o":["Crise vaso-oclusiva óssea por hemoglobina S, com infarto da medula óssea","Kernicterus por doença hemolítica perinatal (incompatibilidade Rh)","Deficiência de vitamina D com desmineralização óssea e fraqueza muscular proximal","Mutação silenciosa no gene da beta-globina, sem alteração da hemoglobina"],"c":1,"e":"A incompatibilidade Rh materno-fetal não prevenida pode causar doença hemolítica perinatal e kernicterus. Esse quadro deixa sequelas motoras semelhantes à paralisia cerebral atetoide, acompanhadas pela fisioterapia neurofuncional.","d":3},{"t":"Crise vaso-oclusiva","q":"Criança de 8 anos com anemia falciforme chega em crise vaso-oclusiva óssea, com dor intensa no fêmur. Qual a conduta fisioterapêutica na fase aguda?","o":["Posicionamento confortável e controle da dor, sem mobilização agressiva","Mobilização vigorosa da articulação para ganhar amplitude e prevenir contraturas","Exercício resistido progressivo para manter a força durante a crise","Repouso absoluto prolongado, sem qualquer intervenção da fisioterapia"],"c":0,"e":"Na crise aguda o foco é o manejo da dor e o posicionamento confortável, evitando mobilizações agressivas no osso ou articulação afetados.","d":3},{"t":"Probabilidade AS x AS","q":"Um casal, ambos com traço falciforme (AS) e assintomáticos, busca orientação. Qual a probabilidade de terem um filho com anemia falciforme (SS)?","o":["1/2 (50%)","1/4 (25%)","3/4 (75%)","Nula, pois o traço não é transmitido"],"c":1,"e":"AS x AS gera AA, AS, AS e SS, portanto 1/4 (25%) de chance de SS. Como a doença é autossômica recessiva, os pais heterozigotos são assintomáticos e transmitem o alelo S.","d":3},{"t":"Reabilitação pós-crise","q":"Adolescente com anemia falciforme ficou vários dias em repouso após crise óssea no joelho e evolui com queda de força e restrição de amplitude. Superada a fase aguda, qual o foco da fisioterapia?","o":["Manter repouso até a dor desaparecer por completo, para evitar nova crise","Imobilizar a articulação por semanas para evitar novas crises vaso-oclusivas","Iniciar fortalecimento com cargas altas de imediato para recuperar a força perdida","Recuperar gradualmente amplitude e função, prevenindo perda de força"],"c":3,"e":"Após a fase aguda, o fisioterapeuta atua na recuperação gradual da amplitude de movimento e da funcionalidade, prevenindo perda de força e contraturas decorrentes do repouso prolongado.","d":3},{"t":"Síndrome mão-pé","q":"Lactente de 10 meses com anemia falciforme apresenta edema doloroso em mãos e pés. Qual a manifestação e o mecanismo mais prováveis?","o":["Osteomielite, por infecção óssea secundária à disfunção esplênica","Necrose avascular da cabeça do fêmur por infartos crônicos","Síndrome mão-pé (dactilite), por infarto dos pequenos ossos","Doença hemolítica por incompatibilidade Rh materno-fetal"],"c":2,"e":"A síndrome mão-pé (dactilite) ocorre em lactentes e crianças pequenas por infarto ósseo dos pequenos ossos das mãos e pés, com edema doloroso.","d":3}],"models":[["falciforme","Hemácia falciforme"]]},{"id":"gen4","disc":"Genética","dk":"gen","n":10,"u":"IV","titulo":"Mutações Cromossômicas e Cariótipo","cor":"#ff7a7a","resumo":[["O que é mutação cromossômica","Alteração no número ou na estrutura de cromossomos inteiros ou de grandes segmentos, visível ao cariótipo. Difere da mutação gênica, que altera a sequência de nucleotídeos."],["Aneuploidias e o quadro motor","Down (47,XX/XY,+21): hipotonia generalizada, frouxidão ligamentar, risco de instabilidade atlantoaxial e atraso motor. Turner (45,X): baixa estatura e linfedema de mãos e pés. Klinefelter (47,XXY): hipotonia leve e frouxidão ligamentar. Edwards e Patau (trissomias 18 e 13): malformações múltiplas e prognóstico grave."],["Mutações estruturais","Deleção, duplicação, inversão e translocação (recíproca ou robertsoniana). Exemplo: cri-du-chat, por deleção no braço curto do cromossomo 5, com hipotonia e atraso do desenvolvimento."],["Cariótipo e nomenclatura","Linfócitos cultivados, bloqueados em metáfase, com bandeamento G. Notações: 46,XY e 46,XX (normais), 47,XY,+21 (Down), 45,X (Turner), 47,XXY (Klinefelter)."],["Pré-natal e fisioterapia","Rastreio (NIPT, USG morfológica), confirmação (amniocentese ou vilo corial, este aos 10-13 semanas), cariótipo e intervenção. Saber do diagnóstico antes permite iniciar a estimulação motora precoce desde o nascimento, aproveitando a plasticidade neural."]],"q":[{"t":"Down: tônus","q":"A hipotonia generalizada ao nascimento é uma manifestação clássica de:","o":["Síndrome de Turner, com linfedema de mãos e pés e baixa estatura","Síndrome de Down (trissomia do 21), com hipotonia generalizada e frouxidão ligamentar","Anemia falciforme, por crises vaso-oclusivas desde o período neonatal","Distrofia muscular de Duchenne, com fraqueza proximal desde os primeiros dias"],"c":1,"e":"Segundo o gabarito, a hipotonia generalizada ao nascimento é característica e praticamente universal da síndrome de Down.","d":1},{"t":"Nomenclatura cariótipo","q":"A notação de cariótipo 47,XX,+21 corresponde a:","o":["Síndrome de Turner, monossomia do X em indivíduo do sexo feminino","Síndrome de Klinefelter, trissomia sexual em indivíduo do sexo masculino","Síndrome de Down (trissomia do 21) em indivíduo do sexo feminino","Síndrome de Edwards, trissomia do cromossomo 18 em indivíduo do sexo feminino"],"c":2,"e":"47,XX,+21 indica trissomia do cromossomo 21 (Down) em indivíduo do sexo feminino (XX).","d":1},{"t":"Diagnóstico pré-natal","q":"O exame que permite coleta de material fetal mais precocemente (10-13 semanas) para cariótipo é:","o":["Biópsia de vilo corial, realizada entre 10 e 13 semanas de gestação","Amniocentese, realizada em geral a partir da 15ª semana de gestação","NIPT, rastreio em sangue materno, sem coleta de material fetal para cariótipo","Ultrassonografia morfológica, que avalia a anatomia fetal sem gerar cariótipo"],"c":0,"e":"A biópsia de vilo corial é realizada mais precocemente (10-13 semanas) que a amniocentese; NIPT e USG são rastreios, não coletam material fetal para cariótipo.","d":1},{"t":"Cariótipo normal","q":"Um cariótipo humano normal é composto por quantos cromossomos?","o":["23, sendo 22 autossomos e 1 sexual, como ocorre nos gametas humanos","44, sendo 22 pares de autossomos, sem cromossomos sexuais na contagem","48, sendo 24 pares de autossomos e 2 pares de cromossomos sexuais","46, sendo 22 pares de autossomos e 1 par de cromossomos sexuais (XX ou XY)"],"c":3,"e":"A célula humana normal tem 46 cromossomos (23 pares): 22 pares de autossomos e 1 par sexual (46,XX ou 46,XY).","d":1},{"t":"Conceito mutação","q":"Uma mutação cromossômica é definida como:","o":["Alteração do número ou da estrutura de cromossomos, visível ao cariótipo","Troca de um único nucleotídeo na sequência do gene, detectável apenas por sequenciamento","Alteração exclusiva do DNA mitocondrial, transmitida somente pela linhagem materna","Erro de tradução do RNA mensageiro, sem qualquer alteração do DNA original"],"c":0,"e":"A apostila define mutação cromossômica como alteração numérica ou estrutural de cromossomos inteiros ou grandes segmentos, visível ao cariótipo.","d":1},{"t":"Trissomias graves","q":"As trissomias dos cromossomos 18 e 13 correspondem, respectivamente, às síndromes de:","o":["Turner e Klinefelter, ambas aneuploidias dos cromossomos sexuais","Down e Turner, trissomia do 21 e monossomia do X, respectivamente","Edwards (trissomia 18) e Patau (trissomia 13), nessa ordem","Patau e Edwards, nessa ordem, as duas trissomias autossômicas"],"c":2,"e":"Edwards é a trissomia do 18 e Patau a do 13; ambas cursam com malformações múltiplas e prognóstico grave.","d":1},{"t":"Instabilidade atlantoaxial","q":"A instabilidade atlantoaxial na síndrome de Down está relacionada principalmente a:","o":["Fraqueza distal por perda de distrofina no sarcolema dos músculos cervicais","Frouxidão ligamentar, que pode atingir os ligamentos de C1-C2","Rigidez capsular cervical por retração dos músculos flexores do pescoço","Malformação óssea vertebral com fusão congênita de C1 e C2"],"c":1,"e":"A frouxidão ligamentar generalizada pode acometer os ligamentos que estabilizam C1-C2, aumentando o risco de subluxação.","d":2},{"t":"Classificação","q":"A trissomia do 21 e a monossomia do X (45,X) são classificadas como:","o":["Mutações estruturais por translocação robertsoniana entre cromossomos acrocêntricos","Mutações gênicas do tipo missense, com troca de aminoácido na proteína","Mutações estruturais por inversão de segmento dentro do mesmo cromossomo","Mutações numéricas do tipo aneuploidia (ganho ou perda de cromossomos)"],"c":3,"e":"Ganho ou perda de um cromossomo isolado caracteriza aneuploidia, mutação cromossômica numérica; nas estruturais há alteração de segmentos.","d":2},{"t":"Técnica do cariótipo","q":"Na técnica de cariótipo descrita na apostila, o material é obtido e analisado da seguinte forma:","o":["Células da mucosa oral coradas em interfase e analisadas sem cultivo celular","Hemácias maduras analisadas por eletroforese de proteínas em gel","Linfócitos cultivados, bloqueados em metáfase, com bandeamento G","Fibras musculares em corte histológico com coloração HE e bloqueio em prófase"],"c":2,"e":"O cariótipo usa linfócitos cultivados e bloqueados em metáfase, quando os cromossomos estão condensados, com bandeamento G.","d":2},{"t":"Gênica x cromossômica","q":"Qual das alterações abaixo é exemplo de mutação cromossômica, e não de mutação gênica?","o":["Deleção do braço curto do cromossomo 5, que causa a síndrome cri-du-chat","Mutação missense na beta-globina, que gera a hemoglobina S (HbS)","Mutação frameshift por perda de um único nucleotídeo em um gene","Mutação silenciosa que preserva o aminoácido codificado na proteína"],"c":0,"e":"Missense, frameshift e silenciosa são mutações gênicas; a deleção no braço curto do cromossomo 5 é estrutural e afeta grande segmento cromossômico.","d":2},{"t":"Mutações estruturais","q":"Qual par associa corretamente o tipo de mutação estrutural ao seu conceito?","o":["Deleção: segmento repetido em duplicata no mesmo cromossomo","Duplicação: perda de um segmento do cromossomo, com redução de material","Inversão: troca recíproca de segmentos entre cromossomos distintos","Translocação: segmento cromossômico transferido para outro cromossomo"],"c":3,"e":"Translocação é a transferência de segmento a outro cromossomo; deleção é perda, duplicação é repetição e inversão é segmento em sentido invertido.","d":2},{"t":"Não disjunção","q":"O mecanismo da não disjunção meiótica, que origina a maioria das trissomias, consiste em:","o":["Quebra de um cromossomo com perda do fragmento e formação de gameta com deleção","Falha na separação dos cromossomos, gerando gametas com um a mais ou a menos","Substituição de uma base por outra no DNA do gameta, sem alterar o número de cromossomos","Duplicação de um gene sem alteração do número de cromossomos, durante a replicação"],"c":1,"e":"Na não disjunção os cromossomos (ou cromátides) não se separam na meiose; após a fecundação resulta em aneuploidia como a trissomia do 21.","d":2},{"t":"Estimulação precoce","q":"Uma gestante recebe diagnóstico pré-natal de síndrome de Down. Do ponto de vista do desenvolvimento neuropsicomotor, o principal ganho para a fisioterapia é:","o":["Evitar o nascimento por meio de conduta terapêutica intrauterina realizada pelo fisioterapeuta","Substituir a avaliação motora após o nascimento pelo laudo do cariótipo fetal","Iniciar a estimulação motora precoce, aproveitando a plasticidade neural","Adiar a intervenção até que os marcos motores apareçam claramente atrasados"],"c":2,"e":"Sabendo antecipadamente da hipotonia e do provável atraso motor, a equipe inicia a estimulação precoce nas primeiras semanas, período de maior plasticidade neural.","d":3},{"t":"Segurança cervical","q":"Uma criança de 6 anos com síndrome de Down vai iniciar circuito de exercícios com rolamentos e flexão cervical forçada. A conduta mais adequada do fisioterapeuta é:","o":["Avaliar com cautela pelo risco de instabilidade C1-C2, com possível radiografia prévia","Liberar o circuito completo, pois a hipotonia da síndrome protege a coluna cervical","Manter o circuito e apenas reduzir a carga dos exercícios de membros, sem mudar a flexão cervical","Trocar o circuito por alongamento cervical passivo intenso ao final de cada sessão"],"c":0,"e":"A frouxidão ligamentar aumenta o risco de subluxação atlantoaxial; exercícios com flexão cervical forçada ou impacto exigem avaliação cautelosa, às vezes com radiografia prévia.","d":3},{"t":"Turner: quadro neonatal","q":"Recém-nascida com linfedema de mãos e pés é encaminhada à fisioterapia; na evolução apresentará baixa estatura. Qual cariótipo é esperado na hipótese principal?","o":["47,XXY, cariótipo típico de sexo masculino com hipotonia leve","47,XX,+21, com hipotonia generalizada e frouxidão ligamentar","46,XX, cariótipo feminino sem alteração numérica","45,X (síndrome de Turner, monossomia do X)"],"c":3,"e":"Linfedema de mãos e pés ao nascimento e baixa estatura sugerem síndrome de Turner, cujo cariótipo é 45,X (monossomia do X).","d":3},{"t":"Klinefelter: quadro","q":"Adolescente com histórico de hipotonia leve na infância, frouxidão ligamentar e sem atraso motor global recebe laudo de cariótipo com 47 cromossomos. Qual laudo é compatível com esse quadro?","o":["47,XY,+21 (síndrome de Down)","47,XXY (síndrome de Klinefelter, com cromossomo X extra)","45,X (síndrome de Turner, com um único cromossomo X)","47,XX,+18 (síndrome de Edwards)"],"c":1,"e":"Hipotonia leve na infância e frouxidão ligamentar são descritas na síndrome de Klinefelter, de cariótipo 47,XXY.","d":3},{"t":"Confirmação pré-natal","q":"Gestante de 11 semanas com rastreio não invasivo (NIPT) alterado para trissomia do 21 precisa de confirmação diagnóstica por cariótipo fetal. Qual exame é possível nessa idade gestacional?","o":["Biópsia de vilo corial, realizada entre 10 e 13 semanas de gestação","Amniocentese, que é a única coleta possível antes de 13 semanas de gestação","Nova ultrassonografia morfológica, que fornece o cariótipo fetal completo","Repetição do NIPT, que substitui o cariótipo confirmatório na conduta"],"c":0,"e":"NIPT é rastreio; a confirmação exige cariótipo fetal por amniocentese ou vilo corial, sendo o vilo corial o realizável aos 10-13 semanas.","d":3},{"t":"Avaliação do lactente","q":"Bebê de 2 meses com síndrome de Down é encaminhado à fisioterapia. Quais eixos gerais devem compor a avaliação inicial segundo a apostila?","o":["Força máxima, resistência aeróbia e flexibilidade com testes isocinéticos","Tônus, reflexos primitivos e marcos motores esperados para a idade do bebê","Marcha, equilíbrio unipodal e coordenação fina em tarefas manuais","Amplitude cervical, cariótipo e dosagem de distrofina sérica"],"c":1,"e":"O caso da atividade prática prevê avaliação inicial de tônus, reflexos primitivos e marcos motores esperados, base do plano de estimulação precoce.","d":3}],"models":[["cariotipo","Cariótipo"]]},{"id":"gen5","disc":"Genética","dk":"gen","n":11,"u":"V","titulo":"Teratologia e Agentes Teratogênicos","cor":"#e58ad0","resumo":[["Teratógeno e genótipo","O efeito teratogênico depende da interação entre o agente externo e o genótipo do concepto. Polimorfismos em genes de metabolização de xenobióticos fazem indivíduos diferentes responderem de forma distinta à mesma exposição."],["Agentes com repercussão neuromotora","Talidomida causa focomelia; álcool, síndrome alcoólica fetal com hipotonia e atraso motor; ácido valproico e outros anticonvulsivantes, defeitos do tubo neural; isotretinoína, malformações do SNC."],["Radiação e grupo TORCH","A radiação ionizante em altas doses quebra diretamente o DNA, sobretudo em células de rápida divisão, e compromete a neurogênese. O grupo TORCH é o exemplo biológico, com destaque para o Zika."],["Farmacogenética","Estuda como variações genéticas individuais (polimorfismos) influenciam eficácia, dose necessária e risco de efeitos adversos. Ajuda o fisioterapeuta a interpretar respostas variáveis a analgésicos e relaxantes musculares."],["Do teratógeno ao paciente e o COL5A1","Um agente atua sobre um genótipo específico em um período crítico, gerando a malformação que chega ao consultório. O COL5A1, ligado ao colágeno, é estudado na predisposição a lesões tendíneas e ligamentares."]],"q":[{"t":"Radiação ionizante","q":"O mecanismo pelo qual a radiação ionizante em altas doses pode ser teratogênica é:","o":["Inibição da angiogênese placentária, com isquemia dos tecidos embrionários","Quebra direta da fita de DNA em células de rápida divisão","Bloqueio da síntese de folato, com defeito de fechamento do tubo neural","Vasoconstrição placentária, com redução do fluxo sanguíneo ao embrião"],"c":1,"e":"Segundo o gabarito, a radiação ionizante em altas doses causa quebras diretas na fita de DNA, especialmente lesivas em células de rápida divisão.","d":1},{"t":"Farmacogenética","q":"A farmacogenética estuda principalmente:","o":["A estrutura tridimensional da dupla-hélice e o empacotamento do DNA na cromatina","A herança dos grupos sanguíneos ABO e Rh entre pais e filhos","A formação dos anexos embrionários e da placenta durante a gestação","Como variações genéticas individuais alteram a resposta aos fármacos, incluindo dose e efeitos adversos"],"c":3,"e":"A farmacogenética estuda como variações genéticas individuais (polimorfismos) influenciam eficácia, dose necessária e risco de efeitos adversos dos fármacos.","d":1},{"t":"Gene COL5A1","q":"O gene COL5A1, citado na unidade em relação à predisposição a lesões teciduais, está relacionado à estrutura de qual componente?","o":["Colágeno, componente estrutural de tendões e ligamentos","Hemoglobina dos eritrócitos e transporte de oxigênio","Mineralização do tecido ósseo e metabolismo do cálcio","Mielina do sistema nervoso periférico e condução nervosa"],"c":0,"e":"O gabarito indica que o COL5A1 está relacionado ao colágeno, componente estrutural de tendões e ligamentos.","d":1},{"t":"Talidomida","q":"Qual malformação é o exemplo clássico associado à exposição gestacional à talidomida?","o":["Defeitos do tubo neural, por bloqueio da síntese de folato","Síndrome alcoólica fetal, com hipotonia e atraso motor","Focomelia, malformação com encurtamento severo dos membros","Malformações do sistema nervoso central, com dismorfismo craniofacial"],"c":2,"e":"A apostila cita a talidomida como teratógeno clássico causador de focomelia (flashcard 16).","d":1},{"t":"Anticonvulsivantes","q":"Qual agente teratogênico é associado, segundo a apostila, a defeitos do tubo neural?","o":["Talidomida, usada como sedativo e antiemético no início da gestação","Ácido valproico, anticonvulsivante usado na epilepsia","Álcool etílico, consumido de forma crônica ao longo da gestação","Radiação ionizante em altas doses sobre células em divisão"],"c":1,"e":"A apostila associa o ácido valproico e outros anticonvulsivantes aos defeitos do tubo neural.","d":1},{"t":"Isotretinoína","q":"A isotretinoína, mencionada no estudo de caso da unidade, é associada a qual efeito teratogênico?","o":["Malformações do sistema nervoso central (SNC), como as do encéfalo","Focomelia por encurtamento dos membros superiores e inferiores","Síndrome alcoólica fetal, com hipotonia e atraso motor","Alterações do colágeno tendíneo e da resistência ligamentar"],"c":0,"e":"A apostila associa a isotretinoína a malformações do sistema nervoso central.","d":1},{"t":"Genótipo e teratógeno","q":"Dois embriões expostos ao mesmo agente e à mesma dose podem ter desfechos diferentes principalmente porque:","o":["O agente altera o número de cromossomos de cada concepto de modo distinto","Apenas a estação do ano em que ocorreu a exposição define a suscetibilidade","Polimorfismos em genes de metabolização de xenobióticos do concepto","Somente o peso corporal da gestante determina a intensidade do efeito do agente"],"c":2,"e":"O efeito teratogênico depende da interação agente-genótipo: polimorfismos em genes de metabolização de xenobióticos tornam o indivíduo mais ou menos suscetível.","d":2},{"t":"Álcool e motricidade","q":"Qual par de manifestações neuromotoras a apostila associa à síndrome alcoólica fetal?","o":["Focomelia e ausência de tendões, com paralisia flácida","Defeitos do tubo neural e paralisia dos membros inferiores","Perda de neurogênese e focomelia dos membros","Hipotonia e atraso motor do desenvolvimento"],"c":3,"e":"A apostila descreve a síndrome alcoólica fetal com hipotonia e atraso motor.","d":2},{"t":"Radiação e SNC","q":"Em altas doses, a radiação ionizante compromete o desenvolvimento do sistema nervoso principalmente por:","o":["Aumento compensatório da neurogênese, com hipertrofia do tecido neural","Comprometimento da neurogênese, por lesão de células em divisão","Bloqueio da angiogênese, causando focomelia e encurtamento ósseo","Hipertrofia do tubo neural, com fechamento excessivo do tecido"],"c":1,"e":"A apostila cita a radiação ionizante em altas doses como causa de comprometimento da neurogênese, coerente com as quebras de DNA em células de rápida divisão.","d":2},{"t":"Síntese teratológica","q":"Segundo a síntese da unidade, a malformação resulta da atuação conjunta de:","o":["Agente teratogênico, genótipo específico e período crítico","Somente a natureza química do agente e a sua dose de exposição","Apenas o genótipo materno e o número de gestações anteriores","Exclusivamente o período gestacional em que ocorre a exposição"],"c":0,"e":"A Figura 12 e a síntese integram agente, genótipo e período crítico, gerando a malformação que chega ao consultório de fisioterapia.","d":2},{"t":"Genética do esporte","q":"Na genética do esporte, polimorfismos como os do COL5A1 vêm sendo investigados por sua associação com:","o":["Maior capacidade de contração muscular e ganho de força explosiva","Menor risco de doenças cardiovasculares em atletas de endurance","Maior ou menor predisposição a lesões tendíneas e ligamentares","Velocidade de mielinização dos nervos periféricos e condução nervosa"],"c":2,"e":"A apostila cita pesquisas que associam polimorfismos, como o do COL5A1, à predisposição a lesões tendíneas e ligamentares.","d":2},{"t":"Classificação de agentes","q":"Qual associação entre agente e categoria está correta?","o":["Talidomida: agente físico, por ação de radiação sobre o embrião","Radiação ionizante: agente biológico, por infecção do concepto","Isotretinoína: agente biológico, por transmissão vertical do vírus","Zika (grupo TORCH): agente biológico, um vírus que infecta o concepto"],"c":3,"e":"Talidomida e isotretinoína são químicos, a radiação ionizante é física e o Zika, do grupo TORCH, é biológico.","d":2},{"t":"Papel do fisioterapeuta","q":"Uma atleta de 24 anos, em idade fértil, está em uso de isotretinoína prescrita por outro profissional e procura a fisioterapia. Qual a atitude mais adequada do fisioterapeuta?","o":["Ignorar o assunto, pois a prescrição não é de competência do fisioterapeuta","Reconhecer o risco teratogênico e comunicar a equipe multiprofissional","Orientar a paciente a suspender o fármaco por conta própria, sem contato com o prescritor","Prescrever método contraceptivo à paciente para evitar a exposição fetal"],"c":1,"e":"O estudo de caso da unidade discute o papel do fisioterapeuta na equipe multiprofissional diante de fármaco com potencial teratogênico em mulher em idade fértil.","d":3},{"t":"Predisposição a lesões","q":"Dois atletas com cargas de treino semelhantes têm riscos muito distintos de lesão tendínea. A interpretação coerente com a unidade é:","o":["Variantes de genes do colágeno, como o COL5A1, podem modular a resistência tendínea de cada atleta","Cargas de treino iguais garantem, por si só, risco de lesão igual entre os atletas","A predisposição genética não influencia lesões musculoesqueléticas em atletas","O calçado esportivo é o único fator que explica a diferença entre os atletas"],"c":0,"e":"Conforme o gabarito, polimorfismos modulam a estrutura e a resistência do tecido conjuntivo, gerando maior ou menor predisposição mesmo sob cargas semelhantes.","d":3},{"t":"Resposta a fármacos","q":"Dois pacientes com dor lombar recebem o mesmo relaxante muscular na mesma dose e um deles responde mal, com efeitos adversos. Qual área da genética ajuda a interpretar essa variação?","o":["Genética de populações e frequência de grupos sanguíneos","Embriologia dos anexos embrionários e da placenta","Citogenética e análise do cariótipo em metáfase","Farmacogenética, com polimorfismos individuais de resposta"],"c":3,"e":"A farmacogenética explica a variação individual de eficácia, dose necessária e efeitos adversos, útil para interpretar respostas a relaxantes musculares prescritos pela equipe.","d":3},{"t":"Caso de focomelia","q":"Um lactente apresenta focomelia e a mãe relata uso de talidomida no início da gestação. A interpretação mais adequada é:","o":["Quadro hereditário sem relação com a exposição gestacional à talidomida","Consequência de infecção congênita do grupo TORCH durante a gestação","Malformação congênita por teratógeno químico em período crítico","Efeito de radiação ionizante sobre a neurogênese do embrião"],"c":2,"e":"A talidomida é teratógeno químico clássico causador de focomelia; é malformação congênita resultante da interação agente, genótipo e período crítico.","d":3},{"t":"Caso de SAF","q":"Uma criança apresenta hipotonia e atraso motor, e a mãe relata consumo frequente de bebida alcoólica durante a gestação. Qual agente é o mais provável?","o":["Álcool etílico, consumido em excesso na gestação","Talidomida, associada a focomelia","Isotretinoína, associada a malformações do SNC","Radiação ionizante, associada a prejuízo da neurogênese"],"c":0,"e":"A apostila associa o álcool à síndrome alcoólica fetal, com hipotonia e atraso motor.","d":3},{"t":"Suscetibilidade individual","q":"Duas gestantes foram expostas ao mesmo teratógeno, na mesma dose e no mesmo período, mas só um dos bebês tem malformação. Qual a explicação mais coerente?","o":["O agente age apenas em uma das gestações, mesmo com exposição idêntica","Polimorfismos diferentes modularam a suscetibilidade de cada concepto","Teratógenos atuam independentemente do genótipo do concepto exposto","Ocorreu obrigatoriamente uma trissomia no bebê afetado, e não no outro"],"c":1,"e":"Conforme o gabarito, variantes em genes de metabolização e de vias de desenvolvimento tornam o indivíduo mais ou menos suscetível ao mesmo agente na mesma dose.","d":3}],"models":[["teratogenos","Períodos críticos"]]},{"id":"gen6","disc":"Genética","dk":"gen","n":12,"u":"VI","titulo":"Doenças Genéticas, Diagnóstico e Ética","cor":"#c48bff","resumo":[["Como classificar","Doenças monogênicas seguem herança mendeliana (DMD ligada ao X; AME e anemia falciforme autossômicas recessivas; distrofia miotônica dominante). As cromossômicas incluem Down, Turner e Klinefelter. As multifatoriais reúnem defeitos do tubo neural, fenda labial/palatina e muitas cardiopatias congênitas."],["Genética, hereditária, congênita","Genética é a alteração no material genético, herdada ou de novo (DMD pode ser mutação nova). Hereditária é necessariamente transmitida pelos gametas (AME). Congênita está presente ao nascer, por causa genética (Down) ou ambiental (mielomeningocele por falta de ácido fólico)."],["Aconselhamento e pré-natal","O aconselhamento é conduzido pelo geneticista clínico; o fisioterapeuta integra a equipe e informa sobre prognóstico funcional e desenvolvimento motor. O diagnóstico pré-natal permite preparar a fisioterapia neonatal para começar nos primeiros dias de vida."],["Ética na prática","Comunicar com sensibilidade expectativas realistas em doenças progressivas, respeitar a autonomia da família (aconselhamento não diretivo) e considerar a equidade de acesso a terapias gênicas de alto custo no SUS. Testes preditivos, inclusive em atletas jovens, são controversos pelo impacto psicológico e pela triagem precoce."],["Edição gênica e células-tronco","Edição somática altera só as células do paciente e é o modelo das terapias atuais para AME e DMD. A germinativa é transmissível e não é prática clínica. Células-tronco se autorrenovam e se diferenciam; o transplante hematopoético é consolidado, mas a regeneração muscular e neurológica ampla ainda é pesquisa."]],"q":[{"t":"Classificação","q":"A síndrome de Down é classificada como doença:","o":["Monogênica autossômica dominante, por mutação em um único gene","Monogênica ligada ao X, com herança recessiva em homens","Cromossômica numérica (trissomia do 21), visível ao cariótipo","Multifatorial, por interação de vários genes e fatores ambientais"],"c":2,"e":"A síndrome de Down é uma doença cromossômica numérica, causada pela trissomia do cromossomo 21 (47,XX/XY,+21).","d":1},{"t":"Classificação","q":"A distrofia muscular de Duchenne é classificada como doença:","o":["Cromossômica numérica, por trissomia de um autossomo","Monogênica, com herança recessiva ligada ao cromossomo X","Multifatorial, como os defeitos do tubo neural","Autossômica dominante, com herança em homens e mulheres"],"c":1,"e":"A DMD é monogênica (mendeliana) de herança ligada ao cromossomo X; a proteína alterada, a distrofina, é codificada no X.","d":1},{"t":"Aconselhamento ético","q":"Um dos principais dilemas éticos associados aos testes genéticos preditivos é:","o":["O alto custo do sequenciamento do genoma, que é o único obstáculo relevante","A ausência de padrão de herança conhecido para todas as doenças genéticas","A impossibilidade técnica de realizar o exame em pacientes assintomáticos","Revelar um futuro sem tratamento, com impacto psicológico e na autonomia"],"c":3,"e":"Segundo o gabarito da apostila, o dilema central é o impacto psicológico de conhecer com antecedência um destino sem intervenção terapêutica disponível.","d":1},{"t":"Aconselhamento genético","q":"Quem conduz o aconselhamento genético formal e qual o papel do fisioterapeuta nesse processo?","o":["Geneticista clínico; o fisioterapeuta atua indiretamente, na equipe","Fisioterapeuta; o geneticista apenas confirma o diagnóstico da família","Obstetra; o fisioterapeuta não participa do acompanhamento da família","Fisioterapeuta e enfermeiro, em conjunto, dispensando o geneticista"],"c":0,"e":"O aconselhamento é conduzido pelo geneticista clínico; o fisioterapeuta integra a equipe que acompanha a família, informando prognóstico funcional e desenvolvimento motor.","d":1},{"t":"Padrão de herança","q":"Qual padrão de herança a atrofia muscular espinhal (AME) e a anemia falciforme têm em comum?","o":["Autossômica dominante, como a distrofia miotônica","Autossômica recessiva, com pais portadores assintomáticos","Recessiva ligada ao X, como a distrofia muscular de Duchenne","Multifatorial, como a fenda labial e palatina"],"c":1,"e":"Tanto a AME quanto a anemia falciforme são doenças monogênicas de herança autossômica recessiva; por isso a AME é transmitida por pais portadores.","d":1},{"t":"Classificação","q":"Qual é o cariótipo da síndrome de Turner?","o":["45,X (monossomia do X, um único cromossomo X)","47,XXY (trissomia dos cromossomos sexuais, típica de homens)","47,XX,+21 (trissomia do 21, típica da síndrome de Down)","46,XY com deleção do cromossomo X inteiro"],"c":0,"e":"A síndrome de Turner é cromossômica, com cariótipo 45,X (monossomia do X). Down é +21 e Klinefelter é 47,XXY.","d":1},{"t":"Conceitos-chave","q":"Sobre as definições de doença genética, hereditária e congênita, está correta a afirmação:","o":["Doença congênita é sempre genética e sempre hereditária, pois nasce com o indivíduo","Doença genética é sempre hereditária, pois toda mutação é herdada dos pais e passa aos filhos","Doença hereditária é aquela presente ao nascimento, qualquer que seja a causa, genética ou ambiental","Doença genética pode surgir de novo; a hereditária exige transmissão pelos gametas"],"c":3,"e":"Genética: alteração no material genético, herdada ou de novo. Hereditária: transmitida pelos gametas. Congênita: presente ao nascimento, de causa genética ou ambiental.","d":2},{"t":"Conceitos-chave","q":"A mielomeningocele por deficiência de ácido fólico é exemplo de doença:","o":["Genética e hereditária, de herança recessiva transmitida por pais portadores","Congênita de causa ambiental (falta de ácido fólico), sem causa genética primária","Cromossômica numérica, como a síndrome de Down, por não disjunção","Hereditária, transmitida pelos gametas dos pais para os filhos"],"c":1,"e":"Está presente ao nascimento (congênita), mas a causa é ambiental (deficiência de ácido fólico); por isso não é hereditária. Nos defeitos do tubo neural o modelo é multifatorial.","d":2},{"t":"Edição gênica","q":"A diferença entre edição gênica somática e germinativa é que:","o":["A somática atinge células reprodutivas e a germinativa, só as células do paciente tratado","Ambas são transmitidas à descendência, mas só a somática é aprovada na prática clínica","A somática atinge só o paciente; a germinativa é transmitida à descendência","A germinativa é a usada nas terapias aprovadas para AME e DMD, e a somática não"],"c":2,"e":"A edição somática não é transmitida a descendentes e é o modelo das terapias atuais para AME e DMD. A germinativa é transmissível e não é prática clínica corrente.","d":2},{"t":"Terapia gênica","q":"O alto custo das novas terapias gênicas para AME e DMD levanta principalmente qual questão ética?","o":["A equidade de acesso às terapias no sistema de saúde, como o SUS","A obrigatoriedade de edição germinativa em todos os pacientes tratados","A perda da necessidade de qualquer reabilitação motora após a terapia","A proibição do uso de oligonucleotídeos antissenso pelo sistema de saúde"],"c":0,"e":"A apostila destaca que o custo elevadíssimo dessas terapias levanta questões de equidade de acesso no SUS.","d":2},{"t":"Diagnóstico pré-natal","q":"Qual a contribuição do diagnóstico pré-natal para a fisioterapia neonatal e pediátrica?","o":["Dispensa o acompanhamento do fisioterapeuta após o nascimento da criança afetada","Permite ao fisioterapeuta conduzir sozinho o aconselhamento genético formal da família","Elimina a necessidade de confirmar o diagnóstico após o nascimento, por qualquer exame","Permite preparar a fisioterapia para iniciar a intervenção nos primeiros dias de vida"],"c":3,"e":"Ao indicar uma condição com repercussão motora conhecida, o diagnóstico pré-natal permite que a fisioterapia neonatal/pediátrica esteja preparada para intervir desde os primeiros dias.","d":2},{"t":"Autonomia e ética","q":"Em doenças neuromusculares progressivas, o aconselhamento não diretivo é especialmente relevante porque:","o":["O profissional deve decidir pela família a intensidade da intervenção proposta","O prognóstico deve ser omitido para poupar a família de sofrimento","A família decide com autonomia sobre a intensidade da intervenção e a qualidade de vida","A decisão cabe exclusivamente ao geneticista clínico, sem participação familiar"],"c":2,"e":"A apostila relaciona o aconselhamento não diretivo à autonomia da família ao decidir sobre a intensidade da intervenção e a qualidade de vida.","d":2},{"t":"DMD e herança","q":"Menino de 4 anos usa o sinal de Gowers para levantar do chão. Diagnosticada DMD, a mãe, sem histórico familiar, pergunta como isso é possível. A resposta correta é que a DMD:","o":["É genética e pode surgir por mutação nova, sem ser herdada","É ambiental e causada por teratógeno durante a gestação da mãe","É cromossômica e detectável apenas no cariótipo da criança","É multifatorial, com contribuição do estilo de vida da família"],"c":0,"e":"A DMD é doença genética que pode surgir de novo (mutação nova), como exemplifica a apostila; o Gowers reflete fraqueza proximal de MMII pela ausência de distrofina.","d":3},{"t":"Down e cuidados","q":"Lactente com síndrome de Down inicia fisioterapia motora. Ao planejar mobilizações, o fisioterapeuta deve ter cautela especialmente com:","o":["A extensão de joelhos, por frouxidão ligamentar restrita aos joelhos","A flexão cervical, pelo risco de instabilidade atlantoaxial (C1-C2)","A rotação de quadril, por trissomia do cromossomo X nesses lactentes","A dorsiflexão de tornozelo, por deficiência de distrofina nos músculos"],"c":1,"e":"A frouxidão ligamentar da síndrome de Down aumenta o risco de instabilidade atlantoaxial, exigindo cuidado na flexão cervical.","d":3},{"t":"Ética e prognóstico","q":"Pais de um menino com DMD perguntam ao fisioterapeuta se ele voltará a andar melhor com o tempo. A postura mais adequada é:","o":["Prometer melhora contínua da marcha ao longo do tempo para manter a motivação da família","Evitar o assunto e encaminhar toda a comunicação ao geneticista clínico da equipe","Impor o plano de intervenção mais intenso, sem discutir opções com a família e o paciente","Comunicar expectativas realistas com sensibilidade, respeitando a autonomia da família"],"c":3,"e":"A apostila indica que o fisioterapeuta deve comunicar, com sensibilidade, expectativas realistas em doenças progressivas como a DMD, com aconselhamento não diretivo.","d":3},{"t":"Equidade e AME","q":"Dois lactentes com AME: um recebeu terapia gênica; o outro, sem acesso pelo custo, segue a evolução natural. A conduta fisioterapêutica coerente é:","o":["Aplicar o mesmo plano e as mesmas metas aos dois pacientes, sem distinção","Priorizar apenas o paciente tratado, por ter melhor prognóstico funcional","Replanejar continuamente as metas, adaptando-as de forma realista a cada cenário","Suspender a reabilitação do paciente sem acesso à terapia gênica"],"c":2,"e":"Segundo o gabarito, o fisioterapeuta deve atuar nos dois cenários, replanejando objetivos e adaptando metas funcionais realistas a cada contexto, o que também levanta a questão de equidade.","d":3},{"t":"Testes preditivos","q":"Um clube propõe testar o gene COL5A1 em atletas de 14 anos para prever risco de lesão e selecionar quem treina. O principal debate ético é:","o":["A impossibilidade biológica de existir qualquer gene ligado a tendões e ligamentos","Triagem genética precoce em jovens atletas, com valor preditivo ainda controverso","A obrigação legal de realizar aconselhamento pré-natal em todos os atletas","A transmissão do resultado à descendência do atleta por edição germinativa"],"c":1,"e":"O COL5A1 está ligado ao colágeno de tendões e ligamentos, mas o uso desses testes para prever performance ou lesão é controverso e levanta debate sobre triagem genética precoce.","d":3},{"t":"Anemia falciforme","q":"Adolescente com anemia falciforme apresenta dor no quadril por necrose avascular do fêmur. A alteração molecular de base dessa doença é:","o":["Deleção do gene da distrofina no cromossomo X, com perda de distrofina","Trissomia do cromossomo 21 com produção de hemoglobina S (HbS)","Mutação missense na beta-globina (ácido glutâmico por valina na posição 6)","Mutação no gene SMN1 com perda de motoneurônios da medula"],"c":2,"e":"A anemia falciforme (autossômica recessiva) resulta de mutação missense na beta-globina, gerando HbS; crise vaso-oclusiva óssea e necrose avascular do fêmur são manifestações osteoarticulares.","d":3}],"models":[["distrofina","Distrofina (DMD)"]]}];

<script>
(function () {
  const T = THREE, P = (x, y, z) => new T.Vector3(x, y, z);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (a, b, v) => { const u = clamp((v - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };

  /* sprite de texto (canvas procedural, sem asset externo) */
  function spr(str, sx, col) {
    const c = document.createElement("canvas"); c.width = 128; c.height = 64;
    const x = c.getContext("2d"); x.font = "bold 34px system-ui,Arial,sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
    x.lineWidth = 7; x.strokeStyle = "#06120c"; x.strokeText(str, 64, 34); x.fillStyle = col || "#eafff5"; x.fillText(str, 64, 34);
    const s = new T.Sprite(new T.SpriteMaterial({ map: new T.CanvasTexture(c), transparent: true, depthTest: false }));
    s.scale.set(sx, sx / 2, 1); s.renderOrder = 10; return s;
  }
  function mergeGeos(list) {
    const pos = [], nor = [];
    list.forEach(g => { const n = g.toNonIndexed(); for (const v of n.attributes.position.array) pos.push(v); for (const v of n.attributes.normal.array) nor.push(v); });
    const G = new T.BufferGeometry(); G.setAttribute("position", new T.Float32BufferAttribute(pos, 3)); G.setAttribute("normal", new T.Float32BufferAttribute(nor, 3)); return G;
  }
  function setTube(mesh, pts, rad) {
    if (pts.length < 4) { mesh.visible = false; return; }
    mesh.visible = true; const old = mesh.geometry;
    mesh.geometry = new T.TubeGeometry(new T.CatmullRomCurve3(pts), pts.length * 2, rad, 7, false); old.dispose();
  }

  window.MODELS = window.MODELS || {};
  Object.assign(window.MODELS, {

    /* ================= DNA: dupla hélice e replicação ================= */
    dna() {
      const g = new T.Group();
      const NP = 20, STEP = .22, Y0 = -(NP - 1) * STEP / 2, R = .5, K = 2 * Math.PI / 2.2, YMIN = -2.2, YMAX = 2.12;
      const seq = "ATGCCGATTAGCTCGAATGC";
      const comp = { A: "T", T: "A", C: "G", G: "C" };
      const bcol = { A: 0xe8695b, T: 0xf2c14e, C: 0x5cb8ff, G: 0xc48bff };
      const bmat = {}; Object.keys(bcol).forEach(k => bmat[k] = M3(bcol[k]));
      const hbMat = M3(0xffffff, 1, { emissive: 0xffffff, emissiveIntensity: .3 });
      const half = new T.CylinderGeometry(.075, .075, .34, 10).rotateZ(Math.PI / 2);
      const cyl = (yy) => new T.CylinderGeometry(.018, .018, .17, 6).rotateZ(Math.PI / 2).translate(0, yy, 0);
      const bond2 = mergeGeos([cyl(-.04), cyl(.04)]), bond3 = mergeGeos([cyl(-.075), cyl(0), cyl(.075)]);
      let yf = 0;
      const dOf = y => { if (y >= yf) return 0; const u = Math.min(1, (yf - y) / 1.1); return .95 * u * u * (3 - 2 * u); };
      const phi = y => K * y + .4;

      function mkRung(i) {
        const gp = new T.Group(), a = new T.Mesh(half, bmat[seq[i]]), b = new T.Mesh(half, bmat[comp[seq[i]]]);
        a.position.x = .25; b.position.x = -.25;
        const h = new T.Mesh("AT".includes(seq[i]) ? bond2 : bond3, hbMat);
        gp.add(a, b, h); g.add(gp); return { gp, a, b, h };
      }
      const par = [], lef = [], rig = [];
      for (let i = 0; i < NP; i++) { par.push(mkRung(i)); lef.push(mkRung(i)); rig.push(mkRung(i)); }

      const cA = 0x39d98a, cB = 0x21c7c7, cN = 0xeafff5;
      const mk = (c) => new T.Mesh(new T.BufferGeometry(), M3(c, 1, { roughness: .4 }));
      const oldA = mk(cA), oldB = mk(cB), newL = mk(cN), frags = [];
      g.add(oldA, oldB, newL);
      const NF = 8, FL = .55;
      for (let j = 0; j < NF; j++) { const m = mk(cN); frags.push(m); g.add(m); }

      const polM = () => M3(0xd9d4ff, 1, { emissive: 0x6a5cff, emissiveIntensity: .25 });
      const polL = new T.Mesh(new T.SphereGeometry(1, 20, 14), polM()); polL.scale.set(.24, .3, .24);
      const polG = new T.Mesh(new T.SphereGeometry(1, 20, 14), polM()); polG.scale.set(.24, .3, .24);
      const hel = new T.Mesh(new T.TorusGeometry(.74, .11, 12, 36).rotateX(Math.PI / 2), M3(0xff8a3d, 1, { emissive: 0x5a2000, emissiveIntensity: .4 }));
      const lig = new T.Mesh(new T.TorusGeometry(.13, .045, 10, 20).rotateX(Math.PI / 2), M3(0xff7a9c, 1, { emissive: 0x501020, emissiveIntensity: .4 }));
      g.add(polL, polG, hel, lig);

      const coneA = new T.Mesh(new T.ConeGeometry(.1, .24, 12), M3(cA)), coneB = new T.Mesh(new T.ConeGeometry(.1, .24, 12), M3(cB));

      const tang = (y, off) => { const ph = phi(y) + off; return P(-R * K * Math.sin(ph), 1, R * K * Math.cos(ph)).normalize(); };
      const YU = P(0, 1, 0);
      const spt = (y, side, off) => { const ph = phi(y) + off; return P(side * dOf(y) + R * Math.cos(ph), y, R * Math.sin(ph)); };
      const strand = (side, off, y0, y1) => { const a = []; for (let y = y0; y <= y1 + 1e-6; y += .05) a.push(spt(y, side, off)); return a; };
      let ligJ = -1, leadHi = 0, lagHi = 0;

      function build(s) {
        yf = -2.0 + 3.75 * s / 100; leadHi = yf - .3; lagHi = yf - .55;
        setTube(oldA, strand(-1, 0, YMIN, YMAX), .06);
        setTube(oldB, strand(1, Math.PI, YMIN, YMAX), .06);
        setTube(newL, strand(-1, Math.PI, YMIN, Math.min(leadHi, YMAX)), .06);
        ligJ = -1;
        for (let j = 0; j < NF; j++) {
          const a = YMIN + FL * j, b = a + FL;
          const nonLigTop = b >= yf - 1.3, nonLigBot = j > 0 && (a >= yf - 1.3);
          const lo = a + (nonLigBot ? .05 : 0), hi = Math.min(b - (nonLigTop ? .05 : 0), lagHi);
          if (!nonLigTop) ligJ = j;
          if (hi - lo < .18) frags[j].visible = false; else setTube(frags[j], strand(1, 0, lo, hi), .06);
        }
        for (let i = 0; i < NP; i++) {
          const y = Y0 + i * STEP, d = dOf(y), th = -phi(y), isP = y >= yf;
          par[i].gp.visible = isP; par[i].gp.position.set(0, y, 0); par[i].gp.rotation.y = th;
          lef[i].gp.visible = !isP; lef[i].gp.position.set(-d, y, 0); lef[i].gp.rotation.y = th;
          rig[i].gp.visible = !isP; rig[i].gp.position.set(d, y, 0); rig[i].gp.rotation.y = th;
          const lNew = y < leadHi, rNew = y < lagHi;
          lef[i].b.visible = lNew; lef[i].h.visible = lNew;
          rig[i].a.visible = rNew; rig[i].h.visible = rNew;
        }
        hel.position.set(0, yf + .17, 0);
        const lv = leadHi > YMIN + .1, gv = lagHi > YMIN + .1;
        polL.visible = lv; polG.visible = gv;
        if (lv) { const ph = phi(leadHi) + Math.PI; polL.position.copy(spt(leadHi, -1, Math.PI)).add(P(Math.cos(ph), 0, Math.sin(ph)).multiplyScalar(.12)); }
        if (gv) { const ph = phi(lagHi); polG.position.copy(spt(lagHi, 1, 0)).add(P(Math.cos(ph), 0, Math.sin(ph)).multiplyScalar(.12)); }

        coneA.position.copy(spt(YMAX, 0, 0)); coneA.quaternion.setFromUnitVectors(YU, tang(YMAX, 0));
        coneB.position.copy(spt(YMIN + .1, 1, Math.PI)); coneB.quaternion.setFromUnitVectors(YU, tang(YMIN + .1, Math.PI).negate());
      }
      build(45);

      const ctr = i => { const y = Y0 + i * STEP; return y >= yf ? P(0, y, 0) : P(-dOf(y), y, 0); };
      return {
        group: g, dist: 7.2, rot: [.12, -.55],
        hint: "Arraste o controle para abrir a hélice a partir de baixo. Verde e azul-piscina: fitas antigas; branco: fitas novas.",
        slider: {
          label: "Replicação", val: 45,
          fmt: v => v < 6 ? "Antes da replicação: dupla-hélice íntegra, com as fitas antiparalelas pareadas por pontes de hidrogênio" : v < 35 ? "Início: a helicase abre a hélice e forma a forquilha; cada fita antiga vira molde" : v < 70 ? "A DNA polimerase sintetiza 5'→3': fita contínua de um lado e fragmentos de Okazaki do outro" : "A DNA ligase une os fragmentos de Okazaki; resultam duas moléculas, cada uma com uma fita antiga e uma nova (semiconservativa)",
          on: build

        update(t) { hel.rotation.y = t * .8; const k = 1 + .06 * Math.sin(t * 5); polL.scale.set(.24 * k, .3, .24 * k); polG.scale.set(.24 * k, .3, .24 * k); },
        labels: [
          { n: "Esqueleto açúcar-fosfato", d: "Cada fita tem um esqueleto formado por açúcar (desoxirribose) e fosfato, que enrola em hélice. As duas fitas são antiparalelas: uma corre no sentido 5'→3' e a outra no 3'→5'.", p: () => spt(1.95, -1, 0) },
          { n: "Par A-T", d: "Adenina (coral) pareia com timina (âmbar) por 2 pontes de hidrogênio. É a complementaridade que permite copiar a fita.", p: () => ctr(16) },
          { n: "Par C-G", d: "Citosina (azul) pareia com guanina (roxo) por 3 pontes de hidrogênio, o que deixa esse par mais estável que o A-T.", p: () => ctr(13) },
          { n: "Pontes de hidrogênio", d: "Ligações fracas entre as bases complementares: 2 no par A-T e 3 no par C-G. Por serem fracas, a helicase consegue separar as fitas.", p: () => ctr(10) },
          { n: "Helicase", d: "Enzima que abre a dupla-hélice na forquilha, rompendo as pontes de hidrogênio entre as fitas.", p: () => P(0, yf + .17, .78) },
          { n: "DNA polimerase", d: "Sintetiza a fita nova no sentido 5'→3', pareando nucleotídeos complementares à fita-molde. Cada fita antiga serve de molde.", p: () => polL.visible ? polL.position.clone() : P(-.4, -2, .6) },
          { n: "Forquilha de replicação", d: "Ponto em que a hélice está se abrindo: acima dela a molécula ainda é uma só, abaixo já estão as duas fitas-molde separadas, cada uma pareando com uma fita nova.", p: () => P(0, yf - .2, 0) },
          { n: "DNA ligase e fragmentos de Okazaki", d: "Em uma das fitas a síntese é descontínua, em pequenos fragmentos (fragmentos de Okazaki). A DNA ligase une esses fragmentos e fecha a fita.", p: () => lig.visible ? lig.position.clone() : spt(-1.6, 1, 0) }
        ]
      };
    },

    /* ================= Tradução: do mRNA à proteína ================= */
    traducao() {
      const g = new T.Group(), w = new T.Group(), OY = -.55; w.position.y = OY; g.add(w);
      const Q = (x, y, z) => P(x, y + OY, z);
      const W = .5, KM = 5, xc = c => (c - 3) * W;
      const CD = [["AUG", "Met", 0x39d98a], ["GCU", "Ala", 0xf2c14e], ["AAA", "Lys", 0x5cb8ff], ["GUG", "Val", 0xc48bff], ["CUG", "Leu", 0xe8695b], ["UGG", "Trp", 0x2ee6d6], ["UAA", "Parada", 0xff5c5c]];
      const NAME = { Met: "metionina", Ala: "alanina", Lys: "lisina", Val: "valina", Leu: "leucina", Thr: "treonina", Trp: "triptofano", Glu: "ácido glutâmico" };
      const rc = { A: 0xe8695b, U: 0xf2c14e, G: 0xc48bff, C: 0x5cb8ff }, rcomp = { A: "U", U: "A", G: "C", C: "G" };
      const rmat = {}; Object.keys(rc).forEach(k => rmat[k] = M3(rc[k]));
      const anti = cod => cod.split("").map(c => rcomp[c]).join("");

      /* mRNA */
      const tube = new T.Mesh(new T.CylinderGeometry(.05, .05, 4.5, 10).rotateZ(Math.PI / 2), M3(0xcfeee0)); w.add(tube);
      const bw = (W - .04) / 3;
      CD.forEach((c, i) => {
        const fr = new T.Mesh(new T.BoxGeometry(W - .02, .2, .3), M3(c[2], .3, { depthWrite: false })); fr.position.x = xc(i); w.add(fr);
        for (let b = 0; b < 3; b++) { const bx = new T.Mesh(new T.BoxGeometry(bw - .02, .12, .2), rmat[c[0][b]]); bx.position.set(xc(i) + (b - 1) * bw, 0, 0); w.add(bx); }
        const s = spr(c[0], .5, i === 0 ? "#7dffc4" : i === 6 ? "#ff8a8a" : "#eafff5"); s.position.set(xc(i), -.22, .1); w.add(s);
      });
      const s5 = spr("5'", .4), s3 = spr("3'", .4); s5.position.set(-2.15, .18, 0); s3.position.set(2.15, .18, 0); w.add(s5, s3);

      const big = new T.Mesh(new T.SphereGeometry(1, 36, 18, 0, Math.PI * 2, 0, Math.PI / 2), M3(0x39d98a, .3, { depthWrite: false })); big.scale.set(.72, 1.08, .42); big.position.y = .04;
      const sml = new T.Mesh(new T.SphereGeometry(1, 36, 18, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), M3(0x1f8f7d, .78, { depthWrite: false })); sml.scale.set(.66, .36, .4); sml.position.y = -.03;

      const bodyM = M3(0xd7e3ff);
      function mkT(x) {
        const t = new T.Group(); t.position.x = x; rb.add(t);

        const lp = new T.Mesh(new T.TorusGeometry(.05, .016, 8, 16), bodyM); lp.position.y = .2; t.add(lp);
        [-1, 1].forEach(sd => {
          const ar = new T.Mesh(new T.TorusGeometry(.04, .014, 8, 14), bodyM); ar.position.set(sd * .11, .58, 0); t.add(ar);
          const br = new T.Mesh(new T.CylinderGeometry(.012, .012, .07, 6).rotateZ(Math.PI / 2), bodyM); br.position.set(sd * .035, .58, 0); t.add(br);
        });
        const bead = new T.Mesh(new T.SphereGeometry(.075, 14, 10), M3(0xffffff)); bead.position.y = .8; t.add(bead);
        const bx = [0, 1, 2].map(b => { const m = new T.Mesh(new T.BoxGeometry(bw - .02, .07, .2), rmat.A); m.position.set((b - 1) * bw, .115, 0); t.add(m); return m; });
        return { t, bead, bx };
      }

      const beads = [], links = [];
      for (let j = 0; j < 6; j++) { const b = new T.Mesh(new T.SphereGeometry(.09, 14, 10), M3(0xffffff)); rb.add(b); beads.push(b); }
      for (let j = 0; j < 5; j++) { const l = new T.Mesh(new T.CylinderGeometry(.028, .028, 1, 6), M3(0xeafff5)); rb.add(l); links.push(l); }

      let K = 0, cur = xc(0) + W / 2, tgt = cur, last = 0;
      const YU = P(0, 1, 0);
      function setAnti(tr, cod) { for (let b = 0; b < 3; b++) tr.bx[b].material = rmat[rcomp[cod[b]]]; }
      function setState(k) {
        K = k; tgt = xc(k) + W / 2;
        setAnti(tP, CD[k][0]); tP.bead.visible = false;
        tA.t.visible = k >= 1 && k < KM;
        if (k >= 1 && k < KM) { setAnti(tA, CD[k + 1][0]); tA.bead.material.color.setHex(CD[k + 1][2]); tA.bead.visible = true; }
        const n = k + 1, lift = k === KM ? P(-.16, .36, 0) : P(0, 0, 0), pos = [];
        for (let j = 0; j < 6; j++) {
          const b = beads[j]; b.visible = j < n;
          if (j < n) { b.material.color.setHex(CD[k - j][2]); const p = P(-W / 2 - .13 * j, .8 + .22 * j, .09 * Math.sin(j * 1.2)); if (k === KM) p.add(lift); b.position.copy(p); pos.push(p); }
        }
        for (let j = 0; j < 5; j++) {
          const l = links[j]; l.visible = j < n - 1;
          if (j < n - 1) { const a = pos[j], b = pos[j + 1], d = b.clone().sub(a), len = d.length(); l.scale.set(1, len, 1); l.position.copy(a).addScaledVector(d, .5); l.quaternion.setFromUnitVectors(YU, d.normalize()); }
        }
      }
